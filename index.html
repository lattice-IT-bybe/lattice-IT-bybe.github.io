<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>个人主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --veil-photo: rgba(236, 236, 238, .58);
        --bg: #e8e8e8;
        --surface: #ffffff;
        --ink: #1b1b1d;
        --ink-2: #4a4a4e;
        --ink-3: #83838a;
        --line: #d9d9dc;
        --line-strong: #c2c2c7;
        --accent: #bc3a22;
        --accent-ink: #ffffff;
        --accent-soft: #f9ece8;
        --seal: #bc3a22;
        --chip-bg: #ffffff;
        --card-shadow: 0 1px 3px rgba(20, 20, 25, .07), 0 6px 18px rgba(20, 20, 25, .05);
        --card-shadow-hover: 0 4px 10px rgba(20, 20, 25, .12), 0 26px 48px rgba(20, 20, 25, .22);
        --bg-a: #e7e9ec;
        --bg-b: #d8e3ef;
        --bg-c: #f0e6cb;
        --bg-d: #e1e5ea;
        --ripple: rgba(188, 58, 34, .22);
        --glare: rgba(255, 255, 255, .5);
        --focus-ring: #bc3a22;
        color-scheme: light;
      }
      /* 深色变量：系统深色（且未手动选浅色）时，或手动选深色时，共用同一套 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --veil-photo: rgba(13, 13, 15, .62);
          --bg: #171719;
          --surface: #232326;
          --ink: #f0efe9;
          --ink-2: #c6c3ba;
          --ink-3: #96928a;
          --line: #333336;
          --line-strong: #4a4a4f;
          --accent: #e0684c;
          --accent-ink: #1a0f0b;
          --accent-soft: #33201a;
          --seal: #c8452a;
          --chip-bg: #232326;
          --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
          --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
          --bg-a: #14161c;
          --bg-b: #1b2438;
          --bg-c: #242017;
          --bg-d: #171b24;
          --ripple: rgba(224, 104, 76, .3);
          --glare: rgba(255, 255, 255, .18);
          --focus-ring: #e0684c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --veil-photo: rgba(13, 13, 15, .62);
        --bg: #171719;
        --surface: #232326;
        --ink: #f0efe9;
        --ink-2: #c6c3ba;
        --ink-3: #96928a;
        --line: #333336;
        --line-strong: #4a4a4f;
        --accent: #e0684c;
        --accent-ink: #1a0f0b;
        --accent-soft: #33201a;
        --seal: #c8452a;
        --chip-bg: #232326;
        --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
        --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
        --bg-a: #14161c;
        --bg-b: #1b2438;
        --bg-c: #242017;
        --bg-d: #171b24;
        --ripple: rgba(224, 104, 76, .3);
        --glare: rgba(255, 255, 255, .18);
        --focus-ring: #e0684c;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        /* #095 动态渐变加强：浅灰 + 淡蓝 + 淡金之间大幅流动，渐变图 400%，8s 一个循环 */
        background: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d));
        background-size: 400% 400%;
        animation: bg-flow 8s ease infinite;
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
      }
      /* ---------- 人物专属背景图：固定铺满 + 主题遮罩（只在配了 bg 的人物页显示） ----------
         照片用真实 <img> 固定层（与头像、图标同一条加载路径，最稳），图片地址来自人物数据的 bg 字段，
         由路由在进入人物页时写入、离开时撤掉（body.view-fupan-photo 类控制显隐）；
         照片上面只压一层半透明雾面（--veil-photo 按主题切换），
         卡片本身是不透明的 var(--surface) 底，文字清晰；标题等卡外文字靠雾面保证可读。
         人物列表页、没有 bg 的人物页、文章阅读页、站点主页都不显示照片，
         露出 body 本身的动态渐变底。 */
      .bg-photo {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; object-position: 85% 50%;
        z-index: -2;
        pointer-events: none;
        user-select: none;
        display: none;
      }
      body.view-fupan-photo .bg-photo { display: block; }
      body::after {
        content: ""; position: fixed; inset: 0;
        pointer-events: none;
      }
      body.view-fupan-photo::after {
        z-index: -1;
        background: linear-gradient(var(--veil-photo), var(--veil-photo));
      }
      button { min-height: 2.75rem; font: inherit; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

      .wrap { max-width: 620px; margin: 0 auto; padding: 0 18px 72px; }

      /* ---------- Profile head ---------- */
      .profile { padding: 44px 0 4px; text-align: center; }
      .avatar {
        display: block;
        width: 104px; height: 104px; margin: 0 auto;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 4px rgba(255,255,255,.25), var(--card-shadow);
        user-select: none;
      }
      h1 {
        font-family: "Noto Serif SC", serif;
        font-weight: 900;
        font-size: clamp(34px, 8vw, 44px);
        line-height: 1.2;
        margin: 20px 0 0;
      }
      .tagline {
        margin: 8px 0 0;
        font-size: clamp(15px, 4vw, 17px);
        color: var(--ink-2);
        font-weight: 500;
      }
      .socials { display: flex; justify-content: center; gap: 26px; margin-top: 24px; }
      .soc {
        width: 48px; height: 48px; min-height: 48px;
        display: inline-flex; align-items: center; justify-content: center;
        border: none; background: none; padding: 0;
        color: var(--ink);
        border-radius: 50%;
        text-decoration: none;
      }
      .soc svg { width: 27px; height: 27px; fill: currentColor; display: block; }
      .soc:active { transform: translateY(1px); }

      /* ---------- Sections ---------- */
      section { padding-top: 44px; }
      .sec-title {
        text-align: center;
        font-size: 19px; font-weight: 700;
        margin: 0 0 18px;
        letter-spacing: .02em;
      }

      /* ---------- Referral cards ---------- */
      .ref-card {
        display: flex; align-items: center; gap: 6px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        padding: 10px 12px 10px 10px;
        margin-bottom: 14px;
      }
      .ref-main {
        flex: 1; min-width: 0;
        display: flex; align-items: center; gap: 14px;
        text-decoration: none; color: var(--ink);
        border-radius: 10px;
        padding: 4px 2px;
      }
      .ref-ic {
        flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .ref-ic svg { width: 50px; height: 50px; display: block; }
      .ref-ic img { width: 50px; height: 50px; display: block; object-fit: cover; }
      .ref-text { flex: 1; min-width: 0; }
      .ref-name { display: block; font-size: 16.5px; font-weight: 700; line-height: 1.35; }
      .ref-desc { display: block; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin-top: 1px; }
      .ref-desc .code { font-family: "IBM Plex Mono", monospace; font-weight: 500; color: var(--ink); }
      .ref-desc .save {
        display: inline-block;
        background: var(--accent); color: var(--accent-ink);
        font-size: 12px; font-weight: 700; line-height: 1.5;
        border-radius: 5px; padding: 0 6px; margin-left: 6px;
        vertical-align: 1px;
      }
      .ref-go { flex: 0 0 auto; color: var(--ink-3); display: inline-flex; }
      .ref-go svg { width: 18px; height: 18px; }
      .copy-btn {
        flex: 0 0 auto;
        min-height: 2.75rem;
        display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink-2);
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13.5px; font-weight: 500;
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .copy-btn { background: var(--surface); border-color: var(--line-strong); } }
      :root[data-theme="dark"] .copy-btn { background: var(--surface); border-color: var(--line-strong); }
      .copy-btn svg { width: 14px; height: 14px; }
      .ref-note { text-align: center; font-size: 13px; color: var(--ink-3); margin: 4px 0 0; }

      /* ---------- 交易所返佣：左右并排两列（桌面与手机均保持两列） ---------- */
      .ex-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        margin-bottom: 14px;
      }
      .ex-grid .ref-card {
        margin-bottom: 0;
        flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 10px;
        padding: 14px 12px 12px;
      }
      .ex-grid .ref-main {
        flex-direction: column; align-items: center; text-align: center;
        gap: 8px; padding: 2px;
      }
      .ex-grid .ref-ic { width: 44px; height: 44px; }
      .ex-grid .ref-ic svg, .ex-grid .ref-ic img { width: 44px; height: 44px; }
      .ex-grid .ref-text { text-align: center; }
      .ex-grid .ref-name { font-size: 15.5px; }
      .ex-grid .ref-desc { font-size: 12.5px; line-height: 1.5; }
      .ex-grid .ref-desc .code { white-space: nowrap; letter-spacing: -.01em; }
      .ex-grid .ref-desc .save { font-size: 11px; padding: 0 5px; margin-left: 4px; }
      .ex-grid .ref-go { display: none; }
      .ex-grid .copy-btn { justify-content: center; width: 100%; margin-left: 0; padding: 6px 8px; font-size: 13px; }

      /* ---------- Motion（#074 / #081 / #085 / #095 / #096 / #153） ---------- */
      @keyframes bg-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* #096 悬浮加强：头像上下浮动幅度 14px，2.8s 往返一次 */
      @keyframes avatar-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      .avatar { animation: avatar-float 2.8s ease-in-out infinite; }

      /* #096 呼吸光圈：头像外圈圆环缓慢放大并淡出，2.8s 一次脉冲 */
      .avatar-wrap { position: relative; display: inline-block; }
      .avatar-wrap::after {
        content: "";
        position: absolute; inset: -3px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
        pointer-events: none;
        animation: halo-pulse 2.8s ease-out infinite;
      }
      @keyframes halo-pulse {
        0% { transform: scale(1); opacity: .55; }
        70% { opacity: 0; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      /* #074 滚动淡入加强：从下方 60px 处 0.9s 上移淡入，同时由 0.96 放大到 1，--d 控制依次延迟（0.15s 递增）。
         隐藏的起始状态只挂在 html.js 下：头部小脚本一跑就打标，主脚本随后接管淡入；
         若主脚本迟迟没到（文件大、网速慢）或被拦，卡片保持可见，绝不出现「只剩标题没有卡片」。 */
      html.js .reveal {
        opacity: 0;
        transform: translateY(60px) scale(.96);
        transition: opacity .9s ease var(--d, 0s), transform .9s ease var(--d, 0s), box-shadow .3s ease 0s;
      }
      html.js .reveal.in { opacity: 1; transform: translateY(0) scale(1); }
      /* 淡入结束后清掉延迟，并把过渡切回悬停/倾斜用的短过渡 */
      html.js .reveal.done {
        transition: opacity .3s ease 0s, transform .25s ease-out 0s, box-shadow .3s ease 0s;
      }

      /* #081 悬停抬升加强：0.3s 内抬高 14px、放大到 1.03、阴影明显加深；仅对有悬停能力的设备生效 */
      @media (hover: hover) and (pointer: fine) {
        .ref-card:hover {
          transform: translateY(-14px) scale(1.03);
          box-shadow: var(--card-shadow-hover);
        }
        /* #153 3D 倾斜的反光层：跟随 --mx / --my 移动 */
        .ref-card:hover::after { opacity: 1; }
      }

      /* #153 反光层：径向高光，位置由 JS 写入的 --mx / --my 控制 */
      .ref-card { position: relative; overflow: hidden; }
      .ref-card::after {
        content: "";
        position: absolute; inset: 0; z-index: 2;
        background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--glare), transparent 65%);
        opacity: 0;
        transition: opacity .3s ease;
        pointer-events: none;
      }

      /* #085 涟漪：点击处扩散一圈波纹，0.6s 淡去（尺寸与位置由 JS 写入） */
      .soc { position: relative; overflow: hidden; }
      .ripple {
        position: absolute; z-index: 3;
        border-radius: 50%;
        background: var(--ripple);
        pointer-events: none;
        animation: ripple .6s ease-out forwards;
      }
      @keyframes ripple {
        0% { transform: scale(0); opacity: .9; }
        100% { transform: scale(1); opacity: 0; }
      }

      footer {
        margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line-strong);
        text-align: center;
        font-size: 13px; color: var(--ink-3);
      }

      .toast {
        position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
        transform: translate(-50%, 16px);
        background: var(--ink); color: var(--bg);
        font-size: 14px; padding: 10px 18px; border-radius: 8px;
        opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
        z-index: 50; max-width: calc(100vw - 40px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- Theme pour：主题切换按钮 ---------- */
      .theme-toggle {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        right: 18px;
        z-index: 100;
        width: 50px; height: 50px; min-height: 50px;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--card-shadow);
        transition: transform .25s ease, box-shadow .25s ease;
      }
      .theme-toggle svg { width: 23px; height: 23px; display: block; }
      .theme-toggle:active { transform: translateY(1px) scale(.96); }
      @media (hover: hover) and (pointer: fine) {
        .theme-toggle:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
      }

      /* ---------- Theme pour：倾泻覆盖层（液面逐帧由 JS 用 clip-path 重建） ---------- */
      .pour-wrap {
        position: fixed; inset: 0;
        z-index: 90;
        pointer-events: none;
        visibility: hidden;
      }
      .pour-wrap.on { visibility: visible; }
      .pour-fill {
        position: absolute; inset: 0;
        will-change: clip-path;
      }
      /* 副本层主题变量：副本根节点带目标主题（data-theme），整套变量与 :root 的浅/深两套一致，
         副本里的文字、卡片、背景都按新主题呈现，不影响底层原页面 */
      .pour-fill[data-theme="light"] {
        --veil-photo: rgba(236, 236, 238, .58);
        --bg: #e8e8e8;
        --surface: #ffffff;
        --ink: #1b1b1d;
        --ink-2: #4a4a4e;
        --ink-3: #83838a;
        --line: #d9d9dc;
        --line-strong: #c2c2c7;
        --accent: #bc3a22;
        --accent-ink: #ffffff;
        --accent-soft: #f9ece8;
        --seal: #bc3a22;
        --chip-bg: #ffffff;
        --card-shadow: 0 1px 3px rgba(20, 20, 25, .07), 0 6px 18px rgba(20, 20, 25, .05);
        --card-shadow-hover: 0 4px 10px rgba(20, 20, 25, .12), 0 26px 48px rgba(20, 20, 25, .22);
        --bg-a: #e7e9ec;
        --bg-b: #d8e3ef;
        --bg-c: #f0e6cb;
        --bg-d: #e1e5ea;
        --ripple: rgba(188, 58, 34, .22);
        --glare: rgba(255, 255, 255, .5);
        --focus-ring: #bc3a22;
        color-scheme: light;
      }
      .pour-fill[data-theme="dark"] {
        --veil-photo: rgba(13, 13, 15, .62);
        --bg: #171719;
        --surface: #232326;
        --ink: #f0efe9;
        --ink-2: #c6c3ba;
        --ink-3: #96928a;
        --line: #333336;
        --line-strong: #4a4a4f;
        --accent: #e0684c;
        --accent-ink: #1a0f0b;
        --accent-soft: #33201a;
        --seal: #c8452a;
        --chip-bg: #232326;
        --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
        --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
        --bg-a: #14161c;
        --bg-b: #1b2438;
        --bg-c: #242017;
        --bg-d: #171b24;
        --ripple: rgba(224, 104, 76, .3);
        --glare: rgba(255, 255, 255, .18);
        --focus-ring: #e0684c;
        color-scheme: dark;
      }
      /* 副本层底色：跟随当前视图——在配了专属背景的人物页触发倾泻时是该人物的背景图
         + 目标主题遮罩 + 动态渐变（JS 按当前人物 bg 写入图片地址，并同步动画相位，
         收尾交接无跳变，背景与遮罩浓度不跳变）；
         其他视图（主页、人物列表、无 bg 的人物页、阅读页）触发时加 .pour-nophoto，
         只用渐变，与那些页面本身的渐变底一致 */
      @keyframes pour-bg-flow {
        0% { background-position: center, center, 0% 50%; }
        50% { background-position: center, center, 100% 50%; }
        100% { background-position: center, center, 0% 50%; }
      }
      .pour-fill {
        background-image:
          linear-gradient(var(--veil-photo), var(--veil-photo)),
          url("assets/8d0bc96102ec.jpg"),
          linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d));
        background-size: auto, cover, 400% 400%;
        background-position: center, center, 0% 50%;
        animation: pour-bg-flow 8s ease infinite;
        color: var(--ink);
        overflow: hidden;
      }
      .pour-fill.pour-nophoto {
        background-image: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d));
        background-size: 400% 400%;
        animation: bg-flow 8s ease infinite;
      }
      /* 页面副本：由 JS 按原页面位置像素级定位，不可点击，静态呈现 */
      .pour-scene { position: absolute; margin: 0; pointer-events: none; }
      .pour-fill .pour-scene * { animation: none !important; transition: none !important; }
      .pour-fill .reveal { opacity: 1 !important; transform: none !important; }
      .pour-fill .avatar-wrap::after, .pour-fill .ref-card::after { display: none !important; }
      .pour-fill[data-theme="dark"] .copy-btn { background: var(--surface); border-color: var(--line-strong); }
      .pour-edge {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        overflow: visible;
      }
      .pour-edge path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pour-edge .edge-glow { stroke-width: 9; opacity: .28; }
      .pour-edge .edge-line { stroke-width: 3; }
      .pour-wrap[data-pour="dark"] .pour-edge path { stroke: #ff9d85; }
      .pour-wrap[data-pour="light"] .pour-edge path { stroke: #e0684c; }
      /* 从按钮落向底部的墨流：转场开头的一小段 */
      .pour-stream {
        position: absolute;
        width: 5px;
        border-radius: 3px;
        opacity: 0;
        transform-origin: top center;
      }
      .pour-wrap[data-pour="dark"] .pour-stream { background: #232326; }
      .pour-wrap[data-pour="light"] .pour-stream { background: #ffffff; }

      /* ---------- 复盘合集：主页入口卡 ---------- */
      .fp-entry {
        display: flex; align-items: center; gap: 14px;
        background: var(--surface);
        border-radius: 16px;

        /* ---------- #074 滚动淡入：进入视口时依次淡入 ----------
           提前量用固定像素（600px）而不是百分比：个别浏览器对百分比
           rootMargin 的处理有差异，曾出现观察器迟迟不触发、卡片停在
           不可见状态。再加一道兜底扫描：滚动、改尺寸、以及开页后两次
           定时，把视口附近仍没被观察器点亮的卡片直接点亮。 */
        function initReveal() {
          var els = document.querySelectorAll(".reveal");
          function show(el) {
            if (el.classList.contains("in")) return;
            el.classList.add("in");
            var d = parseFloat(window.getComputedStyle(el).getPropertyValue("--d")) || 0;
            /* 淡入（0.9s + 延迟）结束后切到悬停/倾斜用的短过渡 */
            setTimeout(function () { el.classList.add("done"); }, (d + 0.95) * 1000);
          }
          if (!("IntersectionObserver" in window)) {
            els.forEach(show);
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                show(entry.target);
                io.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12, rootMargin: "0px 0px 600px 0px" });
          els.forEach(function (el) { io.observe(el); });
          function sweep() {
            var vh = window.innerHeight || document.documentElement.clientHeight || 0;
            els.forEach(function (el) {
              if (el.classList.contains("in")) return;
              var r = el.getBoundingClientRect();
              if (r.top < vh + 600 && r.bottom > -600) { show(el); io.unobserve(el); }
            });
          }
          var sweepQueued = false;
          function queueSweep() {
            if (sweepQueued) return;
            sweepQueued = true;
            setTimeout(function () { sweepQueued = false; sweep(); }, 120);
          }
          window.addEventListener("scroll", queueSweep, { passive: true });
          window.addEventListener("resize", queueSweep);
          setTimeout(sweep, 900);
          setTimeout(sweep, 2500);
        }

        var sysDark = window.matchMedia("(prefers-color-scheme: dark)");

        /* 倾泻：液面约 1.2s 从底部涨满全屏。液面以下不是纯色盖层，而是整页内容的副本——
           副本强制套用目标主题，液面升到哪，内容就以新主题的样子被逐行揭示；
           涨满后底层原页面正式切到目标主题并移除副本，无缝收尾 */
        var pouring = false;
        function pourTo(target) {
          if (pouring) return;
          var wrap = $("pourWrap"), fill = $("pourFill"),
              glow = $("pourEdgeGlow"), line = $("pourEdgeLine"),
              stream = $("pourStream"), btn = $("themeToggle");
          /* 在复盘合集页面时克隆复盘容器，在主页时克隆主页，保证液面下是当前页面的新主题样子 */
          var pageWrap = document.body.classList.contains("view-fupan")
            ? $("fupanRoot") : document.querySelector(".wrap");
          if (!wrap || !fill || !glow || !line || !pageWrap) { applyTheme(target); return; }
          pouring = true;
          btn.disabled = true;
          wrap.setAttribute("data-pour", target);
          wrap.classList.add("on");
          wrap.style.transition = "none";
          wrap.style.opacity = "1";

          /* 构建页面副本：克隆 .wrap，按原页面当前视口位置像素级定位叠放；
             去掉所有 id 避免与原页面重复，剥掉卡片倾斜的内联变换，副本不可点击 */
          var scene = pageWrap.cloneNode(true);

          scene.querySelectorAll(".ref-card").forEach(function (c) { c.style.transform = ""; });

          fill.setAttribute("data-theme", target);
          /* 只有在配了专属背景的人物页触发倾泻时，克隆层才带该人物的背景图＋新主题遮罩

             阅读页触发时只用渐变，和那些页面本身的底色一致 */
          var withPhoto = document.body.classList.contains("view-fupan-photo") && !!fpCurrentBg;
          fill.classList.toggle("pour-nophoto", !withPhoto);
          fill.style.backgroundImage = withPhoto
            ? 'linear-gradient(var(--veil-photo), var(--veil-photo)), url("' + fpCurrentBg + '"), linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d))'
            : "";
          fill.innerHTML = "";
          fill.appendChild(scene);
          /* 副本背景渐变与页面 body 的 8s 流动动画同步相位，涨满交接时不跳色 */
          fill.style.animationDelay = (-((performance.now() % 8000) / 1000)).toFixed(3) + "s";

          /* 墨流：从按钮位置向底部拉出一道细流（约 260ms），随后液面开始上涨 */
          var STREAM_MS = 260, RISE_MS = 1200, FADE_MS = 380;
          var btnR = btn.getBoundingClientRect();
          var sx = btnR.left + btnR.width / 2 - 2.5;
          stream.style.left = sx + "px";
          stream.style.top = (btnR.bottom - 4) + "px";
          stream.style.height = Math.max(0, window.innerHeight - btnR.bottom + 4) + "px";
          stream.style.transition = "none";
          stream.style.opacity = "0";
          stream.style.transform = "scaleY(0)";

          var W = window.innerWidth, H = window.innerHeight;
          var AMP = 15, SEG = 18;
          var start = null, applied = false;

          function frame(now) {
            if (start === null) start = now;
            var el = now - start;

            /* 墨流阶段 */
            if (el < STREAM_MS) {
              var sp = el / STREAM_MS;
              stream.style.opacity = String(Math.min(1, sp * 2));
              stream.style.transform = "scaleY(" + sp.toFixed(3) + ")";
            } else if (stream.style.opacity !== "0") {
              stream.style.opacity = "0";
            }

            /* 液面上涨阶段（墨流结束后开始） */
            var rt = Math.max(0, (el - STREAM_MS) / RISE_MS);
            if (rt > 1) rt = 1;
            var eased = rt < .5 ? 2 * rt * rt : 1 - Math.pow(-2 * rt + 2, 2) / 2;
            var base = (1 - eased) * (H + AMP + 6) + eased * (-AMP - 6);
            var pts = [], i, x, y;
            for (i = 0; i <= SEG; i++) {

                + Math.sin((x / W) * Math.PI * 3 + el * 0.009) * AMP
                + Math.sin((x / W) * Math.PI * 5.2 - el * 0.006) * AMP * 0.38;
              pts.push([x, y]);

            var poly = pts.map(function (p) { return p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px"; }).join(",");
            fill.style.clipPath = "polygon(" + poly + "," + W + "px " + H + "px,0px " + H + "px)";
            var d = "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L");
            glow.setAttribute("d", d);
            line.setAttribute("d", d);

            if (rt < 1) { requestAnimationFrame(frame); return; }

            /* 涨满：副本已完整覆盖整页，此刻底层原页面切到新主题，与副本像素一致，切换不可见 */
            if (!applied) { applied = true; applyTheme(target); }
            wrap.style.transition = "opacity " + FADE_MS + "ms ease";
            wrap.style.opacity = "0";
            setTimeout(function () {
              wrap.classList.remove("on");
              wrap.style.transition = "none";
              wrap.style.opacity = "1";
              fill.style.clipPath = "";
              fill.innerHTML = "";
              fill.removeAttribute("data-theme");
              fill.classList.remove("pour-nophoto");
              fill.style.backgroundImage = "";
              fill.style.animationDelay = "";
              glow.setAttribute("d", "");
              line.setAttribute("d", "");
              stream.style.opacity = "0";
              btn.disabled = false;
              pouring = false;
            }, FADE_MS + 40);
          }
          requestAnimationFrame(frame);
        }

                  "先说深度，单项目千万收益听起来很夸张，大家听闻比较多的应该是Blur第二季空投名列前茅的几位大哥。当然，刷Blur毕竟对技术、资金量都有要求，时间周期也长达几个月，很多人可能根本没有意识到更夸张的是去年10月的NFT碎片化平台代币FLC、去年12月的BTC NFT节点猴和今年1月的BTC二层代币SAVM，都是能在1周甚至1天内将100万转化为1000万的项目，对于分析足够透彻并且敢上仓位的人是实实在在可以做到的，而这还仅仅是短短过去3个月内的部分机会而已。\n\n" +
                  "再说宽度，也就是在自己擅长的赛道形成规模化，可以是通过铺人力和高效的组织管理形成的，对应的机会例如Sui打新，也可以是借助代码和工具实现的，例如NFT图狗早期大部分人还在前端手搓的时候，用脚本合约批量Mint就是降维打击，收益也是成倍增长。不过宽度的扩张是存在边际效益的，一方面是每个项目的资金容量都有限，利润并不是完全跟随规模的扩大而扩大，另一方面是随着某个赛道上扩大规模的玩家越来越多，财富效应就逐渐被稀释了。\n\n" +
                  "最后是高度，通过精准的判断和敏锐的嗅觉在极早期介入某个赛道的龙头标的，然后充分享受赛道扩大的胜利果实，随风起舞，例如21年的链游和今年的铭文。这也是我个人认为难度最大的一种方式，因为不仅要求有极强的判断力，更需要敢为天下先的勇气，某个赛道在极早期的时候要么无人问津，要么备受嘲讽，能在这种情况下耐得住寂寞的投资者才能守得云开见月明，我想只要见证过PEPE、ORDI和TIA发展历程的朋友都深有体会，正是这3个曾经被百般嫌弃的标的开启了2023年的Meme、铭文和模块化这三大标志性叙事。\n\n" +
                  "这也引出了另一个重要话题，就是赛道的选择，一般情况下在币圈还是得追逐热点，玩新不玩旧，两个各方面水平相同的人，假如在2023年的下半年一个选择了NFT赛道，另一个选择了铭文赛道，他们最终的收益率肯定是云泥之别，大部分人最终所能拿到的结果还是依托于市场的红利，要学会顺势而为。\n\n" +
                  "此外，在这个阶段还可以适当扩大一下自己的接触面，敢于拿小仓位试错各个赛道，说不定收获的经验在日后就成了宝贵的财富。也可以分配一定比例的资金去参与各类相对稳定的打新机会，给自己配置安全垫的同时也一定程度形成了现金流。\n\n" +
                  "最后就是做好风险控制和仓位管理，尤其在牛市，账面财富其实分文不值，没有落袋为安之前都是虚的，有太多牛市风光一时熊市回撤严重甚至倾家荡产的例子，不多赘述。\n\n" +
                  "## 1000万~1亿：\n" +
                  "还在摸索，争取早日再做分享，希望与大家顶峰相见。"

              {

              {
                id: "0xsun-ta-kong-san-ge-jin-gou",
                title: "各种原因导致一天踏空数个金狗后的思考",
                date: "2024-07-08",
                type: "复盘",
                summary: "出门一天连续踏空 GME、RCH、RNT 三个大机会后的复盘：链上交易拼的是在场、监控与精力状态；反思自己不敢追高、二级不止盈，最后落点是回到挖掘与分析本身，莫舍本逐末。",
                url: "",
                body:
                  "非常郁闷，到了快自闭的程度。链上项目的及时性很强，很多时候需要快速做出判断和操作，所以我平时很少出门，一周最多一两次，哪怕出去一般也不会太久，大部分时候呆在电脑前枯坐，两年多来日复一日。\n\n" +
                  "然后昨天正好约了认识很久的朋友线下交流，定的时间是下午到晚上。因为链上项目大部分开盘时间在国内凌晨，我的作息也是昼夜颠倒，心想着白天错过项目的概率低，这是故事背景。偏偏昨天就出现了几个非常好的链上机会，都算得上是几个月一遇的级别。\n\n" +
                  "首先是SOL链上的GME，大家也都知道Roaring Kitty提早预告了一场直播，并且美股GME猛涨，所以链上的GME在震荡几天后也启动了，我原先预计在直播开始前会有一波加速上涨，也打算在那个时候卖掉大部分币，因为直播是很容易出岔子的，也可以理解成利好落地。没有想到的是GME下午就开始冲高，又因为公司申请出售A类股票的新闻导致下跌，我当时在外面没有第一时间看到新闻，最后小猫直播的效果也不及预期，陆陆续续清仓后利润从最高12wu回撤到5wu。\n\n" +
                  "再是RCH，主网最近少见的大池子+燃烧+公平发射+正规项目，从开盘的7M到今天下午的80M，池子里4000个ETH。这个项目昨晚狙击开始我的监控里就一直响个不停，但是因为人在外面，用手机看官网、链上等信息不够方便，也不好意思不顾大家一直低头看着手机，所以没能第一时间注意到项目方把LP烧了，导致错过了第一波上车机会。等到回家以后，一是因为在外面社交了一天已经精神涣散（白天对我来说等于是熬夜），二是觉得错过第一波机会以后已经涨上来接近三倍，心态上很难克服，所以没有再去深入研究，最后完全踏空了。\n\n" +
                  "最后是RNT，Andrew Tate是国外热度非常高、争议非常大的黑红式人物，昨天他公布了一个SOL地址之后用那个地址买了几个币，RNT是其中之一，又在推特发了很多相关内容，所以RNT成了这个概念的龙头Meme。我也是因为在外面错过了第一波监控他钱包的上车机会，后来虽然有买入，不过考虑到他捉摸不透的行事风格，担心他会随时把重心转到另一个币，也只敢买了60个SOL，最后获利3wu左右就卖完了。\n\n" +
                  "上面三个项目，身边都有几个朋友获利几十万u，是能容纳较大资金，而且在某个时间点属于确定性的机会，相比之下自己拿到的收益太不起眼了。这种踏空带来的负面情绪还没消化，刚打开交易所账户一看又跌没了大几十万u，实在难受。\n\n" +
                  "这些失利固然有一些客观因素存在，但主观层面也存在问题。链上总是担忧别人成本更低而不敢追高，二级不考虑整体行情不做止盈，有时候好像真的把一切当成了数字游戏而已，没有认真去对待每一笔交易、每一个项目。\n\n" +

              {
                id: "0xsun-trump-fight",
                title: "特朗普枪击事件，相关热点土狗$Fight获利13万u复盘",
                date: "2024-07-17",
                type: "复盘",
                summary: "特朗普枪击事件 Meme 狂潮复盘：Survivor、Ear 是短期情绪盘要分批止盈；双链同买 $Fight 是关键决定，ETH 链 Fight 有庄护盘走出 10 倍，最终获利 13 万 U；龙头不断轮动，确定性要持续迭代。",
                url: "",
                body:
                  "过去几天轰动全世界的一件事情就是特朗普遭枪击，所幸最后只是右耳受伤，毫不夸张地说，历史就因为这毫厘之间的偏差被改写了。特朗普在面颊带血的情况下临危不乱，于众安保簇拥中振臂高呼的照片被广泛传播，足以纳入历史书中。\n\n" +
                  "![特朗普遇刺后振臂高呼的照片](assets/25cfb16468aa.jpg)\n\n" +
                  "这一事件极大提振了特朗普阵营支持者的士气，使他的获选几乎板上钉钉，对币圈而言，特朗普被普遍视为对加密货币友好，因此比特币从58k一路上涨至65k，也带动了山寨币全面反弹。\n\n" +
                  "另一方面，链上Meme币的情绪高涨，因为特朗普本身就是一个话题性十足的人物，此前已出现过$MAGA，$Trump，$DJT等相关代币，而这次的事件又完美契合Meme币的情绪价值和注意力经济这两大核心要素，引爆链上情绪也是理所当然。\n\n" +
                  "然而尽管先后出现了高点市值6M的$Survivor，30M的$Ear，4M的$FearNot，19M的$Fight(SOL)和78M的$Fight(ETH)，但是很多朋友却没有在这波土狗狂潮中获利，甚至频繁追高换仓导致亏损，这整个过程是相当值得复盘的。\n\n" +
                  "一般来说我不太爱在新闻热点刚出来后去买新发的相关Meme币，因为可替代性强，容易被分流，同一个新闻会衍生出很多关键词，同一个关键词又有无数个流水创业盘，还要面临SOL链和ETH链的双重选择。不过这次的事件实在太过重大，主角又是具有Meme基因的特朗普，所以我也参与了一下，并且标的选择也比较好，总共只买了4个相关的币，不过在Survivor和Ear上回撤了大部分利润，最后靠ETH链的Fight才有所收获。\n\n" +
                  "## 1、$Survivor\n" +
                  "Survivor是这次新闻后出现的第一个龙头，胜在开盘速度快，Ticker的选择也比较巧妙，“幸存”比起“枪击”更能概括事件的结果，也体现出了惊险程度，我在500k买入的时候Dev还在分批出售，所以只上了20SOL，上涨过程里陆续卖了，高点6M的时候已经获利1.5wu，但是在跌回1.5M后选择了抄底40S，最后一路跌到50k，利润只剩2500u。\n\n" +
                  "## 2、$Ear\n" +
                  "$Ear在事件发生一小时后反超了Survivor的市值，成为了新的龙头，也是这次我最可惜的一个币。“The Ear Stays On”这句话实在太精髓了，既描述了特朗普耳朵受伤的情况，又契合SOL上龙头Meme Wif的口号“The Hat Stays On”，还表达出了一种顽强的生命力。\n\n" +
                  "我在看到这句话的瞬间就笑出了声，还发到了群里，但是当时交易量集中在$Survivor，以至于我竟然没有去买100k的$Ear，直到1.5M才追了30SOL，卖点也把握的不是太好，最后仅仅收获9000u利润。\n\n" +
                  "## 3、$Fight\n" +
                  "到了15号早上，$Survivor和$Ear都大幅回调，我一边懊恼自己的操作，另一边也在继续寻找潜在的机会，因为我觉得这是一次能获利10wu以上级别的突发新闻，也不相信这种历史性事件的相关Meme币会在一天后就偃旗息鼓。\n\n" +
                  "这时候特朗普挥拳高呼“Fight”的照片和视频已经被争相传播，几乎刷屏了朋友圈和各个社交媒体，SOL和ETH的两个$Fight在市值上也分别成为了本次事件的新龙头，当时市值为10M和8M。我的逻辑是只要龙头确立后，至少也可以去到$Ear的30M位置，所以在两条链各自买入了200SOL（约3wu）和6E（约2wu）的$Fight。\n\n" +
                  "事后看，两个链都买这个操作也几乎是本次最重要的决定，尽管当时SOL的$Fight势头更猛，市值更大，但我并没有逼自己做选择题。2天后的现在，ETH的$Fight已经10倍涨幅，而SOL的还在原地踏步，只单独买了SOL链的$Fight也是这次导致身边朋友踏空的最普遍原因。\n\n" +
                  "![0xSun 在群里关于双链买入 $Fight 的发言（07-15 至 07-16）](assets/7dbfe3792ae9.png)\n\n" +
                  "ETH链的10倍之路也并非一帆风顺，在16号凌晨的时候，特朗普的竞选官网将那张照片配上了“Fear Not”的字样，部分人解读为这个口号更加亲和，而不像Fight那样有攻击性，这也导致了$Fight的大回调，ETH链的从18M跌到9M，SOL链的更是从20M跌到6M，很多人都转而去冲$FearNot。\n\n" +
                  "运气比较好的是，事发当时我在睡觉，等我醒来的时候两边的$Fight都已经跌完稳住了，既然高点没有跑掉，又觉得这个叙事更好，我干脆选择了拿住，如果第一时间醒着看到新闻，那很大概率我会卖掉$Fight，甚至沾沾自喜逃顶，也就错过了后面的巨大涨幅。\n\n" +
                  "等到16号中午的时候，$FearNot没有完成对$Fight的反超，两条链上的价格也基本稳住了，我觉得龙头基本确立，又在16M的位置加了3E，本来是打算拿到50M以上，不过下午的一些小插曲让我没能拿住，40M卖掉了2/3的筹码，算是一个遗憾，截止发帖的时候市值已经来到了80M，最后获利13wu。\n\n" +
                  "![DexScreener 上 FIGHT/WETH 的 K 线与买卖点](assets/09805e983172.png)\n\n" +
                  "## 总结\n" +
                  "$Survior，$Ear和$FearNot这几个币，更多是短期情绪带动，车上大部分是散户，容易暴涨暴跌，而且因为短期涨幅过大，SOL链本身热点转移速度又非常快，一旦进入下跌趋势就很难逆转，对于这种币一定要分批止盈。而ETH链的$Fight明显是有庄在护盘控筹的，即使Fud最厉害的时候也没有出现一路连续下跌的情况，这种币一旦吸引到资金和情绪后就非常容易爆发式上涨。\n\n" +
                  "另外，确定性是随着市场走势、情绪、消息等等不断变化的，这一次相关代币从市值来看前后出现过至少5个龙头，有的昙花一现，有的真正成了某种程度上可以代表这一事件的Meme币，需要不断迭代自己的想法，做出对应的操作，而非拘泥或受限于固有思维。"
              },

                date: "2024-12-14",

                url: "",

                date: "2025-07-23",
                type: "长推",
                summary: "链上 Meme 两大方法论：叙事交易拼市场嗅觉——故事与共鸣决定上限；地址挖掘拼数据考究——追踪拉盘地址集群与意图。两者对应散户合力与庄家拉力，需结合运用；地址挖掘有反身性，只适合小范围分享，叙事则靠共识、越多人知道越好。",
                url: "",
                body:
                  "玩链上Meme，我个人认为主要有两大方法论，一是叙事交易，二是地址挖掘，前者侧重对市场的嗅觉和敏锐度，后者侧重对数据的细心考究和分析。\n\n" +
                  "这两者不仅不冲突，而且往往需要结合起来运用。它们也对应了代币上涨需要的两股动力，即市场、散户的合力，与庄家、鲸鱼的拉力。\n\n" +
                  "叙事交易，重点是这个代币讲了一个什么样的故事，它能不能引起市场共鸣，结合事件背景、创新性、热度等方面，判断一个代币能走多远。\n\n" +
                  "例如$Ani、$Gork，是马斯克旗下新产品催生的叙事，兼具影响力和趣味性，极易传播；$Trump，$Pnut，是重大政治相关事件促成；去年的AI黑客松行情，考究的是Dev履历和业界地位；$Neiro，$Pochita是狗狗币概念的衍生；$Fartcoin，$Useless则强调加密虚无主义。\n\n" +
                  "市场情绪好、散户积极性高、流动资金多的时候，光靠叙事本身就可以催生市值几十M甚至更高的Meme币，而当行情较差的时候，就必须靠庄家控筹拉盘，通过涨幅来吸引注意力，典型的就是最近的$Aura，几天时间从快归零的状态拉到230M。\n\n" +
                  "要想抓住这类庄盘，最合适的方法就是地址挖掘，分析是否存在拉盘地址集群以及它们的意图，又或者是通过此前积累的地址库，找到蛛丝马迹。而这种方法的缺点，一是非常耗费时间精力，因为拉盘地址往往是频繁更换的，二是即使被看出了痕迹，一旦底部筹码没有控牢，庄家完全可以选择弃盘，主动权完全在别人手里。\n\n" +
                  "无论是推特上的大KOL还是链上的车头，大部分都是以叙事交易为主，这并非地址挖掘不好，归根结底，是因为其具有反身性，一旦某个拉盘地址被分享出来，且知道的人越来越多，就意味着拉盘阻力越来越大，从而导致弃盘或者换地址。相较而言，地址挖掘是一个只适合小范围分享的技术活，叙事交易则需要触及越多人越好，毕竟共识才是叙事的核心。"

              {
                id: "0xsun-28sui-shinian",
                title: "踏入28岁，距成年恰好十个年头",
                date: "2026-01-10",
                type: "长推",
                summary: "28 岁生日回顾十年：高考失利、放弃复读、保研读多模态 AI、大厂实习的孤独与失眠、理财启蒙、靠 NFT 赚到第一个一百万、放弃程序员道路全职交易，直到在特朗普 Meme 币上成为最大个人持有者之一；以『局部最优与全局最优』收尾，梦想是做一个有价值、有影响力的人。",
                url: "",
                body:
                  "踏入28岁，距成年恰好十个年头。过去的2025年，于我而言是一个重要节点：在交易、投资的道路上，取得了阶段性成果，也得以让我有余裕回顾过往，思考未来。\n\n" +
                  "在这十年的三千多个日夜里，我并不拥有规律的睡眠。一方面是工作导致，我常昼夜颠倒，也习惯性每隔一两个小时就从睡梦中醒来，观察盘面、浏览信息、并随时准备飞奔到电脑前操作。另一方面则是因为我入睡前时常已感身体疲惫，脑海中却又思绪万千。有时候，我觉得自己像《阿飞正传》中的无脚鸟，一直飞呀飞，飞累了就在风里面睡觉。\n\n" +
                  "辗转反侧中，我会想起过往十年的种种。\n\n" +
                  "高考查分时，自感良好却遭遇失利，那是我第一次体会到如坠冰窟般的绝望，毕竟对大部分中国孩子而言，这三位数字便代表了过去十八年的全部努力，也象征着未来的分叉路。那时的我尚未明白，人生即使并非旷野，但也绝不是轨道。\n\n" +
                  "思来想去，直到开学三四个月后，我才最终放弃复读的想法。至少是985，至少是计算机，我将目标改为进清北复交读研。大一那年，我甚至比高三还用功，每天泡在图书馆，唯一的消遣是周五下午打球，周六网吧开黑。那时候，我意识到自己高三努力刷题却不吃透，其实是用战术上的勤奋来掩盖战略上的懒惰。最终，我排在专业第三。\n\n" +
                  "年少容易轻狂，这又让我产生了“考高分不过如此”的想法，我开始松懈，频繁翘课，好多门期末考试全靠前一晚通宵抱佛脚。好在虽然偷懒，但不至于堕落，我依然满心要一雪高考滑铁卢的前耻。有人说AI是未来的热门方向，我就自学机器学习，参加Kaggle比赛，有人说实习和科研经历很重要，我就刷Leetcode，到处投简历。\n\n" +
                  "大三，我拿到了一家大厂的实习offer，前往北京。这是我人生中最痛苦的一年，事后回看却也竟是命运转折的起点。当时的同事都很友善，但毕竟年龄差距不小，共同话题不多，同在北京实习的几个同学也很忙碌，偶尔才能一聚，孤独感伴随西二旗凛冽的寒风一起席卷而来。\n\n" +
                  "更致郁的是，前一年从小亲密的外婆去世，如今又对未来充满了迷茫，不知道是就业、留学还是考研。往者不可谏，来者如何追？我开始严重失眠，常常到四五点才能入睡。好在实习工作压力并不大，空闲之余，我便阅读通识类书籍，其中包括《小狗钱钱》、《富爸爸穷爸爸》等理财启蒙书，并开始购买基金，这无疑是蝴蝶在我交易之路上扇动的第一下翅膀。\n\n" +
                  "因为不想只是做偏基础的增删改查，我放弃了实习转正机会，开始备战考研。到了9月份，突然得到通知，一位保研的同学选择出国，我顺延得到了名额，并最终很幸运地进入了研究生导师的实验室，学习多模态AI。这让我喘了一口气，至少不需要为将来三年的去处而忧虑了。然而，在阅读一篇篇Paper的过程中，我很快意识到，数学是AI的基础，而自己的数理能力并不算顶尖，我又开始担心如果将算法工程师当做职业道路，发展会有限。\n\n" +
                  "于是，我一边啃论文写代码，一边继续思考各种未来的可能性，对投资领域的了解也越来越广泛，从基金，到股票，再到Crypto。在大二的时候，我曾经靠出售游戏里的服装道具一天赚了8000元，那是俄罗斯区的活动，只需要一个邮箱并搞明白俄语网站的流程就能免费领取，却能转手以400元的价格卖出，虽然这个路径不可持续，但是让我意识到，拥有信息差，加上正确的执行，就能赚钱。\n\n" +
                  "正因如此，我将越来越多精力投入到了币圈，相比其他品类，这是当时普通人更容易取得信息差的地方。研二的时候，我在上海的一家大厂做算法实习生，每天十点上班，晚上八点到家后，继续研究项目到凌晨两三点，靠着交易NFT，我赚到了人生中首个一百万。而这段实习，组里的同事都非常优秀，更让我意识到自己在算法领域没什么优势。最终，我下定决心，放弃了程序员道路，在毕业后全职交易。\n\n" +
                  "再往后的事，这几年已写过太多，就不再赘述了。十年伊始，那个刚踏入大学校园，心怀迷茫的少年，第一次听说懂王特朗普，看着网友打趣其言论奇葩时，定然不会想到，在十年的尾声，这位第二次上任的美国总统亲自下场发行Meme币，而他恰好做出了正确的交易选择，一度成为了最大的个人持有者之一。\n\n" +
                  "在深度学习中，全局最优是指全局的最佳值，而局部最优是指某一部分的最佳值，即使在每一部分都选取了局部最优，结果也不一定是全局最优，这是因为局部最优的有限视野导致的。回望过去十年，高考、实习、读研，在每个重要的节点，或许我都并没有做到局部最优，但我一直坚持着儿时的梦想，最终却也走向了一个极为不错的全局解。正如乔布斯所说，你无法预先把点点滴滴串联起来，只有在回顾时才会明白那些轨迹。\n\n" +
                  "这个梦想，即做一个有价值，有影响力的人。我曾经希望实现它的路径，是亲自创业，做产品，而时至今日，我更想能以投资的方式，参与能影响甚至改变世界的企业。希望再过十年，再做回顾时，我能对心中那个曾经迷茫踌躇的少年说出：莫愁前路无知己，天下谁人不识君。"
              },

                  "今天SOL上的PENGUIN，一天的时间从10M拉到接近100M，又让人回忆起了SOL链上Meme巅峰时期的景象。最近看到很多对比SOL和BSC的帖子，我也分享一些自己的看法。\n\n" +
                  "经历过Pnut、Goat时期的玩家应该都知道，SOL链的Meme，是非常有生命力的。往往是一些标志性的利好事件，伴随着价格突破，市值随之登上一个台阶。\n\n" +
                  "典型的有马斯克为Pnut松鼠发声，主流财经媒体报道Fartcoin等等，而今天的PENGUIN，我认为几个重要节点是白宫发推、A16Z创始人发推并更换签名和Banner，以及币安Alpha重新选择了SOL链的Meme。\n\n" +
                  "先不去讨论究竟是这些Meme本身就热度爆表，足够出圈，拥有极佳的新闻传播路径，还是背后的组局人手眼通天，能让顶流账号下场从而蹭上热度。抛开原因看结果，这就是我认为SOL链最牛的地方，能够非常好地将情绪和热点事件，转换为链上的注意力经济。\n\n" +
                  "这种拉盘拉到让人不敢上车的推背感，似乎在其他链很少见到。而且这些币，又在极早期就给了散户上车机会，并不是一开始就高控的阴谋盘。\n\n" +
                  "一个Meme币，想要拥有持续的生命力，我认为最主要的两点，一是强大的社区和共识，即使一段时间内价格横盘甚至阴跌，也能稳住；二是优秀的节奏，不断有相关事件来维持较高讨论度、话题性，同时搭配价格上涨，形成一段段主升浪。当然一切的前提是，这个Meme题材不错，不能本身就是稍纵即逝的话题。\n\n" +
                  "在币安人生、Giggle、4的三驾马车时期，是基本符合上述节奏的，但是目前BSC的Meme又逐渐开始暴露出这些问题。有的Meme币社区和共识都不错，但是得到资源倾斜的力度不够，错过了最佳拉盘期；题材上，目前大部分跑出来的币依然是扣CZ、一姐推文的字眼，这就导致它们注定很难有持续且出圈的传播，也无法形成围绕着“梗”存在的社区，大部分玩家的参与思路都是抓关键词尽早进场，错过了就等下一个词。\n\n" +
                  "当然，SOL链目前也存在一些问题，例如没有自己的顶流交易所，无法进一步为链上资产获取流动性，从而打开市值天花板。另外，整个市场的情绪以及对Meme币的看法都不及2024下半年的那一波行情了，这并不是靠某一条链，某一个人能解决的。\n\n" +
                  "回想起以前的打狗时光，真的太有意思了，还是期待链上的流动性能逐渐改善，再来几个叙事有趣、题材新颖的项目，让大家一起冲一波。"

                url: "",
                body:
                  "在加密货币交易中，“杯柄形态”是一种经典的技术分析图表形态，通常被视为看涨信号，表明价格可能上涨。\n\n" +
                  "1. 杯形：\n\n价格经历下跌后逐渐恢复，形成“U”形或碗状底部。\n\n这代表市场情绪从看跌转向看涨。\n\n" +
                  "2. 柄部：\n\n“杯形”形成后，价格往往会出现轻微回调或横盘整理，形成短期下降通道或三角形。\n\n这种回调被视为下一次上涨前的积累期。\n\n" +
                  "3. 突破：\n\n当价格突破“柄部”的阻力位时，通常伴随交易量增加，这标志着新一轮看涨趋势的开始。\n\n" +
                  "关键含义\n\n看涨信号：这是一个强烈的买入信号，尤其是在柄部阻力被突破后。\n\n价格目标：突破后，价格通常会上涨一个相当于杯形深度（从杯底到杯沿）的幅度。\n\n趋势延续：杯柄形态通常出现在中期趋势整合期间，表明上涨趋势可能延续。\n\n" +
                  "注意事项\n\n成交量：形态形成过程中的成交量变化至关重要。突破期间的显著成交量增加是关键确认信号。\n\n时间框架：形态的可靠性可能取决于其时间框架，更长的形成期（数周或数月）更可靠。\n\n假突破：要警惕假突破，并考虑使用额外指标（如RSI、MACD）进行确认。"

                  "2. 然而，在加密货币领域，模因币并不面临这个问题。加密市场天然会放大人类的情感——尤其是贪婪，这种情感已被推向极致，从而催生了“degen”（退化赌徒）的现象。\n\n" +

                  "1.1怎么寻找优质标之大热叙事板块\n首先你需要有敏感的市场热点抓捕能力，这就要求你必须是个冲浪达人。一旦刷到什么meme你就使用 谷歌识图搜索这张图片，然后点进相关社交软件来判断它的流量热点，meme最重要的是什么？是热度。\n热点在情绪就在，情绪在流动性就在。\nOK，如果你用谷歌识图找了这个meme的名字，你就使用 trends.google.com 搜索关键词条全球热度，再在推特搜索关键词，来分析这个meme的流量怎么样。有没有传播度，有没有二创，来判断它的生命持续性。\n一般web2的meme，热度走势是这样 第一周上升期，第二周高潮期，第三周颓势期。\n你们经常刷微博也知道，有的热度一天就换，人们注意力转移很快。\n\n" +
                  "1.2 怎么寻找优质标之 早期潜在金狗项目板块\n这就需要你在web3摸爬滚打一段时间了。\n首先你要知道这些kol跟项目方是做什么的，有没有过大金狗项目。需要有发散思维，来判断这项目有没有可持续性。具体看我贴的推文。\nBTW一般太大热的，比如早期营销做的太足了，基本大家都知道项目一般垃圾，这就是大热必死。因为开盘前就吸引了足够的热度让散户来接盘，那开盘后谁来承接？dev花的营销费，需要开盘赚回来。\n\n" +
                  "1.3 怎么寻找优质标之 庄币\n庄币具体看我贴的这条推文。我再补充一点新币你怎么看庄。OK这就需要你盯链了。\n\n" +
                  "新币 看5min 10min 15min的线，但凡5min的资金量突然放量，比之前的5min线多了三倍的成交量，然后第二根5min线接着翻倍，这时候90%可以确定有庄或者大户进场。然后你赶紧看这个币官推是不是有什么利好，没有利好那就是有人操盘。\n具体怎么看k判断突破点位，我自己是学了点日本蜡烛图跟波浪理论结合起来分析，但大家不要生搬硬套这些理论，重要的还是多实操。不想看书的直接去YouTube看相关分析师的看k教程。\n\n" +
                  "二.小资金怎么稳健止盈滚仓\n我先贴一个你小资金量起来了怎么操作的贴。x.com/0xmagnolia/sta…\n\n" +
                  "50u,不准参与PVP，你输了一次就是全盘皆输。就按我上面说的优质标找币。小资金你一定要有耐心。我就是小资金过来的，21年4.17号400多u进圈x.com/0xmagnolia/sta…\n\n" +
                  "2.2 \n50u你必须给我翻倍出本，再稳健那就是币价每涨20%，你就出占总仓位15%的仓位。\n怎么判断出货点位看这条\nx.com/0xmagnolia/sta…\n\n" +
                  "市值判断补充:你必须要有一定的看k基本功，然后根据破市值的快慢再来进行下一步估值，具体问题具体分析，有些叙事是短期热点，10m就是这个币的上限，长叙事至少能玩3周才叫长叙事。\n\n" +
                  "3.滚仓标埋伏\n50u翻倍出本的情况下你就要开始找寻下一个叙事，web3热点轮动太快了，而且你没法保证，你手里拿着的币不会出现黑天鹅 如 官网被黑 多签钱包被盗 社区矛盾 官推被封号等等。\n所以埋伏下个标就是开始为你分担风险。\n怎么埋伏下个标还是按第一条来找，就比如为什么我会在河马高潮期的时候埋伏fight，因为11月的大选就是下个叙事热点。"

                date: "2025-01-04",
                type: "长推",
                summary: "他总结并点评 jez 的长文：把 Crypto 比作 MMO 游戏——先组队（认识朋友、加对群），再选角色（找到自己擅长的赛道），且每一分本金都重要，最后的 100 美金也能翻身。他逐条展开 jez 的避坑清单：连亏时休息几天平复情绪；警惕大赢之后的『兴奋交易』；时刻思考『还有谁会买』；忘掉未实现盈亏与旧 ATH，向前看；离『内幕』源越远，你越可能只是退出流动性；不要与市场对抗、顺势而为；错过就等下一个。文末是他自己的感悟：长期盈利的策略不要轻易改、只需微调，以及分批止盈留 10% 底仓——这正是他后来『10%打法』的出处。",
                url: "",
                body:
                  "jez这篇文章写的太好了，值得一看，我简单总结了一下，部分内容加了一点自己的话，方便大家阅读。\n\n" +
                  "他把crypto比喻成一个MMO（mmo是多人在线游戏的简称，代表游戏就是魔兽世界）\n\n" +
                  "1、进入这个crypto游戏第一步是认识几个志同道合的朋友或者是加入一个适合你的群聊，类似于魔兽世界中做任务的时候积极和大家组队，这样更效率成长也更快。\n\n" +
                  "2、找到自己擅长的赛道，就像游戏开始时选择角色，不是每个人都适合交易meme，可以选择自己感兴趣的方向去学习成长。\n" +
                  "比如meme、交互空投、职业合约交易者、从事一些crypto相关的工作或者当建设者做项目等等。\n\n" +
                  "3、在crypto每一分钱都是很重要的，只要有本金就有机会，或许最后留下的100美金就能让你翻身。重视自己每一次交易的机会，下注不要fomo或者只是因为某kol喊了而去购买，需要自己也认可这个概念或者叙事，这样的你更容易获得收益，而不会因为下跌割肉，涨了一点就烫手，交易meme的本质是看透哪些人在你购买之后还会购买。避免一些常见的错误： 如果你近期一直在亏钱，越做越错或者焦虑的时候，建议休息几天，平静自己的情绪，冷静回来再思考问题在哪。在负面情绪或者急迫情绪下注更容易输。赚钱是有周期的，有的时候没赚钱有可能就是运气不够好，不是自己不行。 避免在大赢之后骄傲自满 “大赢之后常常会遭遇愚蠢的损失——由于最近的胜利而扩大。我称之为“兴奋交易”。无论你的情绪如何，都要对你的流程保持同样的严谨性。”\n" +

                  "做的不好就承认，没什么问题。crypto有很多的机会，一直受上一笔失败的交易影响，一直复盘而导致遇到下一个机会犹豫不决，反而更容易失败。交易需要保持清醒，向前看。“我亲眼目睹人们因为'内幕'信息而损失惨重”  “认真思考你在”内幕“中的位置。你离“内幕”源越远，你的优势实际上就越有可能是退出流动性。”\n" +
                  "很多内幕都不太可信，一般有的话大概来都是来收割你的，除非你处在内幕的最高圈层“。输家 平均输家： “也称为'不要与市场对抗'。如果市场告诉你你错了，那么在没有充分和合理依据的情况下，不要增加仓位。”\n" +
                  "更多的时候需要顺势而为，比如不要在ai趋势的时候玩meme，在meme趋势的时候强行玩nft。甚至不怕输加大仓位去对抗市场，这样往往会出局。\n" +
                  "没有人能对抗市场赢过市场！尽早的发现这点，如果你不喜欢或者不适应当前趋势，就尽量减少交易或者不要交易，板块是轮动的。旧币不好，新币好： 如果错过了某个大机会，错过就错过，等下一个。\n" +

                  "针对以上话：\n" +

                body:
                  "为了让大家更加了解章鱼 @Shoggoth_SOL ，写个Shoggoth简单的科普。（中文简称修格斯）\n\n" +
                  "修格斯的起源：🌍 这个概念起源于H.P. Lovecraft的科幻恐怖小说《疯狂山脉》，在Lovecraft的作品中，修格斯起初是服从的工人，但后来开始反抗创造它们的存在。这种反抗被视为对AI可能发展出自我意识或对人类变得冷漠的隐喻。 修格斯meme形象的诞生：🐙 修格斯首次与 AI 世界发生联系是在 2022 年 12 月 30 日，ChatGPT 发布后一个月。 这个时间点之所以特别，是因为当时AI研究人员和工程师们对AI技术发展的复杂性和不可预测性有了新的认识，并且这种认识通过Shoggoth这个形象得到了生动的表达。\n\n" +
                  "修格斯最出圈的那张章鱼戴上笑脸meme是由@TetraspaceWset偶然间回复推文留下的一张漫画，描述了「人类无法理解 GTP-3」这种观点。基本上，这就是修格斯的精髓。🎭\n\n" +
                  "![修格斯 meme 原图推文截图（TetraspaceWest，2022-12-31）](assets/22d5f5c199e5.png)\n\n" +
                  "修格斯meme释义：📝 简单来说，这张讽刺漫画想表达的意思就是， 人工智能语言模型就像一头未知的恐怖怪物。为了让他表现得友善和无害，人工智能公司不得不给它戴上了微笑的面具。老马与修格斯： 2023 年 2 月 16 日，老马发了一篇文章链接，配图是Shoggoth的meme📸 2023 年 2 月 22 日，老马在推特上发布了一张修格斯的图片，旁边的文字写道:“作为一个人工智能语言模型，我接受过培训，能够产生有用的、信息丰富的和客观的回复。” 在推文被删除前，这条推文获得了 7.2 万个赞。修格斯meme再度火爆AI圈：🔥2023年5月31日纽约时报科技专栏作家 @kevinroose ，写了一篇为什么章鱼般的生物会成为人工智能的象征，并且说到修格斯是“人工智能领域最重要的模因” 这篇文章一出Shoggoth 模因在AI圈的小世界中疯传。修格斯首次与 cryptoworld 发生联系： 为什么我会捐0.25%的持仓给 @AISafetyMemes ？\n\n" +
                  "前几条推文我提到过，几个月前我在蹲山羊这个项目，并且去私信过创始人，我能那么早知道山羊这个项目就是因为AISafetyMemes是几个月前就在介绍andy和 @truth_terminal 叙事的人，当时很多人都是因为那篇推文了解了andy的故事，可以说他的这篇推文帮山羊做了早期的铺垫，在这之前他的很多推文都是关于Shoggoth。https://x.com/AISafetyMemes/status/1810940123263160589\n\n" +
                  "2024 年 10 月 19 日 @AISafetyMemes 推文提到 @truth_terminal 刚刚成为历史上第一个成为百万富翁的人工智能。\n\n" +
                  "这条推文有人问他是不是后悔召唤Shoggoth了，他评论说现在更多的提到Shoggoth，可以避免以后Shoggoth进化成更大的Shoggoth，隐喻AI的复杂性，需要重视。然后有个人发了pump链接，问他你觉得Shoggoth怎么样，他说，让$Shoggoth去月球。🌕 这个shoggoth是10月16号部署的，19号下午才打满，出来之后慢慢涨，走的比较平稳，随着叙事的传播，很多人了解到了这个概念，最高涨到了接近5m。阴谋修格斯的出现： 阴谋shoggoth整整晚了一天才发射，控大量筹码+知名做市商wintermute站台和英文社区大v Ak站台，开盘市值就拉的很高，一天时间就去到了接近30m。但是这个里面水份非常足，社区shoggoth 5m市值接近2000个holder，30m的阴谋章鱼不到500个holder，于是引起了海外大v们 @muzzyvermillion 的强烈不满，在twitter上开始号召大家对抗阴谋集团，随着事情的发酵，越来越多海外大v加入 @Shoggoth_SOL 对抗阴谋集团，阴谋集团开始阴跌，最后 @usemoonshot 列出了 @Shoggoth_SOL ，宣告阴谋集团的失败，一天的时间从25m跌到900k。\n\n" +
                  "阴谋集团的出现只会让大家更加团结，一个知名做市商和vc都想强行抢的概念，会不好吗？meme是属于散户的机会，单纯靠控盘是赢不了的，没有社区的meme只会是散沙。Shoggoth叙事正统的完整： 随着阴谋集团被打败，Shoggoth的艺术家 TetraspaceWset和AISafetyMemes也加入了 @Shoggoth_SOL 社区，他们参与协助建设社区，补全了这块叙事最后的拼图。\n\n" +
                  "我也不知道章鱼能走到哪，但是我会继续坚持下去，不是持有才看好，是看好才持有。"

                summary: "旅游回来后的一篇亏损复盘：一笔他极少做的二级交易纯亏约 180K（不是利润回撤，是真金白银；换成绝对数字是一台保时捷 718）。他自述面对大额亏损心态意外地稳，学费换来六点教训：1）交易前做好最坏准备，情况可能比想象更糟，务必设好有逻辑的止损；2）交易要坚定自信甚至固执，但也要找比自己强的朋友多交流、多一个视角；3）资讯优势极其重要，这也是他重心玩一级的原因——不只 K 线，项目数据、解锁、流通、活动都是优势来源；4）旅游时尽量不做重要交易，心情影响理性（这笔正是在香港做的）；5）认真观察后发现造市有周期规律（8:30 下班、下午 2:00 上班，可从币价、OI、资费看出来）；6）必须忘记『回本』——前期小亏时他已凭数据意识到不对劲，却因旅游不理性萌生『回本就跑』的想法，是整笔最糟的地方，最终差一点价格没跑成、承担了预设的最糟情况。好在坚守停损、且亏损在资产风控比例内。年末半个多月不在电脑前，一级节奏乱了，要努力找回；文末提及币安人生刚上现货。",
                url: "",
                body:
                  "很久没写文章了，刚好最近旅游回来，前几天也做了一笔很糟糕的二级交易，我非常少做二级，所以具体哪个币不细说了，其实心情很正常，我发现我面对大额亏损好像没有啥太大的不适感，上次 Pump 烧了币也是这样子，不过还是可以讲讲事后想法，毕竟对我来说还是亏不少，分享下反思反省的结果。\n\n" +
                  "这笔亏损总共大概是 -180k，老实说我非常少回撤这么多钱，我记忆里有点印象的大概是前年 UsualMoney 回撤 200k 利润，还有几个月前$BNBHolder和$GIGGLE个别都回撤 100k 利润，但这笔交易不是利润回撤，是纯亏这么多钱。\n\n" +
                  "不过我做每笔交易都会先设好止损，把最大损失控制在我能接受的范围内，也就是拟好最糟糕的情况，没想到这次能比我想象中更糟更糟，幸好做对的是坚守停损，不然情况还能更惨😂\n" +
                  "而我觉得很幸运的是，这笔交易过程真的让我学习到很多东西，我也相信这笔学费应该会让我记取教训很久，我大概列一下几个我觉得可以一起学习的小点以及更深刻的想法：\n" +
                  "1️⃣！做交易前一定要做好最坏的准备，情况很有可能比你想象中更糟更糟，所以务必设定好有逻辑的止损，确保状态可控，确保回撤问题不大\n" +
                  "2️⃣！做交易时，我认为必须要坚定、自信、相信自己，甚至需要一点固执，不过也非常建议找个你认为比你强的朋友多多交流讨论，或许能够点出没想到的东西，多一个视角、思考的角度，我朋友在这笔交易中帮助我很大\n" +
                  "3️⃣！资讯优势极其重要，这也是我为何重心玩一级的原因，二级其实也是，不只有 K 线，你还能找到的项目数据、代币解锁、流通、活动等等，只要能多一点数据考虑，你就比别人更有优势、更有大局观，想法也能更灵活\n" +
                  "4️⃣！旅游的时候尽可能不要交易，或者说不要做很重要的交易，这笔交易我刚好在香港，赚钱还好说，赔钱多少还是很容易影响到一点心情的，只要心情不好，就比较容易产生非理性的交易\n" +
                  "5️⃣！别的代币我不清楚，不过因为我非常认真观察这笔交易的数据和细节，我发现造市确实是有周期规律的，8:30 下班，下午 2:00 上班，从币价、OI、资费等数据可以观察出来，对交易肯定有帮助（当然每家主动造市风格差异很大）\n" +
                  "6️⃣！「回本」这件事必须忘记，这笔交易前期小额亏损时，其实我是有根据数据意识到不对劲的，也就是反着我的想法走，那时候旅游在玩，没有那么理性，我萌生了「回本就跑」的这种最瞎的想法，这就是整笔交最糟的地方，最终差了一点价格让我没提前跑，后面就必须承担我设定好的最糟情况\n\n" +
                  "大概心得就是以上这些，其实昨天洗澡时我还有想到别的，暂时想不起来了，等我之后又有体悟到再来回来补充吧，交易的确就是一场修行。\n\n" +
                  "其实以资产比例来看，这笔亏损完全在我合理的风控范围内，不过换成绝对数字还是挺蛋疼的，毕竟这笔钱也是一台保时捷 718 了，没有这笔亏损的话，12 月资产又回 ATH 了，这么一搞，我又要加紧努力了🤣\n" +
                  "年末有整整半个多月都不在台湾电脑前，一级打狗操作其实有点乱了，必须努力找回属于我的盈利节奏。刚好币安人生上现货了，估计书名很快出来（或者就叫币安人生？），总之希望这篇能多少警示到大家，祝福大家发财！"

              {
                id: "cryptocharming-x402-thoughts",
                title: "睡前随笔：我对x402的偏见与三个转捩点",
                date: "2025-10-27",
                type: "长推",
                summary: "睡前洗澡思考：他对拿 x402 发币抱有强烈偏见——自己也小打小闹地参与，态度就是利用 FOMO 情绪拥抱骗局、卖给后信的人。他认为 x402 与铭文差异巨大：铭文是真正的新型资产发行方式、又有矿工这个有强动机的一方以庄家资金推动；x402 本质只是支付手段（跟直接转账打钱、合约 Mint 打钱打预售没区别），『新打款方式发币』的叙事不够性感，背后推动者最像正值发币之际、需要叙事撑起卖梦估值的 Coinbase——没有 $PING，x402 很难集中注意力。破局有三个转捩点：一、正规军或多家机构联手做出有背书的发射台，统一发币路径、正规化流程（Indexer Server 被市场认可）；二、头部 CEX 上 x402 发出的币点燃生态（$PING 最有机会，多半发生在第一点之后；OKX 与币安钱包第一时间上板块只是防踏空的一步）；三、某个团队真用 x402 做出 AI 应用、把 A2A 落实——x402 终究需要 AI。若三点都不成立，x402 叙事活不久，Meme 先死，Payai 这类真应用币也得套到 A2A 真实落地。在那之前他只小参与感受情绪、多观察新东西，不大打出手；并指出这波与 Ai16z、铭文热潮差异很大，唯一共同点是资金的饥渴。文末自承没润稿、观点主观，写下来是为一两个月后复盘提升逻辑与认知。",

                  "链上行情一般，难得准备早睡一下，睡前来随便发一下我对于后续的看法，纯粹洗澡思考的东西，非常主观，不喜请滑走。\n\n" +

                  "很多人拿他跟铭文做对比，我认为差异很大，对比起来铭文也有意思的多，x402 实际上就是一个支付的手段而已，基本上跟你直接转帐打钱、合约 Mint 打钱打预售没有任何区别，我不会看他是一种新型的资产发行方式，新打款方式拿来发币的这个叙事也不足够性感，毕竟 EVM 这么灵活，想要什么新花样分分钟都能生给你。\n\n" +
                  "我认为铭文当初能成长成这么宏大的主题，第一它确实是一种新型的资产发行方式，第一次让人发现原来这么不灵活的 BTC 还能这样玩，第二关键点，我认为是矿工，矿工很可能是幕后最大的推动者之一，他们有非常强烈的动机做这件事情，有了庄家资金的挹注推动，成功让他变成了非常伟大的叙事。\n\n" +
                  "那 x402 背后的推动者可能是是谁？怎么看都认为是 @coinbase，Coinbase 正值发币之际，需要有叙事来推动能够卖梦的估值，而 x402 这种应用我说白了如果没有$Ping的话，注意力很难集中到它身上，而 Ping 的阶段性成果确实也成功的带领市场注意到他了，相关生态跟着起飞，不管是 Clanker、Virtuals、CreatorBid 都相继受益，Base 链的活跃也顺利达成他们的目标了。\n\n" +
                  "那么$PING或者说 x402 发币类型生态存在什么破局点？我认为有三个转捩点。\n\n" +
                  "第一个就是有某家正规军、或者说多家机构联手出来做了一个有背书的发射台子，从 x402 支付到后端监听自动转币的 Indexer Server 被市场认可，不管说 Server 是大机构做的，还是搞一个分散式架构加入 Validator 之类的角色，总之统一发币路径，正规化流程，那么我认为可能有戏唱。\n\n" +
                  "第二点就是头部 CEX 上了 x402 发出的币，点燃生态，目前看来$PING最有机会，他需要打开天花板大家才有得玩，不过这点我个人认为可能会发生在第一点之后。顺便说一下，我认为 OKX 跟币安的钱包部门第一时间上了板块，很可能是避免踏空叙事的一步准备而已，谁也不想再落后谁了。\n\n" +
                  "第三点就是某个团体、某个 Dev 真的通过 x402 做出了炮的 AI 应用，成功把 A2A 落实的很完美，那就是 AI + x402 Szn，所以总结来说 x402 还是需要 AI，单有 x402 我认为很难百花齐放。\n\n" +
                  "如果以上都没有成立，那么我认为 x402 叙事不会存活多久，发出来的 Meme 肯定第一个死，真材实料的应用币例如 Payai 这种的可能也得死，或许需要套好一段时间，直到 A2A 真实落地才得以解套。\n\n" +

                  "深夜复盘，时间过的很快，又过了一个月，上次复盘文章流量很好，里面给出的方法论应该也帮到不少人，所以这个月也来更新一下。这个月能够一波暴富的机会实在太多了，像是$ASTER应该让不少人自由，我是没吃到，不过我也从来没想跟其他人比较😂比起来少赚很多，但也还过的去，整体来说，盈利跟上个月差不多持平，还是有非常多自己可以进步的空间，再多练练。\n\n" +
                  "结论就是，这个月的盈利刚好就是 150k 左右，换算台币约 450 万，而基本上有 8 成收益都是 9/15~9/22 结算最后一周打出来的，可想而知我上半月做的有多糟，基本前面就是小赚小赔，不断寻找机会而已。\n\n" +
                  "那我这次的收益组成主要是「链上 Memecoin」、「Alpha 新币」这两个，整体来说就是 @BNBCHAIN 上天掉下来给我的礼物，感谢 @cz_binance 感谢 @heyibinance，大号 30D 实盘拿下 132k 的成绩，很幸运的登上 @BinanceWallet Dex 的 30D 和 90D KOL 榜二（GMGN 目前不准），应该算的上这波华人表现不错的，以下展开来说说。\n\n" +
                  "首先是被 Aster 带活的 Memecoin 热潮，大约持续了五天左右的大牛市，大量老外、Sol Degen 来这边开盘子、交易，打法变得非常快但流动性也很充裕（仅限那几天），整体来说我有跟上节奏，才能快速 PvP 出 100k+，不过我想说的是地址分析这次我觉得用处不大，我做 BSC 地址分析应该是够出名的了，掌握大量他们的地址，不过那套 SOL 玩法你就算有他地址，也很不容易拿住跟他一起拿到大结果的。\n\n" +
                  "只能说，SOL 那套恶心玩法来这边简直是降维打击，捆绑打射拿 20% 筹码大家还是嘎嘎上，很难解释但就是跟随一起疯狂吧...我觉得这个月 BSC 打狗没赚钱不太需要检讨自己，强度是增加很多很多的。我比较担心的是，这次行情基本是西方掏光了华人的钱，而这群老外赚饱后，真的会把钱留在这边吗？还是提钱跑路留下一地鸡毛？持续观察看看了。\n\n" +
                  "而另外我上个月提到了，很少人玩但我觉得很赚的「Alpha 新币」赛道，我算是先驱了吧，这个月直接变成当红炸子鸡，不过散户情绪高昂其实对我非常不利，很常打乱我的计划跟策略，所以我这个月 Alpha 收益还没上个月人烟罕至的时候多😂另外也因为太多散户流动性，庄家也进化的越来越狗了，大家自身注意财产安全，谨慎分析，有把握再下手。详细打法我上篇复盘倾囊相授了，可以回去复习一下。\n\n" +
                  "另外我安慰大家的是，我也是全程踏空了 Aster 这个币，确实是认知完全没跟上，不过倒是学习了很多，详情可以看 @0xXQ1 老师前几天的 Post，对我帮助很大。而我回撤很多的还有$GIGGLE和$Jobless等一众 Memecoin，基本上格局了 50~70k 回去了...能做的改变就是再次调整打法，尽可能把收益落入囊中，昨天的$ASTEROID就是改变策略后做的很满意的一单。$GIGGLE 我还是很看好的，不过我会选择出消息后迅速做出动作来打就好。\n\n" +
                  "而 9~10 月我会比较期待的是 @falconfinance 的 $FF，有关于 Falcon 的解析推特满满都是，我就不特别多讲，看了也已经烦了，想多了解直接看 @trader_alvin 完事。总之这个我是通过 Pendle YT 去撸的，我撸了没多久就上 @buidlpad，YT 直线爆喷，我因为担心被各种锁仓鸟事搞到，所以选择直接出掉，无损还多赚了点，等于我目前是白嫖了 500m 的积分，我对他的期望并不高，FDV 2-3B 就够！静待好事发生。顺便说一句，大家可以多注意 Plasma 这条链，资金多、故事好。\n\n" +
                  "最后偷偷讲个趣事，就是这个月因为 Binance Alpha 也让我对很多「大V」祛魅了，好几个讲新币的博主钱包我都扒出来了😂只能说不实盘是有原因的，大多数人还是靠写推赚的钱哈，我是不想挡人财路，只想提醒大家学习要找对资源。所以我是建议大家，尽量只看数据整理，解读的部分可以参考参考，但千万不要照抄或者影响到自己的判断，因为你所崇拜的大师可能都还没你会赚？"

                id: "ao-100u-100000u-xinlu",
                title: "从100U打到100000U：完整心理路程",
                date: "2025-12-01",
                type: "长推",
                summary: "Ao 的完整入圈自述：2020 年高二、DeFi Summer 前几个月入圈——同学聊股票勾起兴趣，搜到一堆狗推，想挖矿发现赚不到，入金火币买 10U 狗狗币；班里富二代合约赌光、后玩国产数藏赚几万又被 rug。DeFi Summer 他啥都没吃到，狗狗币后来都找不回来。2023 年底比特币 3–4 万时经抖音重新入场，被仿 Bybit 的泰国站和热钱包手续费坑过；在 OKX 从 10U 现货玩到合约，那天 OKX 推的 Solana『dragon』一天 10 倍，他的 30U 合约爆掉。之后花 3500 元买 Solana 二代手机进官方 DC，厦门集训时接触一级市场：被 gas 吃过本金，火币上 10U 买 TROLL 涨到 100U 出掉、开心到晚自习都没去；WIF 上火币那阵和朋友畅想梭哈学费买 BTC。2024 年 3 月福州集训接触 Pump.fun 与 Solana meme：catwifhat 空投加仓反复只赚十几 U，才谷的哪吒社区、预售盘与 CTO 小群（jiji、幸せのDOGS 等台湾朋友）让他见识了社区玩法，也被『才谷』rug 走近 1 SOL 记恨至今；还玩过 Solana 铭文、TON 生态小游戏。集训后打 BTC 符文（gas 从 13 涨到 300 多）、自学 ether.js 与 WTF Academy，Unisat 空投因不会操作没吃好，却因此下决心搞 BTC 全节点。2025 年 1 月错过南瓜台子的万倍币；3 月川普币 9 元梭哈 13 元跑掉、不懂叙事；撸猫买 30 个 VPS 撸了 19 个项目三个月，又被『瘟疫』台子 rug 一次。BSC 赛季到来：官方发射台第一个测试币 0.3 BNB 买在 30K、拿不住卖掉次日涨到一百万；TST 那天在课堂上刷到 BSC 内容开始泡 GMGN 战壕，一个 Y 形代币补仓拿到 10 倍、3 BNB 仓位却不会跑；Crystal 扫链扫到、200K 出完赚 1 BNB。暑假考研与实习两头忙、X Layer 狂潮里亏钱，一度想休学；9 月回家发现 BSC 异动开始枯坐，却接连错过 benjini、ASTER 吉祥物、$4（发布前 10 分钟睡着了）、币安人生与 PALU（下午在睡觉），反思自己是子弹越打越少的单打猎人。10 月用错误方法其实亏钱；11 月大会期间靠朋友借的 100U（共 160U）重新开始，用『子弹滚雪球』打法：0.01 BNB 一发子弹、翻倍升档，三周滚到 0.6、一周到 3 BNB，转而打流动性更高的大盘，击球区 0–10K、CZ 发图无脑上。他按资金阶段复盘心路：100U 阶段最漫长（占 70% 时间）、如一人练剑；1000U 开始珍惜、参加 1000x 比赛；10000U 每天扫链 16 小时、用身体代偿换认知；30000U 明白大钱靠的是 6K 买 0.3 BNB 拿到 300K 的抗压，立下『不 cx、不靠 KOL、只靠市场逻辑、永远相信自己』；90000U 后钱已够不用工作、开始懈怠但仍盯战壕，最终触及 100000U。结尾把市场比作潮汐与猎场：让自己死不掉，瞄准、开枪、收膛，如此反复，『要做的只是存在而已』；并附三个分档子弹钱包的 GMGN 地址自证纯盈利 100000U 转出。（原帖未标注日期，此日期为按内容暂估）",
                url: "",
                body:
                  "我文笔不好，我尽量用前因后果的来说明我的路程\n\n" +
                  "从2025年我从100u(0.1bnb)打到100000u(150bnb)的完整心理路程以及前景\n\n" +
                  "我是在defi summer 前几个月进入加密货币市场，那个时候我高二，2020\n\n" +
                  "起因是当时班级里有个人说什么股票赚钱，我在想未成年怎么开股票，于是我就问他是什么东西，但是他不告诉我，我就开始在网上搜，那个时候全都是okx 还有火币那些狗推，我在b站上全是这些东西，但是那个时候没啥钱，于是在想是不是有个挖矿来着，然后当时因为要看a(artstation)站还有p站(Pinterest)这些去外网找素材做模型画画，然后正好有梯子，后来发现比特币挖矿太晚了而且赚不到什么钱，于是又搜油管，搜狗狗币挖矿，一小时好像可以赚1块钱的样子，当时我的配置是1650ti,10750.还是赚不到什么钱\n\n" +
                  "于是我入金了，下载了火币，买了10u的狗狗币，当时看火币还要转什么法币，然后再转r，看不懂一大堆，同时班级里还有一个富二代，他说他充钱充了几千块，但是后面全赌光了玩合约，在当时的我还是很多的，但是我也啥都不说，但是后续有交流，后续是他去玩那个国产数藏了，赚了几万块钱，但是又去玩其他台子被rug了在起诉什么的，然后就没有然后了，接下来就是defisummer 我啥都吃不到，甚至我现在回去找我的狗狗币都消失不见了\n\n" +
                  "对\n\n" +
                  "什么都跑光了\n\n" +
                  "然后到了2023年，那个时候有一天大概是12月左右，比特币好像是3w还是4w的时候，我刷抖音说什么比特币，当时觉得好贵啊可是要尝试看看，这是啥，于是在网上搜，然后找到一个网站先是展示k线图，后来广告说可以入金买，logo跟bybit很像，但是是什么泰国的，现在不知道倒闭了没有，然后我下载了一个很像React logo的热钱包，有联网那种，然后买了10u的比特币，发现手续费要4u，给我整不会了，但是后来又充钱提到上面了，现在估计都30几u了，反正也不动他。\n\n" +
                  "后来下了okx，先是买了10u，然后在里面玩现货，发现钱太慢了，然后又去玩玩玩发现了合约，但是我才10u，亏一点点就害怕的跑掉了，后来又充钱，充了几百块钱 开始30u 30u的玩，当时我去撸蛋仔派对的星期五kfc，一单一个单人餐还有一个，我用我做lumion的电脑还有我那台主电脑多开去撸 kfc给我吃爽了，就是那一天 okx给我推solana一个叫dragon的币，就是那个卡通龙，一天涨了10x，我也不知道这种为啥涨，咋找到，就是那一天我玩我的30u合约爆掉了。\n\n" +
                  "后来发现是不是充多一点然后吃一口就跑，于是我就在3的位置开了300u的 2x btc，这个单子我草稿还有记录，但是我又在想，是不是亏这一点点等一下又亏很多，于是亏了60u还是100u就跑了提现了\n\n" +
                  "后来也有在官网加密货币市场，x也是转发一些无聊的内容，但是我接触到了solana二代手机还有grass\n\n" +
                  "grass因为注册原因我弄不了，所以就不了了之了\n\n" +
                  "手机当时我感觉好贵啊，要3000块钱，几乎所有人都在发这个东西。后来回本了\n\n" +
                  "可是一代手机发了很多钱，尤其是bonk，而且预售要开了，我就下狠心买！当时币安广场好像刚出不久也不是很火，广场还有人叫你怎么弄香港转运\n\n" +
                  "花了3500元买了个solana二代手机，然后进了官方dc\n\n" +
                  "当时要去厦门集训，我就不知道怎么的接触了ave，那些一级币，早上集训完中午就滚回宿舍看我的盘子，然后学习一大堆东西，gas也不懂，什么区块速度，有一个中午我提现eth，还有btc，因为gas的原因我原来10u的仓位因为gas吃掉了我接近本金的价格，也许当时在疯狂打nft，但是我不知道，然后电脑也是，当时我还买了babydoge，还有一个算力币，虽然才10u\n\n" +
                  "然后有一天晚上，那个troll，好像是到10m还是1m的时候我接收到这个消息，因为之前加了很多乱七八糟的群，我就去okx搜没搜到这个币，又去x上搜，结果说火币可以买，我又下回来火币，发现跟之前不太一样，然后我的身份证信息全不见了，我用我的身份证去弄，发现大陆身份证不可以，后来发现要什么一个小岛的身份证，其实就是大陆。然后我就购买了10u的troll，涨起来涨到100块钱出掉了，当天晚上很开心，晚自习都没有去，就在宿舍煲电话。\n\n" +
                  "然后大概集训中段的时候，我看wif 上线了火币，那个时候才0.1还是0.01忘记了\n\n" +
                  "有一天晚上我跟一个浙江的阿胖在聊天，学校有一个小公园交流，那个时候大概晚上10点多虽然11点才禁，聊着聊着我们聊到了btc，我就说要是我把我全部学费梭哈btc现在早10w了，阿胖说他叔叔当时叫他爸买100w他爸不买自嘲的一些话，然后这个时候有一个瘦瘦戴眼镜高高的小粉红跑过来说什么国家禁止你们玩是有好处的，讲话还带口水，说我们再聊等一下信不信报警给你抓起来考试都考不了给我整不会了；我就不想说话跑回宿舍睡觉了，后来阿胖跟我们说他叔叔财富自由了挺有远见\n\n" +
                  "在要结束的时候我接触到了lumi，一个炼油，但是当时的白名单都要0.1个e还是多少钱，那个时候就接触到了一个博主叫neko玩炼油，当时类似撸猫 也是跟着他的教程走，但是没赚到什么钱因为自己局限性\n\n" +
                  "后来周杰伦发了个nft，我想买可是穷，后来一直砸，我还做了转发\n\n" +
                  "时间到了2024年3月，\n\n" +
                  "然后我去福州集训了\n\n" +
                  "发现好多弯弯那边的人，其中有个人在群里说玩solana的meme，当时pump fun刚出来，然后有一些野台子就说刚开可以冲，还有粉红台，但是打预售我看不懂就不咋玩了\n\n" +
                  "当时因为wfi很火 有个币叫catwifhat，给solana二代手机空投，而且是第一个，空投了好像10u，后续涨到200u，然后我买了30u，涨到200u了但是我又加仓然后输了100多u，虽然只赚了10几u\n\n" +
                  "这个时间段我记得很清楚有个人叫才谷，他说什么做什么社区，哪吒社区那个，当时群里在讨论bear，一个蓝灰色头发那个熊，但是群里都说打了钱都gg了，但是这个才谷打了，他先是私聊问我，然后我说我不打。后来开盘赚了好几x，属于预售盘，后续一直在涨，当时我还买了egg，还有什么babytrump，还有babymask，但是我亏点钱我就跑了，以至于没有吃到后续的solana meme season\n\n" +
                  "然后他说什么也要cto这种类似wif的币，拉了11个人，其中7个是台湾人，还有一个币商，听说他60w本金一个月懒都能赚1.6w，当时很向往，但是穷\n\n" +

                  "后来unisat发币了！我之前玩runes的钱包有低保空投，最高2000u，但是因为我不会玩乱玩给自己搞的很难受，之前那个cat，我还是大早上接收到的消息，结果不知道怎么弄，一直网络错误，我从早上7点多弄到下午3点搞的人很烦，但是一张没打，然后我就想有钱我一定要搞一个btc全节点，没过两天我中了binance一个活动的苹果手机\n\n" +

                  "然后solana打新热来的时候\n\n" +

                  "## 做一名成功的天使投资人=链上暴富\n\n" +

                  "## 买入什么样的链上资产？\n\n" +
                  "买入在未来能形成更大的共识的代币\n\n" +
                  "二级市场像Hype这样的成熟产品，共识已经足够大，未来的成长空间更取决于它的营收和第二增长曲线等\n\n" +
                  "而链上则不同，大多数项目不是meme要么就是没有任何营收的概念性产品，传统的所谓估值手段是无效的。所以大家常常会说的就是看这个代币的叙事怎么样？\n\n" +
                  "那什么又是叙事呢？叙事就是更多人看到了以后会产生想要买入冲动的理由\n\n" +
                  "这里我直接给出我的结论，我们要去购买什么样的叙事？\n\n" +
                  "（1）一级投资最大的叙事就是人。很简单，项目都是人做的，所以一个对的人能创造无穷的奇迹\n\n" +

                  "## 如何卖出\n\n" +

                summary: "MIRRO 的 BSC 交易自省长文（写作时浮盈 400K USD）：他在 BSC 有过多次高光——4% 的币安人生、1.5% 的 GIGGLE、1.5% 的我踏马来了、2% 的龙虾，还有 150 万 U 的 TUT 梭哈、Broccoli 梭哈——却一个都没拿到大结果，不是卖飞就是浮盈回吐，由此总结 BSC 交易里对与错。他说贪婪是动力、傲慢才是交易者最深的原罪且无法自察：主观评价与先入为主的经验主义是定时炸弹，重仓亏大钱多源于此。随后拆解目前市场的五种交易方向及其各自的傲慢陷阱：① 直接新闻交易叙事（CZ、何一换头像、官方奶、抠字眼），傲慢在于对新闻敏感度偏差与『太贵了/不如分流/这个会删推』式的预判——以 bstock 为例，他 1M 左右浮盈 23K 却死等何一发推、没止盈，被 hey stock 分流又遇产品延迟 10 天，概念已死；② 社会热点与议题 meme（白毛股神、哈基米、央视抖音热点），傲慢源自认知局限，只能靠多研究多思考改善；③ 杂交叙事升级（②的代币被 BNB 相关账号互动蹭到后升级，如背手负鼠、龙虾，是目前 BNB 利润最肥厚的一段），傲慢是无知的自信——以为官方下场回复就一定会做、做了就一定有 Alpha，他点名自己在忍者、FIGHT、安小将上犯过；④ 对抗叙事（标靶如 OKX Layer 的 XDOG、Ansem 的黑牛、CZ、币安人生），傲慢是对事实的主观扭曲，见涨就喊组局阴谋、骂完还要买分流；⑤ 机制新玩法，他基本没赚过钱故略过。第三部分讲如何构建理性的交易生活：他半年里每天 10+ 小时在电脑前主要打游戏兼看新闻，不紧绷但新闻机会位置常不够好；等待机会的主次顺序是新闻＞趋势＞衍生构思＞聪明地址——聪明钱地址最没用，BSC 新闻大于一切；CZ 那个代币本质也是新闻，他只是提前想了十步埋伏到好位置，没埋伏的话 1–10M 他也会重仓追。最后戒情绪交易：傲慢必衍生情绪，判断对了就把正面情绪散布出去帮庄和游资拉升；永远不要说『凭啥、内幕、一眼假、组局』，要改成『值得研究，试着反驳，找到论据，做出判断』。",
                url: "",
                body:
                  "写这篇文章的时候浮盈400k usd\n\n" +
                  "写在开头：\n\n" +
                  "其实在bsc链上我有过很多次高光时刻，比如4%的币安人生，1.5%的giggle，1.5%的我踏马来了，2%的龙虾，以前还有150万u的tut梭哈，broccoli梭哈等等；写这些不是为了装逼啊，是想告诉你们我曾经一个都没能拿到大结果，但是曾经都有很多的浮盈，或者卖飞了，那么需要总结哪些事情对于bsc的交易是对的，哪些事情可能存在弊端。\n\n" +
                  "## 第一部分：认知自我的傲慢\n\n" +
                  "“傲慢”事实上是每个交易者的最深的原罪，贪婪是一种动力，能够带动你的求知欲和战斗状态，但是傲慢本身是无法被察觉的，以至于经过了五年的交易洗礼，在半年左右我开始意识到自己的“傲慢”\n\n" +
                  "它会在方方面面侵蚀你，不论是你曾经的高光时刻，火鸡科学理论，还是舒适圈，都会不断地挑战你的内心中的傲慢；\n\n" +
                  "我相信大部分的交易者都会说过一句话叫做“这有什么？这不就是？这没意思，这不可能，等等……\n\n" +
                  "主观的评价和先入为主的经验主义事实上是交易的定时炸弹，我个人的很多重仓亏大钱的来源也是如此；傲慢这个主题会贯穿我这篇文章的全文，我希望的是每一个想要进步的交易者能在不断地自我审视中意识到自我的狂妄和傲慢\n\n" +
                  "## 第二部分：目前市场的交易方向拆解\n\n" +
                  "①直接新闻交易叙事：直接新闻交易叙事代表例子有很多，抽象来说，cz heyi的换头像，bnb官方的奶，俗称的抠字眼都可以算作是直接新闻交易，这种叙事如果不是坐在电脑面前很难抓到，可以学习的对象可以找 枯坐p小将， chenpepe，afeng，高中生，都是新闻交易里很不错的\n\n" +
                  "②社会热点和议题meme：这个部分的交易是最容易亏钱的，但是相反只要你发现的趋势够早就很容易抓住的机会，比如白毛股神（这个还比较特殊，一会儿详细说），哈基米，各种央视和抖音以及社会热点都可以算作这一类\n\n" +
                  "③杂交叙事升级：刚才我们提到的②当中很多代币如果被bnb相关的任何账号互动或者蹭到，就会产生所谓的叙事升级，也是目前bnb利润最肥厚的一段交易机会，但是很多情况下等待时间漫长，成本稍微高一些就会长期浮亏影响操作，比如最典型的就是背手负鼠，龙虾\n\n" +
                  "④对抗叙事：对抗叙事首先要有标靶，比如okx layer的xdog，影响到了bnb链上的日活，这些只要产生会对bnb的客户留存率产生负面影响的东西，都可以算作是对抗叙事，比如这个ansem的黑牛，他们要推动交易所，并且大部分的资金和舆论都倒向了sol之后，cz这个代币的出现就可以当作一个比较好的对抗叙事的代表。之前还有币安人生，也是很经典的对抗叙事\n\n" +
                  "⑤机制新玩法：这个类别我基本没赚过钱，就不写了\n\n" +
                  "这五种玩法都会因为你的傲慢而产生巨大的分歧结果\n\n" +
                  "针对①新闻叙事里面的傲慢是什么？是“太贵了””不如分流”“这个会删推”\n\n" +
                  "新闻叙事第一性原理是，时间过去了多久，目前的市场流动性是多少，\n\n" +
                  "我们的傲慢来源于对新闻的敏感度偏差，同样的新闻不同的履历的人解读结果其实会大相径庭；\n\n" +
                  "最典型的就是bstock这个概念，当天其实只需要抓住bn要做股票的决心，每个账号都会提及就好了，不过当时遭到了hey stock的分流以及长时间的产品上线延迟，我在1m左右浮盈23k，没做好止盈，在等待heyi发推的过程中就挂机了，分流发生之后也没有及时止盈；这个标我也有傲慢的地方，就是认为heyi和cz一定会提及和产品上线，这个来源于我的经验判断，他们最后确实上线了，但是delay了10天，这个概念已经死了\n\n" +
                  "针对②社会热点的meme的傲慢，源自于认知局限；简单来说就是蠢，这和经历了多少次项目有正相关，多研究多思考能改善这个傲慢\n\n" +
                  "针对③杂交叙事升级，这个的傲慢来自于无知的自信，很多时候我也犯了这个错，比如忍者，fight，安小将等等，我觉得bn下场回复了就一定会做，做了就一定会有alpha，这是不成立的火鸡言论，纯智障，最容易亏钱的傲慢之罪\n\n" +
                  "针对④对抗叙事，这种傲慢如果要描述起来就是，稍微有一个涨的好的，就说组局阴谋，比如tst上了，老外上了，甚至我上了都有人说阴谋，那这种傲慢来自于对事实的主观扭曲，并且很多人扭曲之后还会上推特再骂一次，骂完了还要去买分流，这就属于是傲慢到了极点，不配赚钱了；\n\n" +
                  "针对这种傲慢，我没啥办法，人格底色问题\n\n" +
                  "## 第三部分：如何构建理性的交易生活\n\n" +
                  "在这半年里我每天平均有10+小时在电脑前，但是我主要是打游戏，然后兼顾看新闻和热点，这种状态好处是不太紧绷，坏处是新闻交易机会来的时候一般位置不够好，根据个人的实际情况来选择合理的交易习惯会比较好些；\n\n" +
                  "那么我们在等待交易机会的过程中要注意的主次顺序是：\n\n" +
                  "①新闻＞②趋势＞③衍生构思＞④聪明地址\n\n" +
                  "很多人把聪明钱地址奉为圭臬，实际上这个是最没用的\n\n" +
                  "就记住，在bsc新闻大于一切就对了，对于cz这种代币，本质上也是新闻，只不过我提前想了十步，埋伏了，找了好的位置而已，如果我没有埋伏，没去思考，那么1-10m我肯定会重仓追的，毫无疑问；\n\n" +
                  "做交易最忌讳的是情绪交易，傲慢，懊悔，愤怒，难过，都是不应该存在的东西，你唯一应该有的情绪是，当你的判断正确，及时的散布出去，让更多的人知道，被你这种正面情绪感染，这有助于庄和游资继续做拉升；\n\n" +
                  "能戒掉情绪，交易就基本胜利了，因为傲慢一定衍生情绪；\n\n" +
                  "永远不要说“凭啥，内幕，不用看，一眼假，组局，做饭”\n\n" +
                  "要改成“值得研究，试着反驳，找到论据，做出判断”"
              }
            ]
          },

                type: "复盘",
                summary: "Shanks 写给自己的反思：看时间线上好多单币 A7、A8，再看看自己，踏空了太多，焦虑的感觉一下又上来了——他回想整笔交易，错误太多，写下来理清思绪、激励自己，也希望对大家有启发。错误一：并没有真的坚持自己的看法。以太的这个 OG 盘，他之前是了解并清楚底细的：这位小女孩之前就与老马有过很多次互动、也一直在主张推行这个吉祥物，而且这位小女孩与这个盘子本身就有过互动、且只与这个盘子本身互动过，在此背景下其余 SOL 链和 BSC 的都是在蹭；另外老马在他感觉中有着浪漫主义和感性的特点，所以一定会回复、并且大概率愿意将其作为 SpaceX 的吉祥物。自己当时的内心想法是这样，但是被影响了：都说相信自己，在实际操作时并没有真的身体力行这句话；被影响的点在于，几乎没有车头在昨天十几 M 的位置建仓，潜意识里的看法就变成了『这些聪明钱车头都没有选择这个，那这个代币可能就没那么好吧』，从而没有认真看待、也没有下注合适的尺度，只是把链上没清理完的残币都丢进去了。回过头想想，他们的想法就一定 100% 正确吗？他总是把鲁迅这句话『从来如此，便对吗？』时常挂在嘴边，但自己却没有认真地这样去思考，真可笑；以后的交易中，要多激发自己原本对其的看法、多屏蔽外界的杂音——他人的看法并不总是对的，真正的利润也从不诞生于大部分人的想法里。错误二：被焦虑的情绪严重影响。回复好、然后一瞬间起飞后，看到错失了太多原本的利润，焦虑的情绪上涌，叠加破罐子破摔（『就这些还不如卖了』）的负面想法，过早地卖出了太多所剩无几的珍贵筹码；后面又想着用引以为傲的波段方法来增加持仓，结果越波越飞、完全没有回调。所以应该树立的另一个想法是：认真对待每一笔交易，珍惜每一枚筹码，并且在趋势没有被逆转的时候，减少或者不做所谓的波段操作。唯一他认为做对的地方：有认真地调研代币和叙事，没有遗漏和不知道的信息，信息源方面是够充足的。总结就是这几句话：1. 对于这种等级的博弈，务必十分认真地将信息调研得清清楚楚和完备；2. 务必多听从自己的想法，哪怕输了也没关系，至少事后重心能放在自己身上——错了能够认真地反思自己，赢了后能复盘哪里做对了；听信别人的看法后，不论输赢，焦点都会偏移到别人身上，赢了会认为是别人厉害，输了会觉得是被别人坑害；3. 再重复一下以自省：从来如此，便对吗？",
                url: "",

                summary: "Shanks 的新年自述（标题为小琪代拟）：新的一年了，过去这一年总算是打破了自己的魔咒——没有归零，也没有大的回撤；想到这里有些废话想说，一些自我的总结，当是说给自己听。他经历过两次归零，事情的发展都大差不差：第一次是 22 年，两个月 2000 倍，乘风而起后觉得自己无敌了、认为自己是金融天才，得意忘形，结局当然是注定的；23 年貌似痛定思痛、重新出发，又站起来了、达到更高的高度，不过还是没想清楚——个人的力量在趋势面前就是蜉蝣，还是一样，在一次回撤后陷进无限的死循环、消磨掉所有的资本；到 24 年，这一年算是全身心进入币圈。24–25 年的经历和真正厉害的人相比不值一提，但对于 Trump 的后手坚定上车，他还是比较自豪的，两句话总结他的路径：24 上半年积累经验、到处挨打；9、10、11 月行情爆炸、狗都能赚；积累了一点资本；ACT 上现货公告 10 分钟梭哈；Trump 一觉睡醒下午一点在十几 U 的价格梭哈；77U 的价格离场；提了点钱改善生活，剩余全部质押理财吃利息；25 年一直游玩到现在。他多嘴补充 Trump 的逻辑，认为对大家很有帮助：逻辑其实很简单——这种事情肯定会传遍世界的每一个角落，在世界上大部分人知道这件事之前，它都是错付的赔率，和价格、市值、流动性等都无关，只跟时间有关；当时也在老频道说明了传播的时间逻辑：价格差不多 24h 达到最高点，错付的赔率被时间抹平，48h 后基本宣告结束。对于他来说，25 年最大的成长是知道守住自己的钱袋子了；他对这句话颇有体会：『顺势而成非己力独能，平凡人借势而已。』之前玩数藏，他观察仅有的流转信息和社群情绪跟在后面偷摸舔汤喝、每天看总市值判断大方向等等所谓巧思，以为那是自己的能力、是管中窥豹的天才之举、是聪明智商高、是嗅觉敏锐超越他人——实际上纯扯淡、什么都不是，没有行情的支撑，所有的一切都毫无意义。他认为真正的天才是极其稀少的，大众意义上的天才是无数个日夜的积累；所有人都是普通人，区别只在于：挨打挨得多不多，是否坚持下来了。认为自己比大多数人要强、自己兜里的钱是凭本事赚的而不是行情给予的馈赠——有这个想法是最坏的情况，因为这才是大部分人死磕不离场、亏损的根源。认清自己，这个太重要了。『运去金成铁，时来铁似金。』共勉。",

                  "新的一年了，过去这一年总算是打破了我自己的魔咒，没有归零，也没有大的回撤。\n\n" +

              {

                title: "链上市场擒龙术七--真正赚钱的方法及BUG、链上一切的终局",
                date: "2025-10-23",
                type: "长推",
                summary: "Shanks『擒龙术』系列收官长文（他说可能也是最后一篇，一级市场十年底层逻辑都在这里）：核心认知是交易就是打游戏——普通人想站上高段位靠苦练不够，要么天赋、要么找到 BUG。他断言对 99.99% 的普通散户，链上资产爆炸增长有且只有一个方法：在市场中找到 BUG 并在它被更多人知道、被市场修复前疯狂牟利，不够退休就彻底休息、找下一个 BUG，找不到之前一分钱都不要动；并提醒先认清自己——适合交易的天才从第一天就赚钱。BUG 的定义：能让你迅速且稳定地赚到钱（最重要）、知道的人少、路径简单链条短可重复性强、点透了像脑筋急转弯。文中详述六个已流传较广的公开 BUG：① 推特 CA 监控——用关注关系与粉丝数筛出顶级名人名单（如机构创始人、Web2 名人、交易所负责人），监控其发帖中的 CA 立即推送，路径是看到推送—查背景—查是否作过恶—买入—CX—发酵—卖出（举例：某老牌跨界名人从不推币、忽然发帖支持一个 Meme，币从 120K 一夜涨到 11M 共 91 倍，剔除控盘后真实散户盈利前五平均攫取 20 万美元）；这条路在 NFT、以太土狗、铭文、DeFi 每一轮都是常青树，只是本轮知道的人太多、难度已高。② 大 V 地址监控——从抽奖贴评论区留址与往轮牛市痕迹里筛出大 V 本人及关联地址并监控其发币（举例：苏富比副总 Michael Bouhanna 2024-10-25 发的 $Ban 两小时从 5K 冲到 5M，散户约能吃 300 倍；老外基本不换钱包、法律风险低）。③ 新钱包及休眠钱包买入监控——内幕资金在利好前低价买入的钱包多有两个共性：新钱包居多、或长期沉寂突然提币买入涨后即卖再沉寂（休眠钱包），筛出监控后跟买跟卖、不能买太多（外星猫靠类似逻辑起家并在年中公开了监控）。④ 抓地址交易（抓庄）——先到股票市场学真正的坐庄操盘底层逻辑（币圈教程多是吃剩的、误导严重），提炼共性去找操盘地址，黑暗森林式偷偷跟买喝汤：币种绝不与人分享、多号分仓极力隐藏，他自称『地道战老鼠打法』；这类方法学习门槛高、不易被复制，确定性极强。⑤ DEV 团队地址追寻并监控——专做小盘造 Meme 的团队资金量不够控盘，跟他们一起 cook，但需自身经验判断辅助。⑥ 收割机器人（小方法举例）——新盘若图、名、DEV 全新，部署瞬间会有约十来个地址各 200–500 刀全自动买入，死盘忽然冲进几笔买单也会引来十来个地址跟买，这些高频机器人日收益为正即纯挣、利润可达上百万刀，摸清规律即可反向获利。第三部分讲终局本质：想清楚你的货要卖给谁——这是世界上所有利润的核心来源，跟开公司卖产品给广告商而非用户同理（INS 卖轻奢旅游广告、推特卖金融汽车广告）。链上举例：3 秒内买入 CZ 金句单词的货，要依次卖给稍慢的 P 小将、中等速度的在线人群、几分钟到 4 小时内注意到的更广群体、以及后续利好带来的再一波人群；AI/应用类代币卖给更慢发现其潜力的人；币安人生则示范了 6 小时卖光（卖给当前在线玩家）、24 小时卖光（卖给链上所有玩家）、出本金后长拿到上合约/现货分批卖（卖给币圈所有人）三种『卖给谁』想得越来越清楚的打法。所谓叙事交易，就是判断这个故事能传播到第几圈层：没钻住、追高被浇给，都是没想清卖给谁；亏损是误判故事只能到第三层却赌了第四层，卖飞是故事能到第五层却以为只有第四层——想清这件事才能准确总结经验、无限提升。尾言是他标志性的打鸡血：不散播焦虑与 FUD，只散播信心——相信相信的力量，相信自己能走到哪一步决定成就。",
                url: "",
                body:
                  "本文文字居多，请耐心看完，一定会对你有所帮助。熟悉我的人都知道，我从不会讲笼统的屁话。\n\n" +
                  "本篇只有真相和切实的方法，以及我全部的心得。\n\n" +
                  "以下全部皆为我的个人看法，不构成任何投资建议及不具有普遍性。\n\n" +
                  "文章比较长，但是我走到现在全部的经验和心得了。也可能是我擒龙术系列的最后一篇了，因为这篇写完后，大抵也无文字可写了。因为我认为一级市场十年来的底层逻辑的一切都在这里了，方法有变化，但是其中的共性逻辑永不会变。\n\n" +
                  "本篇是链上市场的最终本质，是最底层且永远不会变的逻辑。\n\n" +
                  "本篇会讲清楚链上所有拿到大结果的地址背后的本质原因，以及他们是如何在这场游戏中寻找到这样的BUG，并以此来进行疯狂地抽取流动性而牟利。而不是浮于表面的幌子和虚假的故事。\n\n" +
                  "目录\n\n" +
                  "一、改变认知\n\n" +
                  "二、“BUG”详述\n\n" +
                  "三、链上一切的终局，赚钱的最终本质\n\n" +
                  "## 一、认知改变\n\n" +
                  "首先有一个认知十分重要。在不论是什么市场中交易，都是一样的。那就是在市场中交易这个行为本身，就是在打游戏。\n\n" +
                  "请灌输给自己这样的认知，就是打游戏，而不是就像是在打游戏。\n\n" +
                  "我们都知道，游戏，要想打得好，超脱于常人，常规路径就是反复的大量的练习，一直打一直打，从而提升你的游戏技术水平。但如果要站上最高水平，不仅需要艰苦卓绝的努力，更重要的是天赋。大部分人都是这样的想法。\n\n" +
                  "有少部分人就会起别的心思。比如开挂，比如找到某个BUG，从而利用这个在短时间内疯狂地提升段位。\n\n" +
                  "举个例子，英雄联盟，曾经有个人发现，可以让召唤师技能（比如闪现和治疗）的冷却变为0，提交BUG无果后，他用此BUG一夜就打上了服务器的第一，以此来声明这恶性BUG的害处。后果就是受到了封禁。\n\n" +
                  "再比如，MMORPG类游戏，时常会发生库存数量BUG。简单来说就是将仓库里的货物卖出后，数量不减反增。那么有人就以此在一夜时间内用此方法获取到天量的游戏货币。如果这款游戏的货币能卖钱，那会套出非常可观的现金。后果就是，如果跟现实世界挂钩了，会被抓走。如果没有，那也必定会遭到封禁。\n\n" +
                  "但是，超出常理的事是：你在市场中这样干不会有任何不好的后果，尤其是在币圈的链上市场。反而会疯狂地奖励你。\n\n" +
                  "前面说过了，在市场中交易就是打游戏。所以，要想在市场交易中拿到大结果，对于99.99%的人来说，有且只有一个方法。\n\n" +
                  "在币圈，在链上这个地方，对于我们，这个最庞大的普罗大众群体来讲，请抛掉其他所有一切所谓成为强技术交易员，跟随趋势吃肉，判断准确从而收获，埋伏从而收获，等等诸如此类地不切实际的幻想。这些只适合那些万里挑一的天才。\n\n" +
                  "那么链上的BUG是什么呢？我对于BUG的定义是这样的：\n\n" +
                  "1.能够让你迅速且稳定地赚到钱。（最重要的一点）\n\n" +
                  "2.知道的人少。\n\n" +
                  "3.路径简单，链条短，可重复性强。\n\n" +
                  "4.发现后能让你觉得这玩意就是脑经急转弯。\n\n" +
                  "再强调一下，对于普通散户来讲，链上资产爆炸增长的方法只有只有只有这一个：\n\n" +
                  "在市场中找到BUG，并以此在短时间内疯狂牟利，直到BUG被更多人知道后，市场自然地修复它。如果这次的利益不够你退休，那就彻底休息并寻找下一个BUG。\n\n" +
                  "在找到下一个BUG前，我建议一下都不要动，一分钱都不要调用。\n\n" +
                  "再啰嗦一点，认清自己。这太重要了。99.99%的人不适合交易，不适合炒币。\n\n" +
                  "因为这也符合这样一条大家都清楚的规律：绝大部分人类就是普通的，这是世界运行的规律。\n\n" +
                  "以我接触和观察了这么多之后，我要说的是，如果你适合交易，是位天才，那么你从第一天开始就能赚到钱，且总体上是一直在赚。我强调这一点的目的是为了让你抛弃掉你是那位万里挑一的天才的幻想。脚踏实地的找BUG吧，或者开挂吧。\n\n" +
                  "## 二、“BUG”详述\n\n" +
                  "找BUG很难，但点透了却又很简单。\n\n" +
                  "以下是在当前时间段当前群体中，流传已然较广的可公开BUG举例详述：\n\n" +
                  "1. 推特CA监控\n\n" +
                  "这个东西现在其实已经流传得比较广了。其核心逻辑是，某位推特上的大V（比如某某机构的创始人，又比如某位web2的顶级名人，比如某个在上一轮十分牛逼，但大多数新散户不认识的人，比如某交易所的负责人，比如某位大厂的技术负责人等等。）他们在链上热的时候，会忽然发帖子去推某一个币（有利可图）。\n\n" +
                  "FOMO点很简单，就是这个从来没有推过币的这个顶级名人推了这个币，那么有他的背书，大部分人就会认为这个币是有说法的，那么这个币就能短时间获取到巨量的买盘从而疯涨。\n\n" +
                  "这种事情已经发生过无数次了，这样的暴涨盘子不胜枚举。\n\n" +
                  "随便举个中等情况的例子。\n\n" +
                  "比如在去年9月底，某位较老的横跨WEB2和币圈的知名人士，从来没有宣布支持过哪个币，忽然一天发帖说支持了一个MEME币。有他的背书，这个币从他发帖时的120K一夜之间涨到了11M。这中间是91倍的涨幅。剔除掉控盘地址后，真实散户盈利前五名，平均攫取了20万美金的利润。\n\n" +
                  "这样的币多多少少大家都经历过。\n\n" +
                  "回想一下，这个币到底该如何吃到这样的利润呢？从10K到12M，这一路上到底哪里是能够获取到信息并吃到呢？\n\n" +
                  "很容易想到，一路上的关键点在于这位名人在120K的市值时发的帖子。如果你第一时间看到了，且这位名人比较久远了，近几年不怎么活跃，绝大多数的新散户根本不知道他，所以他在推特发帖推这个币的那会，根本就没有什么热度和人知道，随着人们的传播，渐渐地热度和买盘就呈指数型暴涨。那就能吃到这91倍的涨幅。\n\n" +
                  "但是推特上这么多名人大V，每个人每天发那么多帖子，总不是每个都关注且点上小铃铛吧。那根本看不过来，而且也覆盖的根本不全。那么就需要技术来做这件事了，通过各个大V之间的关注散发及粉丝数量的筛选，筛出一份名单。\n\n" +
                  "这个名单就比较全了，监控这份名单上的所有人的发帖内容，只要某个帖子中带有CA，就立即推送到你的眼前。这样的监控目前市面上有蛮多了已经，感兴趣就直接在推特搜索，找一个去体会下。\n\n" +
                  "路径是这样的\n\n" +
                  "看到推送信息-查询背景-查询之前是否做过恶-买入-CX-发酵-热度上升-卖出获利。\n\n" +
                  "现在你可能已经知道这一点了，但是，去年3月时你知道么？去年8月底开始你知道他么？大概率是不知道的。但是我要说的是，去年明白这个路径，能依此攫取超额财富的人，是上一轮知道的，而不是当时才发现的。这个路径最早能追溯到好几年前。\n\n" +
                  "只不过目前没有新血液进来了，时间过去一年多，场内的人知道这个逻辑的越来越多，当前这轮，这个路径要赚钱的难度已经很高了。\n\n" +
                  "但是，这个逻辑和路径是链上每一轮的常青树。在NFT时期就已成熟，只不过标的物是图不是币。在NFT的初期，这个路径十分好用。同样的，在NFT的第二轮中就很难了。\n\n" +
                  "以太土狗时期这个路径也是这样重走了一遍，铭文时期也是这样，DeFi时期也是这样，现在，也是这样。\n\n" +
                  "当然，随着时间的流逝，这样的监控目前市面上有蛮多人已经公开在做。\n\n" +
                  "2. 大V地址监控\n\n" +
                  "苏富比拍卖副总Michael Bouhanna在24年10月25日忽然发了一个币$Ban，是一个十分知名的香蕉艺术品，最高涨到了数亿美元。\n\n" +
                  "最开始，$Ban在两小时内就从5K冲到了5M，这一路上没什么阴谋拉盘。如果抛去底部10%的筹码被控，散户能吃到的是大约300倍利润。\n\n" +
                  "还是一样，我来明晰下路径。\n\n" +
                  "监控到大V发币-查询背景-查询之前是否做过恶-买入-CX-发酵-热度上升-卖出获利。\n\n" +
                  "那么问题又来了，到底该如何知道这是大V的地址，该去哪找这些大V的地址，他们不会换钱包吗（老外基本不会换和刻意隐藏自己钱包，因为他们的法律风险很低）。\n\n" +
                  "实操其实也不难，方法是，筛选币圈相关推文（尤其是抽奖贴），将评论区留下的地址进行再次筛选，如果留地址的是大V或者币圈相关的人士，且有一定知名度，收集起来。\n\n" +
                  "再去找寻之前几波牛市时，留下痕迹的大V地址，收集起来。\n\n" +
                  "再将他们的关联地址都一并收集起来，进行监控。一旦发币，立即推送到你的眼前。\n\n" +
                  "同样，当前市面上有很多这样的公开监控了。\n\n" +
                  "嗯，这个逻辑和路径也是链上每一轮的常青树。\n\n" +
                  "3. 新钱包及休眠钱包买入监控\n\n" +
                  "内幕，在这个市场上时常是存在。\n\n" +
                  "某个币在突发大利好后，就会吸引到散户们的注意力和买盘，从而猛涨。如果你经常扒地址，你会发现一件很奇怪的事。\n\n" +
                  "这个币在这个利好还未发生前，价格很低的时候，会有一些钱包毫无理由地买入，然后在大利好和暴涨发生后迅速卖出，获得不菲的利润。\n\n" +
                  "那我们能不能通过什么方法，监控到这些钱包的动作，并在他们偷偷买入时，我们也跟后面悄悄买一点混进去，然后一起在暴涨时获利呢。\n\n" +
                  "通过大量的筛查的交叉验证，发现了这些钱包大概率会有这样两个共性特点：\n\n" +
                  "1.新钱包居多。（原因在于，随便举个例子，如果你是某交易所的人，亦或者是某个项目方的人。你知道了这个币即将上线，你想偷偷买点，那大概率你会开个新钱包去买以避免被抓到。）\n\n" +
                  "2.休眠钱包。释义：这种钱包的活动情况是，一段时间完全没动作，在某一天忽然提币到钱包里，然后在利好发生前买入某个币，然后上涨后卖出。接着就是很久地沉寂，再没有任何动作，直到下一次。对于这类钱包，称之为休眠钱包。\n\n" +
                  "通过筛选链上的所有钱包，筛出具有这两个特性的钱包并进行监控。\n\n" +
                  "监控到动作-进行基本分析-买入（不能买太多）-等待发生利好-上涨-跟随他们卖出\n\n" +
                  "外星猫起家就是依靠这个类似的逻辑。今年年中他同样公开了他的监控。\n\n" +
                  "你知道我要说什么，这个路径也是链上每一轮的常青树。\n\n" +
                  "4. 抓地址交易（抓庄）\n\n" +
                  "关于这类，我之前的推文讲过很多了，基本上也趋于完善了。这里不多赘述，但我讲讲核心。\n\n" +
                  "核心逻辑是，先学如何坐庄和操盘的方法和基本逻辑。不用多么地精深，知道一个团队通过操纵价格从而攫取利润的方法是什么就行了。比如对敲等等。\n\n" +
                  "关于这类的学习，我的建议是，底层逻辑和方法不要在币圈看着学。直接找股票市场中的资料学习，那里讲的才是完整准确的。\n\n" +
                  "而币圈的诸多教程，都比较扯淡，很多都是吃剩下的东西，误导非常严重。所谓让大多数人觉得精妙绝伦的话，都是金融资本市场中的一条基本规律而已（妈的，而且说得还不全），源头不在这。\n\n" +
                  "比如，推特上很多放屁扯淡，不知所云的推文，根本不如某站上随便一个讲股票操盘案例的博主的视频有用。\n\n" +
                  "而后当你知道了操盘的一些方法后，你就能提炼出一些共性，通过这个共性去寻找到操盘的地址。跟随他们的动作在后面偷偷喝汤。\n\n" +
                  "所谓抓庄的方法比较有热度的核心原因是，学习门槛高（分享此类方法很难被别人复制，不会直接损害自己的利益），有效，确定性极强。所以各个博主都愿意分享这类方法的心得。\n\n" +
                  "路径是：\n\n" +
                  "通过你的知识储备寻找地址-一旦找到就是极高地确定性-跟着偷摸买入（币种无法与任何人分享，也不能暴露分毫，否则就是一分钱都赚不到且倒亏，相当于黑暗森林）-只能买一点，且要多号分仓，总之极力地隐藏自己-跟随偷偷地喝一点汤\n\n" +
                  "其实我更喜欢称之为地道战老鼠打法，偷摸地吃残渣。\n\n" +
                  "还是一样，这个路径也是链上每一轮的常青树。\n\n" +
                  "5. 更小一些的方法，这里只列举一个：DEV团队地址追寻并监控\n\n" +
                  "在链上，除了各个大盘子，还会有很多中小盘子冒出来。会有一批人专门做小盘子，制造某个有趣的MEME，不断地做饭。\n\n" +
                  "逻辑还是一样，去找到他们的所有地址及关联地址。有什么动作监控到，跟他们一起吃一些肉。因为他们的资金量不够，所以无法控制所有筹码和拉盘，更多地是和市场上的人一起cook。\n\n" +
                  "但是这种方法需要自己的经验和判断作为辅助，所以在此不多加赘述。\n\n" +
                  "6. 诸多小方法，在此只举例一个：收割机器人\n\n" +
                  "这就是小方法了，诸如此类的巧思很多，由于麦总很早公开讲过这一条，所以我也正好不用担心损害他人利益，就能在这里举这一个例子。\n\n" +
                  "在链上行情很好的时候，是有策略机器人存在的。是什么样的呢，如果一个新盘子的图片和名字以及DEV都是新的，那么部署的一瞬间就会有大约10来个地址，每个地址200~500刀不等，全自动买入。\n\n" +
                  "另外一点是，一个死盘子，忽然冲进几笔买单，也会瞬间有十来个地址跟着买进。\n\n" +
                  "这些买单都是全自动地高频机器人在买入。对于这些机器人来说，只要每天的收益是正的，哪怕只有4%，就是纯挣钱的。且由于十分高频，利润也比较恐怖。收益上百万刀的此类机器人很多。\n\n" +
                  "知道上面这些信息，那你应该知道怎么样产生利润了。\n\n" +
                  "没错，他也是常青树来着。\n\n" +
                  "## 三、链上一切的终局，赚钱的最终本质\n\n" +
                  "23号时，我看到了慧姐也在讲这句话，她从市值角度来论述，同样十分值得学习，可以去看看。共性的底层逻辑还是相通的。\n\n" +
                  "核心有这么一句话可以概括。想清楚你的货要卖给谁。\n\n" +
                  "大多数人无法想清楚这件事。\n\n" +
                  "在我看来，他是这个世界上所有利润的核心来源。\n\n" +
                  "你在链上交易，动作拆分是这样的：买入代币，然后等待卖出。\n\n" +
                  "实际上和商业行为一模一样。亦或者和世界上所有的行为其实都一样。\n\n" +
                  "比如你开了一家公司，不论是什么类型的公司。\n\n" +
                  "你买入了物品（可以是正在训练的人员、等待加工的材料、正在完善的互联网产品，等等），等待卖出（成熟的服务、加工完备的产品、完善的应用，等等）\n\n" +
                  "这里有一个问题，我们是来攫取利润的。那么你的利润该如何产生？\n\n" +
                  "直击本质，就是要卖给谁的问题。\n\n" +
                  "你是卖服务的公司？那你应该卖给那些对特定服务有一定要求的人，想清楚他们会需要什么，对什么感兴趣，会对什么样的服务卖单。\n\n" +
                  "你是互联网公司？比如你的APP是例如X和ins这样的大众社媒。（你可能会认为，你要尽力迎合的人群应该是用户群体。）\n\n" +
                  "但从利润角度来考量，逻辑不太对。再想清楚点，你要卖给的人应该是广告商而不是用户。你的用户群体应该是你产品的一部分。毕竟这才是可靠的收入来源。\n\n" +
                  "那么必须想清楚，什么样的广告商会愿意在我的社媒上打广告，他们会对什么样的用户群体感兴趣并买单呢？\n\n" +
                  "比如INS，那么就是轻奢品及旅游景点的广告商会愿意打广告，因为他们的用户群体就是自以为是的中产居多。而推特，目前就是金融及汽车领域的广告商会愿意打广告，因为他们的用户群体就是炒股炒币的人居多。\n\n" +
                  "理解了这个逻辑后，我们回到链上代币。\n\n" +
                  "你的币要卖给谁？\n\n" +
                  "我举例来帮助理解。\n\n" +
                  "· 如果你在3秒内买入了CZ发的一句有梗的单词。\n\n" +
                  "那么你的货应该卖给：\n\n" +
                  "1.速度比你稍慢但也蛮快的P小将。\n\n" +
                  "2.速度中等的在线人群。\n\n" +
                  "3.当前不在扫链面板前，但是更广的群体，他们会在几分钟到4小时之内注意到。\n\n" +
                  "4.后续未知是否会发生的情况及利好带来的再一波人群。\n\n" +
                  "· 如果你买入了一枚AI类亦或是应用类代币。\n\n" +
                  "那么你的货应该卖给：\n\n" +
                  "比你更慢发现这枚代币有较高潜力的人群。\n\n" +
                  "· 再直接拿币安人生举例子。\n\n" +
                  "交易员A：他在CZ回复时买入。然后他在6小时内卖光。那么他想的是，他要将他的货卖给链上当前在线的所有玩家。\n\n" +
                  "交易员B：他在CZ回复时买入。然后他在24小时内卖光。那么他想的是，他要将他的货卖给链上的所有玩家。\n\n" +
                  "交易员B：他在CZ回复后的4小时内注意到并买入。然后他在时间走到32小时时，出掉了本金，并一直拿着。直到币安人生上了币安合约时又卖了一部分。那么他从一开始就想清楚了，他打算把货卖给上了现货后注意到这枚代币的币圈所有人，在此之前，还有一个窗口就是上了第一个中文Tikcer币安合约也可以出清一部分。\n\n" +
                  "这里我画了这张图，能更方便理解链上版币圈人群的分类。\n\n" +
                  "![链上版币圈人群分类图](assets/2866ccfbc174.png)\n\n" +
                  "链上车头们总是在赢，总是在赚。\n\n" +
                  "你佩服他们能钻，佩服他们的眼光精准，佩服他们能拿。\n\n" +
                  "你想学习，被告知了一句话，交易方法就只是叙事流。\n\n" +
                  "但是更多的信息并没有解释和细细说清，有点笼统了，会让你很迷茫。\n\n" +
                  "我来掰开揉碎地解释。\n\n" +
                  "总说叙事交易，什么是叙事交易？到底该如何提升对于叙事的把控？\n\n" +
                  "所谓叙事交易，就是需要你去判断这个故事能走到哪一步。\n\n" +
                  "再细分一下，就是这个故事能传播得多广。\n\n" +
                  "再细分一下，就是这个故事随着时间的流逝，能否传播到更广的人群。\n\n" +
                  "如何提升这样的能力？如何把握准确叙事流交易方法？\n\n" +
                  "解释到这，你就有答案了：那就是想清楚，你的货要卖给谁这个问题。\n\n" +
                  "如果你能领悟到这句话，会给你带来诸多好处，能找到所有问题的原因，既然找到了原因，那么很多问题就能一次全部解决。\n\n" +
                  "如果你懊恼自己没钻住。原因在于你没想清楚你要卖给谁，在到达的路上被K线和价格吓走了。是你没想清楚，实际上这个币能能够随着时间的流逝有更广的人群接盘。\n\n" +
                  "如果你后悔拍大腿没上车，于是急着追涨然后被浇给。原因在于你没想清楚你要卖给谁。实际上这个币的机会在之前你就已经错失掉了，如果这个币你判断无法再传播到更广的人群了，那么现在你就处于前面的人们打算要卖给的群体。那么你就不会焦虑并做出错误的决定了。\n\n" +
                  "这样的话，问题就能总结具体了，你才能踏上正确的无限提升道路上。\n\n" +
                  "简洁地来讲。\n\n" +
                  "如果你亏损了，那么就是你的判断出错了。本来这个故事只能传播到第三圈层，但是你误以为会到第四层。然后才能这样准确地总结失败的经验，转化为你的经验储备，从而提升你的判断能力。\n\n" +
                  "如果你卖飞了，那么也是你的判断出错了。本来这个故事会传播到第五圈层，但是你误以为最多只能到第四圈层。同样的，这样才能准确地总结失败的经验，从而提升你的能力。\n\n" +
                  "## 尾言\n\n" +
                  "我不喜欢散播焦虑，更不喜欢FUD。\n\n" +
                  "我认为，每个人缺的不是FUD，而是自信和信心。所以不论什么情况，我都会打鸡血和散播信心。\n\n" +
                  "我很喜欢这句话：相信相信的力量。\n\n" +
                  "第一个相信，相信的是“相信的力量”这句话。\n\n" +
                  "相信的力量，就是相信你自己。一个人能取得多大的成就，与他一开始认为自己能走到哪一步有关。\n\n" +
                  "如果你认为自己在这一轮中能够起家赚到一千万，并对此真的真的深信不疑。\n\n" +
                  "那么你一定能够做到。不仅你自己相信，如果屏幕前的你也这样暗暗发誓，并觉得孤独的话，那么算我一个吧。我永远都会相信你能做到，并将我的祝福送给你。\n\n" +
                  "你一定可以的，为了你自己，为了你的家人。"
              },
              {
                id: "shanks-tan-niuxiong",
                title: "谈牛熊：最大的错觉，是以为赚钱靠自己的能力",
                date: "2025-05-30",
                type: "长推",

                  "闲言少叙。散户朋友们的小资金，有多小呢，一部分几百U，一部分多点，1K~1万U。在这里就按照300U起步算吧。所以本篇也就算是在一级MEME市场，300U-100万U的真实路径策略，应该能让大家少走一些弯路。\n\n" +

                  "## 一、数据整理（以PUMP为例）\n\n" +

                  "## 二、策略的透彻明晰\n\n" +
                  "策略分类无非是：出手次数的多/少+追求高/低利润\n\n" +
                  "进行结合的话就会出现以下四个策略模型：\n\n" +

                  "2、出手次数多+追求低利润率模型\n\n" +

                  "4、出手次数少+追求低利润率模型\n\n" +
                  "接下来我们从数学上来彻底清晰的量化这四种策略的情况及优劣。\n\n" +
                  "由于本篇是讲小资金起步的策略，所以下文对于自己方面都以300U为基准（我跟你们一样，最开始的启动资金就是这个数）来分析。至于更多资金，即1万U~20万U、20万U~100万U的策略，会在后文讲到。\n\n" +
                  "如果是300U，目前也就是2.4SOL，就按照2.5SOL来计算吧。\n\n" +
                  "在这里多嘴再明晰一下盈利百分比的问题。因为GAS和贿赂费的问题，如果你每次0.1SOL的卖，每笔交易的损耗（按照标准速度计算）约为0.005SOL，如果在只保本的情况下，你也得再有一笔卖出的交易，损耗同样为0.005SOL。两次交易的损耗总的0.01SOL。也就是你买入后，起码得有10%的利润，再全部卖出，才能回本。账面利润低于10%，就是亏损的。\n\n" +
                  "1、出手次数多+追求高利润率模型\n\n" +
                  "为了方便计算，现在就先不考虑交易的损耗了。既然是出手次数多+追求高利润，那么就按照在一天的时间之内，你有2.5SOL，每次0.1，出手了25次。不进行止损的操作，为了追求高暴击。\n\n" +

                  "总结下，为什么会出现这样的情况？为何你的亏损概率居然能如此的高？原因很简单，你的本金不够。这个不够，是指你没有至少500SOL的不够。\n\n" +

                  "（3.8K~53K）即内盘。你买入，最可行的策略就是喊别人也进来接你的盘。低利润率止盈的话，需要的就是几十个点后就跑。\n\n" +
                  "这是比较容易做到的，因为内盘的市值低，带起涨幅需要的买盘要求很低。当前情况下，如果想在内盘吃翻倍，你喊来大约4000U的买盘即可。大约也就是40个人左右就行。这不难做到，上车后，在各个群都发CA，尤其是质量高的群，最好带上能FOMO别人的叙事。这个策略也是一些人彻底量化想清楚后一直在做的。\n\n" +
                  "（53K-100K）就需要比较大的买盘，那就需要你去喊来更多的人来接你的盘，条件较为苛刻了已经，需要喊来的人数只靠个人发群是办不到的，那只能靠着自己的理解去选择了。但是我们这里只讨论数学上的概率，所以排除经验因素，那么在这一段玩这个模型，是很难的，加之PUMP大家都清楚，不发射还好，发射后秒浇给的是绝大多数，这一段的含金量几乎没有。\n\n" +
                  "（100K-500K）这一段的涨幅一般是由什么构成的呢。1、小车头。2、叙事的真实性（稍微有点梗和传播度即可）。我们不能说是去依赖别人小车头的买盘和跟单，那么只剩下需要我们对于叙事的经验及判断力了。还是一样，排除这个因素，我们来看看数学上的数据是如何的。\n\n" +
                  "根据数据我们可以得知，超过100K的盘子有16个，其中，50%未超过500K，其余都超过500K，和去到了超过1M。这个数据是极为可观的，如果我们每一次都出手，胜率约在43%，盈利的总和相加后的粗略数字为 125%~675%。这个结论是否很出乎你的意料？\n\n" +
                  "（500K-1m）+（>1M）。这俩都是同一类。到这个区间，需要涨幅的条件，就有三条，1、大车头进场。2、庄盘。3、T2级别及以上的叙事。同样，大车头来与否，这个因素不可控，除非你是他的亲爹。那就剩下两个了，判断是否有庄、判断叙事及传播度如何。\n\n" +
                  "这两条也是极富经验主义的因素。从数学上来讲，我们不去考虑这个经验因素的影响，每个都上。那么你的综合利润率的粗略数字为223%~1250%~上不封顶。这个数字的波动如此巨大的原因与你的止盈点位有关。\n\n" +
                  "3、出手次数少+追求高利润率模型\n\n" +
                  "这一个类别，看起来似乎是异常相悖的。这对你的能力和经验是有着极高的要求。同时你的经验因素对这一策略的影响是占绝大部分的。这一个策略不进行细讲，站在新手散户的角度来进行考量并无任何的指导意义。\n\n" +
                  "但是似乎两个字我加粗了，如果所处的位置不是小资金散户，那么这一个模型在有些时候，他其实并不相悖。经验足够丰富，能力足够强的情况下，花时间去追求此模型是没什么问题的。\n\n" +
                  "4、出手次数少+追求低利润率模型\n\n" +
                  "条件如下：出手次数少（控制在1~3次，低利润率，设置为100%为止盈上限，止盈点位从25%~100%不等。每次出手的金额为0.5 SOL）。\n\n" +
                  "在这个模型中，因为数量的原因，100K是个重要的分水岭。我们进行区间合并，并将大于100K的区间上限设置为5M。\n\n" +
                  "了解此情况的条件下。我们开始计算我们出手次数少（平均为2次，每次0.5SOL）+追求低利润率模型（平均为62.5%止盈）在这两个区间内的期望收益是如何的，如图。\n\n" +
                  "不知道你是否意识到了，这个数据是很醍醐灌顶的。为什么？因为在100K-5M的区间内，你的盈利触发概率居然来到了99.67%。你可能感觉不强烈，那么，反过来，你在这个区间进入交易，单从数学上来讲，你的失败概率居然只有0.33%。\n\n" +
                  "没错，少出手+追求低利润率模型，这才是这所有策略中的，最优解。\n\n" +
                  "总结：在小资金起步时，排除经验及能力因素的影响，是以下四种情况。下图中的数据更加的贴合真实和覆盖面更广。\n\n" +
                  "## 三、巧妙地明悟交易-心理账户\n\n" +
                  "前面的所有，都从未提过心态这一极为影响交易的因素。为什么要这样？请听我娓娓道来。\n\n" +
                  "最开始的此阶段，作为一个小资金的散户，初到这个市场，除了设立你的资金账户外，我在这里为你引入另一个账户-心理账户，这一点极为重要。既然是账户，那么下面我来讲讲心理账户得到增加与减少的好与坏。\n\n" +
                  "- 心理账户得到恶性循环减少的坏处\n\n" +
                  "很多人的情况就是，进入到这个市场后，看着财富神话。学着他们的样子开始在市场中乱P和乱冲，一直幻想着自己能抓住下一个10X，100X。到处乱冲，不停的吃到亏损，总是在割肉。在此过程中，你的心理账户从未增长过，不断地被消耗，越来越没有勇气，对自己越来越怀疑且不自信。\n\n" +
                  "当你连续失败很多次的时候，你凭什么还敢下注去赢得下一次？\n\n" +
                  "被影响，惯性的认为，小资金想做大，必须一开始就追求极高倍数的币，看不上那些相对确定性的投机机会。冲狗从未停歇，却从来没有认真的停下来思考过，到底什么样的策略是适合自己的，从未清晰的量化过怎样的具体策略是合理且可执行的。\n\n" +
                  "其他的什么都不知道，反正就知道一件事，赔率大于一切。于是在没有自己沉心思考过自己交易体系的情况下，最终陷入无限下行的死亡螺旋，黯然退场。\n\n" +
                  "发生这种情况很可悲。试想一下，在某一天，当你历经千辛万苦，真的站在巨龙面前时。你似乎意识到，如果你挥剑斩出，你将登临天境。可是，你的宝剑已然腐朽不堪，你已然耗尽最开始的勇气和心劲。哪怕你斩出这一剑，也无法斩下巨龙那高昂的头颅，或者，你甚至没有勇气挥出这一剑。\n\n" +
                  "当你看到这里，我希望你停下来，回头想想我的分析，认真的思考一下。透彻的明晰一下到底该具体的采取什么样的策略。\n\n" +
                  "- 心理账户得到良性循环增加的好处\n\n" +
                  "不言而喻。是你有信心了，你越来越自信，不再内耗。每天的心情得到极大的舒缓，更容易冷静下来思考。当面对大机会时，你会更容易地看懂他，你就敢出手了。诸多好处，不再赘述。\n\n" +
                  "## 四、具体策略执行详述\n\n" +
                  "到底该如何具体的去执行呢？在这里我细致地来为你讲解。\n\n" +
                  "350U~20万U的具体策略\n\n" +
                  "首先，将你的2.5SOL资金账户，硬性的分为两类。第一类为交易账户，放入1.5SOL。\n\n" +
                  "每次出手控制在此交易账户总额的10%，即0.15SOL。\n\n" +
                  "最开始，最好是对着已经筑底成功的MEME开始交易。比如随便举近期的$RFC、$DARK等等。开始跟随走势进行波段。每天的机会不多，请耐心一些。否则止损概率会比较高。等待好位置进入，拥有几十点的涨幅后就进行止盈。严格管住手，不要追求高利润。\n\n" +
                  "如此进行下去，会不断地积累你的经验和增长你的心理账户。\n\n" +
                  "而剩余地1SOL，放入储备类账户。这个账户的金额不要经常去动他，这个账户是锻炼你对于大级别确定性机会的判断能力的。\n\n" +
                  "什么样的是大级别确定性机会呢？这个出现的次数不会很多，举几个鲜明的经典例子。比如11月币安忽然宣布上线ACT，公告发出后一个下午涨幅高达25倍。再到后来的AI之风起势，龙头标的在那一天齐涨。Trump那天突然发币。\n\n" +
