<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>个人主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --ink: #1b1b1d;
        --ink-2: #4a4a4e;
        --ink-3: #83838a;
        --line: #d9d9dc;
        --line-strong: #c2c2c7;
        --accent: #bc3a22;
        --accent-ink: #ffffff;
        --accent-soft: #f9ece8;
        --seal: #bc3a22;
        --chip-bg: #ffffff;
        --card-shadow: 0 1px 3px rgba(20, 20, 25, .07), 0 6px 18px rgba(20, 20, 25, .05);
        --card-shadow-hover: 0 4px 10px rgba(20, 20, 25, .12), 0 26px 48px rgba(20, 20, 25, .22);
        --bg-a: #e7e9ec;
        --bg-b: #d8e3ef;
        --bg-c: #f0e6cb;
        --bg-d: #e1e5ea;
        --ripple: rgba(188, 58, 34, .22);
        --glare: rgba(255, 255, 255, .5);
        --focus-ring: #bc3a22;
        color-scheme: light;
      }
      /* 深色变量：系统深色（且未手动选浅色）时，或手动选深色时，共用同一套 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171719;
          --surface: #232326;
          --ink: #f0efe9;
          --ink-2: #c6c3ba;
          --ink-3: #96928a;
          --line: #333336;
          --line-strong: #4a4a4f;
          --accent: #e0684c;
          --accent-ink: #1a0f0b;
          --accent-soft: #33201a;
          --seal: #c8452a;
          --chip-bg: #232326;
          --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
          --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
          --bg-a: #14161c;
          --bg-b: #1b2438;
          --bg-c: #242017;
          --bg-d: #171b24;
          --ripple: rgba(224, 104, 76, .3);
          --glare: rgba(255, 255, 255, .18);
          --focus-ring: #e0684c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #171719;
        --surface: #232326;
        --ink: #f0efe9;
        --ink-2: #c6c3ba;
        --ink-3: #96928a;
        --line: #333336;
        --line-strong: #4a4a4f;
        --accent: #e0684c;
        --accent-ink: #1a0f0b;
        --accent-soft: #33201a;
        --seal: #c8452a;
        --chip-bg: #232326;
        --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
        --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
        --bg-a: #14161c;
        --bg-b: #1b2438;
        --bg-c: #242017;
        --bg-d: #171b24;
        --ripple: rgba(224, 104, 76, .3);
        --glare: rgba(255, 255, 255, .18);
        --focus-ring: #e0684c;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        /* #095 动态渐变加强：浅灰 + 淡蓝 + 淡金之间大幅流动，渐变图 400%，8s 一个循环 */
        background: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d));
        background-size: 400% 400%;
        animation: bg-flow 8s ease infinite;
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
      }
      button { min-height: 2.75rem; font: inherit; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

      .wrap { max-width: 620px; margin: 0 auto; padding: 0 18px 72px; }

      /* ---------- Profile head ---------- */
      .profile { padding: 44px 0 4px; text-align: center; }
      .avatar {
        display: block;
        width: 104px; height: 104px; margin: 0 auto;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 4px rgba(255,255,255,.25), var(--card-shadow);
        user-select: none;
      }
      h1 {
        font-family: "Noto Serif SC", serif;
        font-weight: 900;
        font-size: clamp(34px, 8vw, 44px);
        line-height: 1.2;
        margin: 20px 0 0;
      }
      .tagline {
        margin: 8px 0 0;
        font-size: clamp(15px, 4vw, 17px);
        color: var(--ink-2);
        font-weight: 500;
      }
      .socials { display: flex; justify-content: center; gap: 26px; margin-top: 24px; }
      .soc {
        width: 48px; height: 48px; min-height: 48px;
        display: inline-flex; align-items: center; justify-content: center;
        border: none; background: none; padding: 0;
        color: var(--ink);
        border-radius: 50%;
        text-decoration: none;
      }
      .soc svg { width: 27px; height: 27px; fill: currentColor; display: block; }
      .soc:active { transform: translateY(1px); }

      /* ---------- Sections ---------- */
      section { padding-top: 44px; }
      .sec-title {
        text-align: center;
        font-size: 19px; font-weight: 700;
        margin: 0 0 18px;
        letter-spacing: .02em;
      }

      /* ---------- Referral cards ---------- */
      .ref-card {
        display: flex; align-items: center; gap: 6px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        padding: 10px 12px 10px 10px;
        margin-bottom: 14px;
      }
      .ref-main {
        flex: 1; min-width: 0;
        display: flex; align-items: center; gap: 14px;
        text-decoration: none; color: var(--ink);
        border-radius: 10px;
        padding: 4px 2px;
      }
      .ref-ic {
        flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .ref-ic svg { width: 50px; height: 50px; display: block; }
      .ref-ic img { width: 50px; height: 50px; display: block; object-fit: cover; }
      .ref-text { flex: 1; min-width: 0; }
      .ref-name { display: block; font-size: 16.5px; font-weight: 700; line-height: 1.35; }
      .ref-desc { display: block; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin-top: 1px; }
      .ref-desc .code { font-family: "IBM Plex Mono", monospace; font-weight: 500; color: var(--ink); }
      .ref-desc .save {
        display: inline-block;
        background: var(--accent); color: var(--accent-ink);
        font-size: 12px; font-weight: 700; line-height: 1.5;
        border-radius: 5px; padding: 0 6px; margin-left: 6px;
        vertical-align: 1px;
      }
      .ref-go { flex: 0 0 auto; color: var(--ink-3); display: inline-flex; }
      .ref-go svg { width: 18px; height: 18px; }
      .copy-btn {
        flex: 0 0 auto;
        min-height: 2.75rem;
        display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink-2);
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13.5px; font-weight: 500;
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .copy-btn { background: var(--surface); border-color: var(--line-strong); } }
      :root[data-theme="dark"] .copy-btn { background: var(--surface); border-color: var(--line-strong); }
      .copy-btn svg { width: 14px; height: 14px; }
      .ref-note { text-align: center; font-size: 13px; color: var(--ink-3); margin: 4px 0 0; }

      /* ---------- Motion（#074 / #081 / #085 / #095 / #096 / #153） ---------- */
      @keyframes bg-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* #096 悬浮加强：头像上下浮动幅度 14px，2.8s 往返一次 */
      @keyframes avatar-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      .avatar { animation: avatar-float 2.8s ease-in-out infinite; }

      /* #096 呼吸光圈：头像外圈圆环缓慢放大并淡出，2.8s 一次脉冲 */
      .avatar-wrap { position: relative; display: inline-block; }
      .avatar-wrap::after {
        content: "";
        position: absolute; inset: -3px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
        pointer-events: none;
        animation: halo-pulse 2.8s ease-out infinite;
      }
      @keyframes halo-pulse {
        0% { transform: scale(1); opacity: .55; }
        70% { opacity: 0; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      /* #074 滚动淡入加强：从下方 60px 处 0.9s 上移淡入，同时由 0.96 放大到 1，--d 控制依次延迟（0.15s 递增） */
      .reveal {
        opacity: 0;
        transform: translateY(60px) scale(.96);
        transition: opacity .9s ease var(--d, 0s), transform .9s ease var(--d, 0s), box-shadow .3s ease 0s;
      }
      .reveal.in { opacity: 1; transform: translateY(0) scale(1); }
      /* 淡入结束后清掉延迟，并把过渡切回悬停/倾斜用的短过渡 */
      .reveal.done {
        transition: opacity .3s ease 0s, transform .25s ease-out 0s, box-shadow .3s ease 0s;
      }

      /* #081 悬停抬升加强：0.3s 内抬高 14px、放大到 1.03、阴影明显加深；仅对有悬停能力的设备生效 */
      @media (hover: hover) and (pointer: fine) {
        .ref-card:hover {
          transform: translateY(-14px) scale(1.03);
          box-shadow: var(--card-shadow-hover);
        }
        /* #153 3D 倾斜的反光层：跟随 --mx / --my 移动 */
        .ref-card:hover::after { opacity: 1; }
      }

      /* #153 反光层：径向高光，位置由 JS 写入的 --mx / --my 控制 */
      .ref-card { position: relative; overflow: hidden; }
      .ref-card::after {
        content: "";
        position: absolute; inset: 0; z-index: 2;
        background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--glare), transparent 65%);
        opacity: 0;
        transition: opacity .3s ease;
        pointer-events: none;
      }

      /* #085 涟漪：点击处扩散一圈波纹，0.6s 淡去（尺寸与位置由 JS 写入） */
      .soc { position: relative; overflow: hidden; }
      .ripple {
        position: absolute; z-index: 3;
        border-radius: 50%;
        background: var(--ripple);
        pointer-events: none;
        animation: ripple .6s ease-out forwards;
      }
      @keyframes ripple {
        0% { transform: scale(0); opacity: .9; }
        100% { transform: scale(1); opacity: 0; }
      }

      footer {
        margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line-strong);
        text-align: center;
        font-size: 13px; color: var(--ink-3);
      }

      .toast {
        position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
        transform: translate(-50%, 16px);
        background: var(--ink); color: var(--bg);
        font-size: 14px; padding: 10px 18px; border-radius: 8px;
        opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
        z-index: 50; max-width: calc(100vw - 40px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- Theme pour：主题切换按钮 ---------- */
      .theme-toggle {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        right: 18px;
        z-index: 100;
        width: 50px; height: 50px; min-height: 50px;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--card-shadow);
        transition: transform .25s ease, box-shadow .25s ease;
      }
      .theme-toggle svg { width: 23px; height: 23px; display: block; }
      .theme-toggle:active { transform: translateY(1px) scale(.96); }
      @media (hover: hover) and (pointer: fine) {
        .theme-toggle:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
      }

      /* ---------- Theme pour：倾泻覆盖层（液面逐帧由 JS 用 clip-path 重建） ---------- */
      .pour-wrap {
        position: fixed; inset: 0;
        z-index: 90;
        pointer-events: none;
        visibility: hidden;
      }
      .pour-wrap.on { visibility: visible; }
      .pour-fill {
        position: absolute; inset: 0;
        will-change: clip-path;
      }
      /* 副本层主题变量：副本根节点带目标主题（data-theme），整套变量与 :root 的浅/深两套一致，
         副本里的文字、卡片、背景都按新主题呈现，不影响底层原页面 */
      .pour-fill[data-theme="light"] {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --ink: #1b1b1d;
        --ink-2: #4a4a4e;
        --ink-3: #83838a;
        --line: #d9d9dc;
        --line-strong: #c2c2c7;
        --accent: #bc3a22;
        --accent-ink: #ffffff;
        --accent-soft: #f9ece8;
        --seal: #bc3a22;
        --chip-bg: #ffffff;
        --card-shadow: 0 1px 3px rgba(20, 20, 25, .07), 0 6px 18px rgba(20, 20, 25, .05);
        --card-shadow-hover: 0 4px 10px rgba(20, 20, 25, .12), 0 26px 48px rgba(20, 20, 25, .22);
        --bg-a: #e7e9ec;
        --bg-b: #d8e3ef;
        --bg-c: #f0e6cb;
        --bg-d: #e1e5ea;
        --ripple: rgba(188, 58, 34, .22);
        --glare: rgba(255, 255, 255, .5);
        --focus-ring: #bc3a22;
        color-scheme: light;
      }
      .pour-fill[data-theme="dark"] {
        --bg: #171719;
        --surface: #232326;
        --ink: #f0efe9;
        --ink-2: #c6c3ba;
        --ink-3: #96928a;
        --line: #333336;
        --line-strong: #4a4a4f;
        --accent: #e0684c;
        --accent-ink: #1a0f0b;
        --accent-soft: #33201a;
        --seal: #c8452a;
        --chip-bg: #232326;
        --card-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
        --card-shadow-hover: 0 4px 10px rgba(0, 0, 0, .5), 0 26px 48px rgba(0, 0, 0, .65);
        --bg-a: #14161c;
        --bg-b: #1b2438;
        --bg-c: #242017;
        --bg-d: #171b24;
        --ripple: rgba(224, 104, 76, .3);
        --glare: rgba(255, 255, 255, .18);
        --focus-ring: #e0684c;
        color-scheme: dark;
      }
      /* 副本层底色：新主题的动态渐变（JS 会同步动画相位，收尾交接无跳变） */
      .pour-fill {
        background: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d));
        background-size: 400% 400%;
        animation: bg-flow 8s ease infinite;
        color: var(--ink);
        overflow: hidden;
      }
      /* 页面副本：由 JS 按原页面位置像素级定位，不可点击，静态呈现 */
      .pour-scene { position: absolute; margin: 0; pointer-events: none; }
      .pour-fill .pour-scene * { animation: none !important; transition: none !important; }
      .pour-fill .reveal { opacity: 1 !important; transform: none !important; }
      .pour-fill .avatar-wrap::after, .pour-fill .ref-card::after { display: none !important; }
      .pour-fill[data-theme="dark"] .copy-btn { background: var(--surface); border-color: var(--line-strong); }
      .pour-edge {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        overflow: visible;
      }
      .pour-edge path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pour-edge .edge-glow { stroke-width: 9; opacity: .28; }
      .pour-edge .edge-line { stroke-width: 3; }
      .pour-wrap[data-pour="dark"] .pour-edge path { stroke: #ff9d85; }
      .pour-wrap[data-pour="light"] .pour-edge path { stroke: #e0684c; }
      /* 从按钮落向底部的墨流：转场开头的一小段 */
      .pour-stream {
        position: absolute;
        width: 5px;
        border-radius: 3px;
        opacity: 0;
        transform-origin: top center;
      }
      .pour-wrap[data-pour="dark"] .pour-stream { background: #232326; }
      .pour-wrap[data-pour="light"] .pour-stream { background: #ffffff; }

      @media (max-width: 560px) {
        .ref-card { flex-wrap: wrap; padding-bottom: 12px; }
        .copy-btn { margin-left: 64px; }
        .avatar { width: 92px; height: 92px; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .toast { transition: none; }
        .soc:active { transform: none; }
        body { animation: none; }
        .avatar { animation: none; }
        .avatar-wrap::after { animation: none; opacity: 0; }
        .ripple { display: none; }
        .ref-card::after { display: none; }
        .reveal { opacity: 1; transform: none; transition: none; }
        .ref-card:hover { transform: none; }
        .theme-toggle { transition: none; }
        .theme-toggle:active { transform: none; }
      }
    </style>
    <script>
      /* 渲染前先套用上次手动选的主题，避免闪烁；没选过则不设，跟随系统 */
      (function () {
        try {
          var t = window.localStorage.getItem("xiaoyang-theme");
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* 存储不可用时静默跟随系统 */ }
      })();
    </script>
  </head>
  <body>
    <!-- ===== Theme pour：主题切换按钮 ===== -->
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色模式" aria-pressed="false"><!-- JS 渲染太阳/月亮图标 --></button>

    <!-- ===== Theme pour：倾泻覆盖层 ===== -->
    <div class="pour-wrap" id="pourWrap" data-pour="dark" aria-hidden="true">
      <div class="pour-stream" id="pourStream"></div>
      <div class="pour-fill" id="pourFill"></div>
      <svg class="pour-edge" id="pourEdge" aria-hidden="true" focusable="false">
        <path class="edge-glow" id="pourEdgeGlow" d="" />
        <path class="edge-line" id="pourEdgeLine" d="" />
      </svg>
    </div>

    <div class="wrap">

      <!-- ===== Profile head ===== -->

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
          } else { fallback(); }
        }

        /* ---------- Referral code copy ---------- */
        document.querySelectorAll("[data-ref-code]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            copyText(btn.getAttribute("data-ref-code"),
              btn.getAttribute("data-ref-name") + "已复制：" + btn.getAttribute("data-ref-code"));
          });
        });

        /* ---------- #074 滚动淡入：进入视口时依次淡入 ---------- */
        function initReveal() {
          var els = document.querySelectorAll(".reveal");
          function show(el) {
            el.classList.add("in");
            var d = parseFloat(window.getComputedStyle(el).getPropertyValue("--d")) || 0;
            /* 淡入（0.9s + 延迟）结束后切到悬停/倾斜用的短过渡 */
            setTimeout(function () { el.classList.add("done"); }, (d + 0.95) * 1000);
          }
          if (!("IntersectionObserver" in window)) {
            els.forEach(show);
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                show(entry.target);
                io.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12 });
          els.forEach(function (el) { io.observe(el); });
        }

        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ---------- #085 涟漪：点击卡片/社交图标时从点击处扩散波纹，0.6s 淡去 ---------- */
        function initRipple() {
          if (reduceMotion) return;
          document.addEventListener("pointerdown", function (e) {
            var host = e.target.closest ? e.target.closest(".ref-card, .soc") : null;
            if (!host) return;
            var r = host.getBoundingClientRect();
            var size = Math.max(r.width, r.height) * 2;
            var s = document.createElement("span");
            s.className = "ripple";
            s.style.width = s.style.height = size + "px";
            s.style.left = (e.clientX - r.left - size / 2) + "px";
            s.style.top = (e.clientY - r.top - size / 2) + "px";
            host.appendChild(s);
            setTimeout(function () { s.remove(); }, 650);
          });
        }

        /* ---------- #153 3D 倾斜：卡片随鼠标立体倾斜（最大约 10°），带反光移动；仅鼠标设备 ---------- */
        function initTilt() {
          if (reduceMotion) return;
          if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
          document.querySelectorAll(".ref-card").forEach(function (card) {
            card.addEventListener("mousemove", function (e) {
              var r = card.getBoundingClientRect();
              var px = (e.clientX - r.left) / r.width;
              var py = (e.clientY - r.top) / r.height;
              var rx = (0.5 - py) * 20;
              var ry = (px - 0.5) * 20;
              card.style.transform =
                "perspective(900px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) +
                "deg) translateY(-14px) scale(1.03)";
              card.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
              card.style.setProperty("--my", (py * 100).toFixed(1) + "%");
            });
            card.addEventListener("mouseleave", function () {
              card.style.transform = "";
            });
          });
        }

        /* ---------- Theme pour：太阳/月亮切换 + 液体倾泻转场 ---------- */
        var THEME_KEY = "xiaoyang-theme";
        var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>';
        var MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.6 14.2A8.8 8.8 0 0 1 9.8 3.4a.6.6 0 0 0-.8-.8 10.5 10.5 0 1 0 12.4 12.4.6.6 0 0 0-.8-.8Z"/></svg>';
        var sysDark = window.matchMedia("(prefers-color-scheme: dark)");

        function storedTheme() {
          try {
            var t = window.localStorage.getItem(THEME_KEY);
            return (t === "dark" || t === "light") ? t : null;
          } catch (e) { return null; }
        }
        function effectiveTheme() {
          var manual = document.documentElement.getAttribute("data-theme");
          if (manual === "dark" || manual === "light") return manual;
          return sysDark.matches ? "dark" : "light";
        }
        function saveTheme(t) {
          try { window.localStorage.setItem(THEME_KEY, t); } catch (e) { /* 存储不可用时仅本次生效 */ }
        }
        function applyTheme(t) {
          document.documentElement.setAttribute("data-theme", t);
          saveTheme(t);
          syncToggle();
        }
        function syncToggle() {
          var btn = $("themeToggle");
          if (!btn) return;
          var dark = effectiveTheme() === "dark";
          btn.innerHTML = dark ? SUN_ICON : MOON_ICON;
          btn.setAttribute("aria-pressed", dark ? "true" : "false");
          btn.setAttribute("aria-label", dark ? "切换到浅色模式" : "切换到深色模式");
          btn.title = dark ? "切换到浅色模式" : "切换到深色模式";
        }

        /* 倾泻：液面约 1.2s 从底部涨满全屏。液面以下不是纯色盖层，而是整页内容的副本——
           副本强制套用目标主题，液面升到哪，内容就以新主题的样子被逐行揭示；
           涨满后底层原页面正式切到目标主题并移除副本，无缝收尾 */
        var pouring = false;
        function pourTo(target) {
          if (pouring) return;
          var wrap = $("pourWrap"), fill = $("pourFill"),
              glow = $("pourEdgeGlow"), line = $("pourEdgeLine"),
              stream = $("pourStream"), btn = $("themeToggle");
          var pageWrap = document.querySelector(".wrap");
          if (!wrap || !fill || !glow || !line || !pageWrap) { applyTheme(target); return; }
          pouring = true;
          btn.disabled = true;
          wrap.setAttribute("data-pour", target);
          wrap.classList.add("on");
          wrap.style.transition = "none";
          wrap.style.opacity = "1";

          /* 构建页面副本：克隆 .wrap，按原页面当前视口位置像素级定位叠放；
             去掉所有 id 避免与原页面重复，剥掉卡片倾斜的内联变换，副本不可点击 */
          var scene = pageWrap.cloneNode(true);
          scene.classList.add("pour-scene");
          scene.removeAttribute("id");
          scene.querySelectorAll("[id]").forEach(function (n) { n.removeAttribute("id"); });
          scene.querySelectorAll(".ref-card").forEach(function (c) { c.style.transform = ""; });
          var wr = pageWrap.getBoundingClientRect();
          scene.style.left = wr.left + "px";
          scene.style.top = wr.top + "px";
          scene.style.width = wr.width + "px";
          scene.setAttribute("aria-hidden", "true");
          fill.setAttribute("data-theme", target);
          fill.innerHTML = "";
          fill.appendChild(scene);
          /* 副本背景渐变与页面 body 的 8s 流动动画同步相位，涨满交接时不跳色 */
          fill.style.animationDelay = (-((performance.now() % 8000) / 1000)).toFixed(3) + "s";

          /* 墨流：从按钮位置向底部拉出一道细流（约 260ms），随后液面开始上涨 */
          var STREAM_MS = 260, RISE_MS = 1200, FADE_MS = 380;
          var btnR = btn.getBoundingClientRect();
          var sx = btnR.left + btnR.width / 2 - 2.5;
          stream.style.left = sx + "px";
          stream.style.top = (btnR.bottom - 4) + "px";
          stream.style.height = Math.max(0, window.innerHeight - btnR.bottom + 4) + "px";
          stream.style.transition = "none";
          stream.style.opacity = "0";
          stream.style.transform = "scaleY(0)";

          var W = window.innerWidth, H = window.innerHeight;
          var AMP = 15, SEG = 18;
          var start = null, applied = false;

          function frame(now) {
            if (start === null) start = now;
            var el = now - start;

            /* 墨流阶段 */
            if (el < STREAM_MS) {
              var sp = el / STREAM_MS;
              stream.style.opacity = String(Math.min(1, sp * 2));
              stream.style.transform = "scaleY(" + sp.toFixed(3) + ")";
            } else if (stream.style.opacity !== "0") {
              stream.style.opacity = "0";
            }

            /* 液面上涨阶段（墨流结束后开始） */
            var rt = Math.max(0, (el - STREAM_MS) / RISE_MS);
            if (rt > 1) rt = 1;
            var eased = rt < .5 ? 2 * rt * rt : 1 - Math.pow(-2 * rt + 2, 2) / 2;
            var base = (1 - eased) * (H + AMP + 6) + eased * (-AMP - 6);
            var pts = [], i, x, y;
            for (i = 0; i <= SEG; i++) {
              x = (W * i) / SEG;
              y = base
                + Math.sin((x / W) * Math.PI * 3 + el * 0.009) * AMP
                + Math.sin((x / W) * Math.PI * 5.2 - el * 0.006) * AMP * 0.38;
              pts.push([x, y]);
            }
            var poly = pts.map(function (p) { return p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px"; }).join(",");
            fill.style.clipPath = "polygon(" + poly + "," + W + "px " + H + "px,0px " + H + "px)";
            var d = "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L");
            glow.setAttribute("d", d);
            line.setAttribute("d", d);

            if (rt < 1) { requestAnimationFrame(frame); return; }

            /* 涨满：副本已完整覆盖整页，此刻底层原页面切到新主题，与副本像素一致，切换不可见 */
            if (!applied) { applied = true; applyTheme(target); }
            wrap.style.transition = "opacity " + FADE_MS + "ms ease";
            wrap.style.opacity = "0";
            setTimeout(function () {
              wrap.classList.remove("on");
              wrap.style.transition = "none";
              wrap.style.opacity = "1";
              fill.style.clipPath = "";
              fill.innerHTML = "";
              fill.removeAttribute("data-theme");
              fill.style.animationDelay = "";
              glow.setAttribute("d", "");
              line.setAttribute("d", "");
              stream.style.opacity = "0";
              btn.disabled = false;
              pouring = false;
            }, FADE_MS + 40);
          }
          requestAnimationFrame(frame);
        }

        function initThemeToggle() {
          var btn = $("themeToggle");
          syncToggle();
          /* 没手动选过时，系统主题变化跟着同步按钮图标 */
          if (sysDark.addEventListener) {
            sysDark.addEventListener("change", function () { if (!storedTheme()) syncToggle(); });
          }
          btn.addEventListener("click", function () {
            var target = effectiveTheme() === "dark" ? "light" : "dark";
            /* 系统开启减少动态效果时跳过转场，直接切换 */
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              applyTheme(target);
              return;
            }
            pourTo(target);
          });
        }

        renderSocials();
        initReveal();
        initRipple();
        initTilt();
        initThemeToggle();
      })();
    </script>
  </body>
</html>
