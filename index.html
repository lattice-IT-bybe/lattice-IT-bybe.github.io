                  "当你能够连续超过三次的压中后，那么你对于此类事件的判断就有了初步的能力。在此之后，你遇到这类情况，就可以选择梭哈这个账户了，不断地去滚仓。\n\n" +
                  "执行这个策略，持续下去。你的本金会从300U一直增长下去，直到20万U。\n\n" +
                  "20万U~100万U的策略\n\n" +
                  "A7之后，你的心理会迎来巨大地成就感，提出5万U，去散散心，满足自己的物欲，你的心态会极大地跃升，相信我。你也不会为生活上的各种琐事烦恼了。这些方面会极大地加强你的心理账户。\n\n" +
                  "A7的阶段，此时的情况就是你的心理账户很强大，你的经验较丰富。这时候就需要多去沉下心来思考了。\n\n" +
                  "一条路径为减少自己的出手次数，多去参与成型MEME的交易，每天多去思考和寻找机会。但请切记，有这些钱后，不要梭哈，不要梭哈，不要梭哈！！拿出20%去交易。15万U如此循环，是肯定可以跨越100万U的。\n\n" +
                  "另一条路径则为PVP，投入到打新盘当中。你的本金足够你的试错，同时你的心理账户储备十分充足。是能够通过足够多的出手次数去Cover掉所有的亏损，或者大赚特赚。\n\n" +
                  "## 最后的一些闲话\n\n" +
                  "MEME似乎已经划分为两个时代了，一个是前Trump时代，一个是后Trump时代，也就是现在。\n\n" +

                  "长篇大论的心理按摩我不太会。对于我来说，一直激励我的一句话是：行情，总在绝望中诞生。\n\n" +
                  "说两句我的经历吧，在23年底，另一个市场中的时候，当时市场的流动性是彻底的枯竭了，同时那也是我的低谷，充斥着对未来的迷茫，对自己的不甘心。\n\n" +
                  "我非常地愤怒，非常地不甘，非常地恨我自己。为什么赚钱的不是我？为什么我总是亏钱？为什么我得不到我想要的生活？为什么那些机会我一个也没抓住？\n\n" +
                  "但我觉得我不一样的点也就是在于，当时哪怕我再绝望，也依然坚持呆在市场中，我在尝试验证：行情，总在绝望中诞生。这句话到底对不对。\n\n" +
                  "后来某一天，我踩中了，我搭上了在绝望的市场中总会冒出的救世战车，乘风而起，我活了下来。我不觉得当时的我踩中这个有什么技术，只是我多了一份坚持而已。\n\n" +
                  "莫道人间无化境，九渊深处见天机。"

              {
                id: "shanks-qinlong-5",
                title: "MEME市场擒龙术五：打新盘的真正秘法，P小将们秘而不宣的逻辑",
                date: "2025-03-26",
                type: "长推",
                summary: "Shanks《擒龙术》系列第五篇：打新盘的真正秘法，P 小将们秘而不宣的逻辑。他开篇说：玩累了，又回来屁颠屁颠写点真材实料——币安有心全力扶持 BSC 的 MEME，在当下这个即将上 BSC 上 MEME 现货的关口，新一波的风浪肯定要掀起，很值得期待；本文彻底点透了很多认知和方法，其实不合适，因为似乎会真的伤害那 20% 赚钱的人的利益，但后面想了想也无所谓：因为真心想努力和学习提高自身能力的人怎么都能学会、无非花的时间多一些，而很懒散的人把饭喂到嘴边也不会吃，能赚钱的人还是那些、总是亏钱的人也还是那些，就好比很多人连看到这里的耐心都没有——你能看到这里，本文不论多少对你还是有一些帮助的。他写擒龙术系列，还是当作在帮助曾经那个为了搞明白一个很简单的点、却需要花费几天几夜不眠不休自己一个人研究的曾经的我；注：本文文字占比较多，一、二是认知和逻辑上的叙述，三是具体图文方法。目录：一、MEME 新盘逻辑透析；二、扫链认知避坑——学会真正的扫链方法；三、简单精准地抓取真正聪明钱的方法。一、MEME 新盘逻辑透析：在后续的认知纠正前，先把底层逻辑链摆出来——一个 MEME 被人们经手的链条是：DEV 创建（有庄的话，狗庄紧跟拿筹码）→扫链隐身高手们抢进→链上聪明钱买进→KOL 明牌地址买进→早期散户买进→更广大的散户买进→上所被交易所的用户买进。整个链条也就这样了：如果你对大市场的认知和判断能力不强、玩二段和抄底的能力一般，小资金小散，最好的方法就是去当链条的最早一环，也就是去成为扫链高手、争当最早最前的一环。玩新盘冲锋时（其实都不限于新盘），大部分人跟的和监控的仅有链上认证了的知名地址们，不论是什么聪明钱观测网站、还是推特上分享出来的一大列聪明钱地址集合，其实都是太出名太广为人知的地址们；跟这些地址们，那就是普罗大众、是处于大部分普通人的那一部分中，那就很难或者基本上没什么赚钱的可能，因为根本不符合少部分人赚钱、大部分人亏钱的定律，一味地这么跟只能吃尾气和亏亏亏亏。这一点是认知上的坑：MEME 是击鼓传花的游戏，跟这些广为人知的地址、在他们买进之后再看情况买了，就有一个逻辑上的硬伤——谁来买你的货呢？谁买？你现在属于大多数人那一类了，之后还有人会来接你的盘吗？就会突然发现咱们自己成为了链条的最后一环，这时候的最后预期也就只剩下一个：这个币赶紧上币安，那就是几乎不可能了。所以 MEME 新盘赚钱的核心逻辑就只有一个：要抢在绝大多数人之前发现并买入，把货倒给后来的人们，让后面有很多跟单的知名地址们来抬你的轿子、而不是你抬他们的轿子；跟公开的单是个伪命题，不论是链上跟单还是交易所内跟单（这句话在这里就不展开讨论了）。在买每一个新盘之前，不必复杂，简洁地问自己一个问题即可：谁来接我的盘？/我打算要把货倒给具体地谁（哪些群体）？二、扫链认知避坑——学会真正的扫链方法：盲目扫链的人的问题是不是这样的：盯左侧新创建吧，是挺低、挺早期的，那问题是几秒出现一个新盘、难度真的高；盯中间即将打满吧，一顿分析、然后就进去，发射后大部分就浇给了；盯右侧已发射吧，买进去了，大部分情况就是又接盘了。聪明进阶一些的，另开了推特网页阅览信息、订阅方程式获知第一时间新闻，还有个页面是大众聪明钱监控网站、加了几个微信群看群友在发什么币去跟着买，很忙、冲这个冲那个，行情好时能赚点、行情差时老亏钱——这样的方法不能说错，只能说算是没抓住重点、不够完整。打新盘 MEME，拥有自己的极早期信息流是第一重要的东西，一定一定要拥有自己的独门信息流、而不是和茫茫散户一样的信息流；引申出另一个大道理：在币圈，赚钱这件事任何人都无法帮助你、没有人能够带你赚钱，只能依靠自己，而且只有自己支棱起来的人才能赚到钱。在打新盘时，三列看板只应该占你总体信息流的 30%，是小部分需要注意的、而不是核心；核心只有一个：没有慧根，就要会跟。这句话谁都在说、天天说，道理没错，问题在于到底咋跟、跟谁，没有任何人讲清楚过；跟链上出名的聪明钱地址们，不论是中后段地址还是早期 Alpha 地址，就像前文说的那样，结果都是亏得找不着北。要知道的是：广为人知并不等同于厉害和够早，名声大很多时候是因为地址认证了推特、有某一次的成名战役、在各种地方容易看到；实际上链上这么大，很强很猛的地址很多很多很多，其中的大部分不会去认证推特和宣传自己的地址，只想自己默默执行自己的策略和逻辑、默默赚钱然后改善生活，这是占绝大多数的，而这些隐世高手的地址散户们根本无从知晓、也不知道上哪找。他来告诉大家到底怎么找出链上隐身高手们并且成为他们：没有慧根就要会跟，跟的是谁、怎么跟，接下来就教怎么去找了。三、简单精准地抓取真正聪明钱的方法：本篇教的是最简洁方便的方法，较全便捷的方法需要用到 Dune 上的工具（如有需要后面会紧接出一篇，不过就需要一点编程知识了）。前文说过，链上有这些广为人知的聪明钱地址，知道并看到这些地址是很轻松的；他们呢，链上火热时看地址确实胜率可以、盈利也还行，但你要是跟他单会发现慢了一些：跟着他买入时价格已经上去了处于高位，跟着他卖的时候价格已经被他砸下去了，这一来一回就会导致自己亏钱。但有没有想过他们为什么能在极早期就发现这些币、你发现不了？如果不点明可能一直想不通——说白了就是一句话：他们发现这些，小部分自己盯盘，其实大部分也是在跟其他更早更快的地址进的而已。问题来了：既然他们是跟着其他更早期的地址进的，我要是能知道他们监控的聪明钱地址，那我的信息流是不是就更早期、甚至做到跟这些聪明钱大佬们同步了？当然了，这些信息他肯定不会告诉任何人，这就需要我们自己去找。怎么找呢，想通上面这一点后就其实很简单了：链上以往已存的信息全部透明，都摆在那。找的方法其实异常简单，虽然不全，但是很简洁高效。总结举例就是：比如想研究的是地址 A，这个地址 A 在 M1、M2、M3、M4 这些币上赚了不少钱，将 M1、M2、M3、M4 这些币中、在地址 A 买入之前的所有地址都抓出来——比如在 M1 中抓取到排在地址 A 之前买入的有地址 B、C、D、E；在 M2 中有地址 C、E、F；在 M3 中有地址 E、H；在 M4 中有地址 E、P。这样一看，筛选下重复项，在地址 A 的每一次买入前都有地址 E 存在，那这个地址 E 极大概率就是这位知名大哥 A 自己独门监控的聪明钱了。相信他：你自己去抓，很多知名地址之前都能抓出来一些重复率甚至达到 95% 的地址。以下用具体实例一步步教给大家简单的方法：1. 选定一个有名且赚不少的大哥地址，大家可以自行选择想学习的地址，在这里给他取名为地址 A；2. 筛选出他地址总利润从高到低的排序，在这里最好是先找翻的倍数高的币种们（倍数高意味着他买得很早很快，低位早期的买入是我们要达成的目标）；3. 在这里发现了在 3 月 22 日这天，ZAC 这个币他竟然吃了足足 17 倍之多；4. 接下来就去 BSC 的区块链浏览器 BSCSCAN（网址 https://bscscan.com）进入去下载数据；如果是 SOL 的话更方便点，因为能自由筛选准确时间，就找一下地址 A 买入的准确时间、下载在此时间之前的记录即可，不过每次只能下载 1000 条，如果地址 A 之前买卖的记录超过了 1000 条，就需要隔取时间多次下载了（记得看清楚时间是 UTC 时间还是 UTC+8 时间，时间的切换在整个页面右上角的齿轮那里）；5. 回到 BSCSCAN 这里，在下载页面输入 ZAC 的 CA 和选取时间，也就是他这个地址 A 交易的当天时间：3 月 22 日；6. 下载好后会得到一个表格文件，里面包含了 3 月 22 日 ZAC 这个代币的前 5000 条交易记录（他这里用的是 WPS），From 那一列就是交易记录中的地址们了，在这里点击查找；7. 在查询框中输入正在研究的地址 A、点击查找，然后就能看到这个地址 A 处于哪个位置了，然后他之前的这些交易过的地址也就都列出来了，复制排在他之前的所有地址到一个新表格中；8. 重复上述动作，完成对几个高倍高盈利币的提取工作，记得在新表格中做好备注，然后切记放到同一列中，如下图所示；9. 选中当列，点击筛选；10. 按照图中步骤，在这里能看到重复项，居然发现了一件事：有两个地址出现了四次（因为此时只用了四个代币的数据），也就是说这俩地址都是在这个聪明钱地址 A 的每一次买入之前就买入了，那么也就可以确定这俩地址极大概率是这个地址 A 监控的极早期扫链钱包，是这个聪明钱的跟单对象和他的独门信息流，或者呢，是这个知名聪明钱的两个小号（这个后面会再接着说）。至此我们就拥有了知名地址 A 监控的隐世聪明钱地址们了，再这样去做得到知名地址 B 的、知名地址 C 的等等的，这样就能完成你自己的独门极早期聪明钱库了，这些信息就几乎是处于最早的那一环节中了。哦对了，说回多地址的事，他需要严肃地说明一个正确的观念：在链上，不管怎么做、怎么买怎么卖、怎么喊单怎么出货，都是合情合理的，这些事怎么做都是对的，除了诈骗，其他的行为压根就没什么涉及到道德的事，也请不要道德绑架任何人；不是说有这种心态就如何不好，他曾经也是这样的，而是：有这种心态、经常道德绑架他人，会导致一个很坏的结果——容易赚不到钱。一个人用多个地址的原因有二：1. 如果只用一个地址，明牌知名地址买太多了，会被狗庄和整个市场上的所有人盯上，会导致很难盈利，他的动作牵扯着这个币的走势；2. 不方便出货，很多时候这些明牌地址一旦开始出货，整个币价就会迎来大跳水，异常影响后续的分批止盈。然后，如果你确信抓到了某个一旦买入就会带来一根超大阳线的聪明钱（比如 ansem）的小地址的话，威力是很大的，该怎么去撸应该很清楚了，不过还是有点难度的，慎用，很多大哥会定期换小地址。最后，扫链的核心真理本文是讲了，然后全部的具体的应该怎么扫，他思来想去写文字是讲不清楚的：紧接着他会出一个视频，是真正有用的新手教程，前面会讲清楚基础的知识和整个逻辑，后面会展现怎么打狗赚钱、他的信息流是哪些，用一个成功打到金狗的全流程视频来展示。最后，他的频道重新组建了（频道：https://t.me/+czSgwwKhVKcyNzZl），另外关于 TG 大群的事情，就这两天会重新开一个，是他们 CrismonStrom 社区形式的群了，届时会直接发链接，在他旧群的劳烦重新加一下新群，旧群三天后会解散；社区大群无任何门槛，他们几个人也都会在群里呆着，但是禁止跑进来创业。最后的最后了：如果觉得本文对你有帮助，点赞转发收藏评论，是对他最大的支持，十分感谢各位。",

                summary: "（本篇日期为小琪暂估，待确认）Shanks《擒龙术》系列第四篇正篇：庄家坐庄全流程举例详解。他先说：读完后你应该就能彻底了解庄家的全部操作、透彻一个币的全程走势如何；本篇篇幅较长，粗略阅读时间约 15 分钟，且极为细致，时间点和点位全流程都写了，本文仅为他个人观点。这一篇耗费他的时间最久，因为涉及到扒一个庄的所有地址和数据的整理工作，所以让大家久等了。最近圣诞节前后行情确实不行，但在他看来一级的牛市没有结束，下一大牛是在 1–3 月，现在的行情低迷正好可以抽时间认真学习、为即将到来的牛市做好准备，一级依然是小资金博取大收益的最佳地方。讲解之前，他先分享扒庄地址的经验：先明晰一个点——庄家拉盘的目的是为了不让低价筹码落入他人手中、然后以更高的价格卖出从而获得更高收益；既然是这个目的，拉升一定是极速的，如何才能极速拉盘？只有大笔的买单才能做到极速拉升，所以在拉盘时一定会有一个或多个具有统一性的地址在比较大额地买入，假如你看到有两个地址都是至少一千多刀地买、不停地买，这就叫做拉盘；所以在找庄地址时，可以筛选大于 1K 刀的买单记录、逐一去看，且该地址的主要交易代币就是这个，即可知道哪个地址是庄的拉盘地址。同样的，庄怎么样才能收集最初的底筹？一定是在最开始、最低点进行迅速的狙击，抽走大部分筹码，所以去看最早的交易记录、逐个看完，基本就能看到庄家收集底筹的所有动作。先看这个币附带庄家全部地址的走势，逐步流程紧随其后讲解；全流程如下，本次解析所讲到的 LILX 仅作讲解用例、不构成投资建议。LILX 这个代币是非常典型的 pump 币了，他的历程基本上与 90% 的币雷同：不管是热点币、AI 币、常规 MEME 币，全部都是这样的模式，不论是低市值还是高市值的币无一例外；有多次大幅涨跌的 MEME，是因为故事够新、庄的格局够大，如果想抓住这种可以去看擒龙术二的找到庄家吸筹的方法；在这里是明晰透彻 SOL 上绝大部分 MEME 的流程如何，以及如何通过流动性去判断未来庄家的主要动向。以 LILX 为例（时间均为 UTC+8）：一、时间：12/06-06:34，马斯克在其推特发文并配图，他的小儿子（LIL X）骑在他的肩膀上，这是近期他首次在推特上晒自己的儿子，话题性较强、有炒作空间。二、12/7-03:12，流动性：暂无，筹码：76%，净利润：-2W——LILX 的庄开始部署 LILX 代币，DEV 号拿走了 341.4M 的筹码（筹码总量为 1000M）、约 34%，并在其后的三分钟内通过 13 个地址、每个地址狙击拿走了 32.4M、总计 421.2M（约 42%）的筹码，至此在内盘便轻松完成了筹码的收集工作、约占总量的 76%。三、12/7-03:18，流动性：约为 38K，筹码：76%，净利润：-2W——由于内盘筹码被购买完毕、得以顺利发射，在 Raydium 流动性池添加过程中庄家开始筹码的分散派发：由 14 个地址通过三层发送给了 71 个地址和 3 位 KOL 的地址，为了方便计数、在这里计算为每个地址约占总量的 1%，底筹流向如图所示（全地址及全图会放在电报）。四、时间：12/07-03:18 至 03:19，流动性：62K，筹码：82%（+6%），净利润：-3.2W——发射后，拉盘地址狙击开盘、花费 1.2W 刀主导，带起跟风买单，顺势将市值抬升至 500K 附近，在这位置开始了十分平稳的横盘，此时总流动性为 62K；意识到什么了吗？此时池子里的 SOL 价值 31K（为总流动性的一半）差不多够覆盖此前的总成本：筹码狙击+拉盘=3.2W 刀；此时在 500K 的价位，庄家付出的成本与池子中 SOL 的价值持平，所以庄家会选择在这个位置横盘、并开始下一步的计划。这里不用担心会被庄家砸，也是最好的上车点位：因为庄家在发射后有一笔猛抬的成本，此时即便一键全出，算上磨损和池子浅所带来的滑点问题，对于庄家来说是亏本的；如果理解清楚这一点，在这个位置就是散户的最佳上车点位和时间，因为你和庄家的成本是同频的，且在知道这一点的情况下，在后续庄家不断拉砸磨人的过程中你就能拿住了——相当于是你通过流动性数据和捕捉到的庄家成本，计算出了在 500K、在这个时间点是狗庄的成本位；什么叫做与庄家共舞？这就叫做与庄家共舞。五、时间：12/7-03:18 至 04:02，流动性：67K，筹码：76%（-6%），净利润：-1.8W——时间为 03:18 时（图中为蓝线截取的时间），配备好的喊单频道 1 开始喊单，这就巧了哈，在喊单前没有卖出、在 03:19 喊单后开始卖了；在这个位置通过喊单带来一些流动性，可以借此在不太影响价格的情况下平稳出掉少量筹码，从而增加后续操纵市场的资金；这里出了 1.4W——这是性价比最高的方式，但同样的，什么样的人会极致追求性价比？没钱的人会这样，所以能反映出庄家是强庄还是一般的游资水平：在这里你通过观察就能明白，这个币在这个庄的手里上限不会很高。六、时间：12/07-04:02 至 04:07，流动性：97K，筹码：80%（+4%），净利润：-2.62W——在出货收回部分资金后买单枯竭，于是在 04:02 至 04:07 开始了大笔猛抬并收回筹码，进一步推高市值至 800K 的同时，将最初的底筹通过卖出紧接新地址买入的行为进行筹码的换手、为了掩人耳目；在这段时间，庄家净买入了约 8200 美元、收回了 4% 的筹码，如图为蓝线截取时间段。七、时间：12/7-04:08 至 06:02，流动性：132K，筹码：71%（-9%），净利润：+3.4W——这时筹码重新收集完毕、流动性再次枯竭，似乎是前一个喊单的效果不好，要谋求更大更新的流量入口；在此，04:08 分喊单频道 2 准时开始喊单，庄家第一时间猛抬点火，并开始多笔小笔出货回笼资金；在又一次枯竭后，此时喊单频道能量不够了，于是搬出了杀手锏：在 4:44 分，某个 20W 粉的国外阴谋 caller（是谁他就不贴了，惠姐曾经罗列过）开始喊单，配合着他的喊单，第一时间猛抬两笔迅速吸引注意力、再次点火；一样的手法：在喊单+点火带来流动性后，多笔小笔慢出货，进一步增加后续操纵市场的资金；如图是细致的全过程、异常重要，手法、点位、时间都在图中标注，从左到右、从下往上看，务必仔细看清；后续这种循环多次重复，不再细讲。八、时间：12/07-06:02 至 15:56，流动性：219K，筹码：59%（-12%），净利润：+8.6W——在上一段结束后，来到了 06:02–15:56 时间段，依然在重复刚讲到的操作。九、时间：12/07-15:56 至 19:42，流动性：254K，筹码：67%（+8%），净利润：+12.4W——在时间来到 15:56，在这个时间点突发事件：马斯克再次发图、又发了他的小儿子 LILX；狗庄反应还算不错，半小时内得知消息、想好了这个居然有再一次的炒作空间，于是决定好了方向，在 16:31 分开始大笔猛砸，将市值从 3.2M 砸至 1.7M、短时近乎腰斩；这时候由于两次发图，市场的注意力比正常情况下多了不少，这是极大助力、操盘更加容易；在后续的每次抬头时都砸出、再低位买回，不仅可以将筹码换手收回、掩人耳目，在此期间也可赚取差价的利润；全流程及标注如图所示。十、时间：12/07-20:00 至 12/08-06:56，流动性：298K，筹码：4%（-63%），净利润：+92W——来到了最后的高潮阶段，在上一步骤的砸至水下吸筹完毕后，开始了最后一舞：同样的套路，新的某国外大 V 喊单，几个 caller 开始诉说着 LILX 是马斯克小儿子、是最宠爱的，已经发了两次图、以后会发更多、故事会一直延续下去云云猛猛 CX；此时市场开始 FOMO，配合更加猛烈的大笔少笔拉盘+多笔小笔出货，在图中的 20:00 至 06:56 时间段内完成最后的操作，价格跳水，彻底出清几乎所有筹码、获利了结，如图标注所示。全文账目：庄家筹码占比从开盘约 76% 一路做到最后只剩 4%，净利润从 -2W 做到 +92W。",

                summary: "麦总长篇 Meme 教学连载第一篇：冲任何 Meme 之前，最最最最最先要问自己的问题是——这个盘子是什么盘，是 PVP 盘还是庄盘？不了解就瞎冲，不可能长期获胜。两种盘的交易风格完全不同：PVP 盘上限通常很低，拼的是挖掘信息的速度，止盈点是短期情绪高点，看到信息晚了就别追、看到最早上车的那批钱包开始卸货就该跑；庄盘上限更高，能上币安、OK、Bybit 的 Meme 无一例外都是强庄盘，拼的是找到『靠谱庄』的能力——分析叙事、分析运营用心程度、监控钱包揣摩做市商意图，在庄不断拉砸洗盘中牢牢抓住，这种盘不要怕高。用叙事判断盘性是大错特错：Moodeng、Pnut、RIF 这些看起来像自然『热点』的，其实伪装下都是强庄盘，拿 PVP 玩法玩只会被甩下车或卖飞。他在文中嵌了一段 2024-10-14 聊 $PAC 的旧帖说明热点盘的天花板：改签名或一条推火起来的币，第一批冲进去的几乎都是科学家与聪明交易者，底部筹码被对社区和概念没信仰、有利润就跑的 trader 拿走，接盘的全是只看概念的小白——概念再好也没用，没人会去 build，庄真看上这个概念也会另起盘子，不会建设一个底部筹码全是交易者的社区；所以做 CTO 前先分清盘子、看清底部筹码在谁手里，纯阴谋庄盘与热点盘的 build 几乎没意义，只有社区主导、底部筹码在社区身边人手里、大户格局长期的盘 CTO 才有意义。判断盘性最简单的方法：打开 GMGN 看这个盘子 TOP10–20 的前排地址——是 alpha 交易者和 P 小将的地址，还是庄钱包的地址？强庄盘的前 10–20 在前期不可能让链上 hunter 混进去。做市商会把前排钱包伪装成交易者，但若某地址在本盘的交易风格明显不同于其他盘（别处只买一两笔 1000U、这个盘突然梭了 10 万 U 还一直在做波段，那个小买单就是烟雾弹），基本就是庄钱包；前排小鱼标、狙击标特别多，也基本是庄地址。再延申一层：庄盘的前 10–20 开始出现交易者地址，说明庄已卸货不少、接盘者进了前排——大市值或已上大所的盘流动性够还好，链上流动性不足时庄控筹不紧不是不敢拉、是真拉不动，小心庄直接弃盘。他纠正一句常见误解『前排钱包盈利太多，怕砸盘』：PVP 盘可以怕（极短期零和博弈，P 小将盈利多了随时盖在你头上画圣诞树），但庄盘的前排盈利都是庄用自己的钱拉的、是空气，砸盘砸的是自己的脚；玩庄盘最差的情况反而是前排盈利不多甚至亏损——说明庄控筹不紧、已把货倒给接盘侠跑了（如以太上的 $doggo，庄完成大部分收割弃盘还剩筹码，想换庄 CTO 都起不来，Murad+Crash 打 call 也没用）。刚被国人 KOL Rug 的 $Spell 与以太政治币 $PAC 叙事再好也起不来，本质都是 PVP 盘。结尾：他一直向工具商提钱包分析功能需求，就是希望大家先搞明白自己玩的是什么游戏、规则是什么，再谈获胜——瞎冲的赌博早晚输光。",
                url: "",
                body:
                  "首先，两种盘子的交易策略有什么不一样？\n\n" +
                  "2024.10.14今天想聊聊pac这种改签名突发热点的meme币，先说结论，这类改签名或者一条推火起来的meme币是有很明显的天花板的，不建议你去长期build建社区，只能去冲冲第一波交易的机会，之前在space上也跟大家浅聊过这个逻辑，写个帖把逻辑梳理一遍：在troll之后的所有聪明trader和科学家都在盯着musk和trump他们的签名，有热点一发出来你不需要质疑，那个刮刀的速度是秒级的，你可以去观察一下很多musk他们的推文发出来之后，不管是大热点还是小热点，是签名还是一条推，第一批冲进去的几乎都是那一帮科学家，然后后面也有巨多跟单的，再过一两分钟所有聪明钱也都冲进去了。所以你会发现一个很有趣的事，就是前排的底部筹码都是被smart trader（聪明的交易者）给拿走了，而不是被builder（建设者）给拿着，聪明的交易者之所以叫聪明的交易者是因为人家对社区和概念没信仰，有足够好的利润就跑了（没任何贬义的意思），而接盘的全部是觉得“卧槽，这个概念牛逼“的小白，光看概念没用啊，人家前排太多trader了，你指望着他们中的谁去建社区build呢？所以光是概念好没任何意义，若是真有庄盯上了这个概念，人家也会另起盘子，为什么要去建设一个底部筹码全都是交易者的社区呢？等过几天热度过去了，musk换了签名，又留小白们在那风中飘零，感叹上天不公，为什么这么好的概念跑不出来.....（求pac的持有者别骂我....我也希望你们能赚钱）\n\n" +
                  "所以大家如果喜欢去当builder做cto，你一定要分清自己在build的盘子是什么盘子？底部筹码是谁在拿着的？如果是纯阴谋庄盘和这种热点盘，你的build行为几乎没什么意义，但如果真是社区主导的小盘子，底部筹码也真的都在社区身边人的手里，前排的大户们都对这个事也比较格局和长期心态，不会看涨到100k了就跑了，那这种CTO才有意义，你说对吗？\n\n" +
                  "PVP盘子上限通常很低，大家拼的是挖掘信息的速度，止盈点则是短期情绪的高点。更直观来说是，如果你看到信息晚了就别追了，如果你看到最早上车的那批钱包开始卸货了，你也就该跑了。\n\n" +
                  "庄盘的上限更高，你看到能上币安、OK、Bybit的这些Meme无一例外都是强庄盘，你交易这种盘子拼的是找到“靠谱庄”的能力、通过分析叙事、分析运营用心程度、监控钱包揣摩做市商意图、然后在庄不断的拉砸洗盘中，牢牢抓住，这种盘子你也不要怕高，因为上限跟PVP盘子不一样。\n\n" +
                  "很多人觉得可以看叙事去判断是不是庄盘，但这个大错特错！！！ 比如像Moodeng、Pnut、RIF这些叙事看起来像是很自然的“热点”，但其实伪装下都是强庄盘，你去拿PVP盘的玩法玩这种盘只会被甩下车或者卖飞。\n\n" +
                  "所以该怎么去判断这个盘子是不是庄盘呢？\n\n" +
                  "教大家一个最简单判断的方式，打开http://GMGN.AI，直接去看这个盘子的TOP10-20的地址，前排地址是alpha交易者和P小将的地址吗？还是庄钱包的地址？强庄盘的前10-20在前期是不可能让链上hunter混进去的。不明白这个道理的可以看我这篇：\n\n" +
                  "https://x.com/Michael_Liu93/status/1856230269667422455\n\n" +
                  "![GMGN 前排地址表](assets/878dfc2e0ac9.png)\n\n" +
                  "虽然很多做市商会将前排钱包混进去一些其他交易伪装成交易者钱包，但如果这个地址在这个盘子上的交易风格明显跟它在其他盘子上的不同，那基本就是庄钱包无疑（比如别的币只买了一两笔1000u的，这个盘子突然梭了10wu，然后一直在做波段，那你可以理解那个1000u的买单就是伪装成交易者钱包的烟雾弹），前排地址如果有特别多标红的小鱼标或者狙击标，那基本也是庄地址。\n\n" +
                  "你懂了这层逻辑，再去看前几天被国人KOL Rug的艺术家代币$Spell和之前在Eth上的政治币$PAC的前排地址，你就知道为什么这种叙事这么不错的盘子起不来了，因为本质上都是PVP盘，我之前特别写过一篇文章分析为什么$PAC很难起飞，大家可以看一下：https://x.com/Michael_Liu93/status/1845710848024813638\n\n" +
                  "再延申一层说，如果你看到一个庄盘的前10-20持币已经开始出现一些交易者的地址了，那你就一定得小心了，说明庄已经卸货不少，接盘的人开始进TOP10-20了，这种盘子如果是大市值或者已经上了大所还好，因为流动性够多，庄控筹也不再需要那么紧，但在链上流动性不够的情况下，庄控筹不紧不是不敢拉，是真的拉不动，这种盘子小心庄直接弃盘了。\n\n" +
                  "我经常听见的一句话是：某某盘子好想上，但前排钱包盈利太多，怕砸盘。能说出这个话的就是没玩明白这个游戏的。\n\n" +
                  "玩PVP盘可以怕前排盈利多，因为PVP盘是极短期的零和博弈，p小将盈利多了随时可以盖在你头上，然后画个圣诞树出来，但庄盘的前排盈利都是庄用自己的钱拉的，前排盈利对他来说是空气，他砸盘实际砸的是他自己的脚，反而玩庄盘最差的情况其实是看到前排盈利不多或者已经亏损，说明庄控筹不紧，已经把货倒给这批接盘侠之后跑了，前排都是接盘套牢的，后面谁来拉？你拉还是我拉？\n\n" +
                  "举个例子，看看以太上的$doggo的前排钱包，这就是典型的庄已经完成大部分收割并弃盘了，这种盘子几乎不可能再起来（尤其是如果狗庄出货也不出完还剩点筹码在里面，想换庄重新CTO都CTO不起来），Murad+Crash一起来打call也没用，所以下次别只看叙事觉得不错、看tg觉得社区好牛逼、你得先搞明白你玩的是什么盘子再去考虑其他的问题。\n\n" +
                  "这就是为什么我一直在跟各个工具商提钱包分析的功能需求，就是希望大家能先知道你在玩的到底是什么游戏，游戏规则是什么，你才能尝试在这个游戏里获胜，瞎冲的赌博早晚输光，你说对吗？"
              },

                type: "长推",
                summary: "麦总的《熊市生存手册》：八条都是他自己吃过亏、交过学费、至今记忆犹新的教训，做到至少能避开大坑、保证活下来。① 不碰任何没流动性的资产，就算它现在看起来再蓝筹——比如 Hyperliquid 的 NFT；上轮熊市开头觉得猴子便宜了可以抄的人，坟头草都三米了，他自己钱包里到现在还躺着一堆没用的 NFT；熊市没有流动性时，这些资产有人卖一点价格就砸下去，甚至到后面根本卖不出去，而一年内会发生什么没人知道（不是不看好 Hyperliquid）。② 山寨币一点都不要买，就算再蓝筹也别幻想『够低了、就当长期持有』——山寨季就算有也是牛市最后一年，前面一律跑不赢 BTC；今年被山寨套住、假设它能活过熊市（本身就是巨大假设），回本要再等四年，点名包含 PUMP、UNI、AAVE、XPL、ENA，甚至 HYPE、ETH、SOL（这轮除牛市最后一年外买 ETH 的上涨空间都没 BTC 高）；且熊市脚斩的不只是币价流动性，还有所有 crypto 公司的业务收入，很多现在看起来很 solid 的业务只在流动性充足时成立（如上轮的 NFT 交易所），到熊市就是没人用的垃圾。③ 千万不要把钱放在小所里——资产超过 10 万 U 自己配冷钱包存着；没有冷钱包就一半放链上、一半放 CEX，且只选币安和 OKX。④ 熊市思路要完全转变：每天想的是你能空点什么，而不是什么跌到位了、今天该买点什么——熊市大部分币是没有底的。⑤ 尽量不参与打钱局和新协议的理财局，除非你对项目有很强的信息和信心。⑥ 熊市没波动、大家收入变少，绝大部分人最终会通过合约杠杆去造波动，所以熊市最常见的死法就是合约；他不反对玩合约（熊市做空能赚钱），但不要开高于一两倍的杠杆——熊市是典型的震荡行情，未来一年会看到特别多画门和插针，杠杆稍高画几次门就死了。⑦ 熊市比的是耐心，长期仓位不要着急建，别套住了就洗脑自己『我持有的是 BTC、ETH，长期一定能赚』——节奏对交易非常重要，深套会让心态和节奏全乱（上轮 3–4 万买 BTC，意味着牛市前第一年半都在等回本，回本第一时间想的往往是终于能卖了）。⑧ 未来一年你只有一个任务：活下来，留在牌桌上。",

                date: "2025-10-19",
                type: "长推",
                summary: "麦总的一篇人生随笔：2023 年的这个时候，他感情、事业、家人健康都不顺——谈了三年快要结婚的伴侣分了手，丢了工作，资产快脚斩，父亲和爷爷都生了病。最难熬的时候经常一宿一宿睡不着觉，眼睛闭上就头疼欲裂，感觉自己有些轻度抑郁，又不想烦扰家人朋友，就逼着自己一个人出去散心，去了很多地方。最后还是得靠自己一个人熬过来；回过头看，反倒自己真正的成长，全部发生在最低谷最难熬的状态下。那会儿他钟爱看苏东坡的诗和故事：21 岁殿试及第，文采被欧阳修和皇帝赏识、风光无限，却在人生之后的四十余年受政治牵连、三起三落，大部分时候不是被贬就是在去贬所的路上，而他大部分留给后世的成就和诗词，反而发生在他自己最艰难的时候（文中推荐了抖音博主『东兴苟十三』讲苏东坡的视频）。结尾他引《定风波》：『莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生』——大概只有这种时候才明白，为什么小时候要背这些书了。",
                url: "",

                summary: "麦总对比链上币与二级山寨币的底层玩法（身边玩链上的朋友几乎都去玩二级了，他写这篇帮大家分清）：先上结论——两者的『驱动上涨的底层逻辑完全不同』。链上 Meme 是传播链的游戏：叙事从内圈到外圈再到 CEX，一层层吸引用户成为买盘推高市值，最后一圈买盘成为退出流动性，然后上所、注意力消退、结束；所以核心是叙事的想象力（最好叙事与传播链是『可发展的』）和早期拿到便宜筹码。庄和控筹也重要，但现在没有 CEX 用户可接盘，50–80M 就是散户想象力的天花板，到这个位置散户基本都在卖，庄再往上做全是卖盘没买盘、等于亏钱做市，庄不是来做慈善的。玩链上要考虑三件事：1. 叙事能传播多广、是否有延展性；2. 现在传播到哪一层了、你买之后还有谁接你的盘；3. 庄和控筹。二级山寨（尤其新币）完全不同：初始定价在 TGE 那刻就决定了，涨或跌庄都可以获利，驱动价格继续上涨还是下跌的底层逻辑几乎只有一个——『项目方或庄的意图是什么』。冲一个二级山寨前，先抛开叙事，假设你自己是庄、目标只有一个就是获利，问自己『为什么要花钱拉盘？』——大部分情况下你是想不到拉盘理由的，这也是大部分山寨币的现状：币都是印的、初始市值也是你定的，直接出货获利多简单，为什么要冒风险花钱拉盘？但有些情况下拉盘能获利更多：1. 上了 Alpha 和合约、要冲 BN 现货，为了流动性的皇冠明珠不能浇给，值得花钱拉盘（之前先上 Alpha 和合约、后上现货的币价表现都不错）；2. 散户情绪很熊、手里恰好有个高控的 BN 合约盘但基本面垃圾，一拉就有很多空头对手盘，只能通过拉盘爆空出货（如 MYX）；3. Upbit listing 快来了、币太便宜没法浇给，找韩国社区收筹拉个盘浇给韩国人（很多次新币启动的典型现象）；4. 币价与基本面极度相关，需要更高币价驱动『基本面变好』（如 Aster：币价拉高后通过二期空投吸引撸毛造交易量，瞬间抢走 Hyperliquid 的市场份额，散户的交易手续费换空投等于团队变相高点卖了币）；5. 已经浇到没有任何买盘，稍微拉一下吸引散户跟一波，找几个 KOL 喊一喊、Kaito 充点钱继续出货（最普遍的其实是这个，弹个十几个点继续浇）。反之，如果你买的币既上了 BN 现货、也上了 Upbit 现货（或者一看就上不了），又没有高控筹拉盘爆空的条件，业务也跟币价高低没关系——『那一定要恭喜你，你经受住了考验，现在盘子是你的了』。这句『为什么要拉盘』可以在不同时点反复用来判断庄的行为：刚 TGE 给散户发完空投为什么要拉？拉上去只会被砸，不如让空投自然砸下来、先把筹码收回来 80% 再拉；上了 Upbit 又没什么空头对手盘为什么要拉？买盘最集中的前一周是最好出货的时候，浇给韩国人；拉了 3 倍等了两个月 BN 现货还没通知，看来拿不到了、盘面撑不住，先浇了；下个月投资人解锁、KOL 轮也要给筹码了，先跑。本质上是一种思维：永远先想『他的目的是什么』，再推导『他的行为该是什么』。很多散户太爱幻想、有『庄是做慈善』的思维，总问『为什么这么好的币就是不拉盘』。最后用这套思维自查最近买入的山寨：是不是又因为它是 Perp DEX、被 CZ call 过、是 BN 投资的、是 BN Alpha 上还没涨的币——为叙事买单了？你真的想清楚『为什么要拉盘』了吗？",

                summary: "麦总答疑：几个小伙伴问他怎么看出来有些小市值的币有庄在『做多』或者『做空』。先得理解庄为什么要用合约收割：1. 收割需要找对手盘——现在这个市场上没人愿意接盘山寨币的现货了，涨多少跌多少散户购买意愿都很低，但很多合约交易者头铁乐意做空，庄爆掉做空的、让他们平仓，这个平仓动作就是『买』，相当于把空军在高位转化成了买盘；2. 合约的流动性是现货的数倍；3. 因为有杠杆，庄的资金使用效率极高；4. 流通的现货只要控得住，合约随便操盘。比如之前疯涨的 OM 为什么能一直涨这么多：控住现货，庄开合约多单，通过拉现货去爆合约的空单，合约多单赚的钱继续买成现货，一路滚雪球，市值越来越大。理解了这些，想知道一个币有没有庄或游资在搞事情，就着重找庄开合约仓位的迹象，主要关注 Open Interest（OI，合约持仓量）就够了。这个指标有两个用法：一个看绝对值——如果一个市值很低的标的合约持仓量巨大、甚至超过了它的市值，这种情况绝对有游资或庄在埋伏搞事情（这个之前川沐也有讲过）；第二个是观察合约持仓量的瞬间变化，去抓庄开多单和空单的瞬间，然后蹭庄的车。举例 Turbo 与 BroccoliF3B：庄在开多单和平多单时，合约持仓量都是瞬间巨量变化——看到 Turbo 庄多单瞬间开进去了、现货也开始拉，这个时候说什么也不该想怎么开空单，而是去尝试蹭庄多单的车；你想开空，一定是等庄的多单开始跑了再开空单。而 F3B 当你看到庄多单瞬间把 OI 平断崖了，这个时候不说去做空，你至少有多单的话也该跑了。",

                url: "",
                body:
                  "链上交易的不断变化的谜题和杰克的告别。\n\n" +
                  "2021年初，当大家都对罪犯和NFT过度关注时，我偶然看到一个由现已删除的用户“CLs 实习生”发的帖子。那是我第一次正式接触链上交易的世界。\n\n" +

                  "“每一笔交易都必须被扫描，每个钱包都必须被追踪，每一个以太扫描页面都必须被侦查”，我清楚地记得这句话。\n\n" +

                  "那时比特币已经超越了ATH，加密货币的黑暗时代即将到来，必然会有崩溃和崩溃。随着我意识到自己对已经过去的周期的失败和现实生活中非常令人担忧的财务问题，我自然地慢慢放弃了这种执念。\n\n" +
                  "一年转瞬即逝，2022年初中期的一个随机晚上，我在YouTube上看到了一个“BSC交易指南”，简介里链接了一个Discord服务器，我加入了服务器，发现链上有几百个BSC交易的玩家。这重新点燃了我的执念，我的生活慢慢开始围绕着在Poocoin上守护新部署并进行筛选。\n\n" +
                  "我会疯狂地连续18小时不停地推销Telegram频道和部署，直到终于破解了如何从真正的硬币中分辨骗局，下一步是预测哪些硬币会真正留在人们心中，我发现自己对这方面有出乎意料的敏锐感。\n\n" +

                  "你他妈的就是愚蠢，简单明了。\n\n" +
                  "你已经审查了每一次部署，观察每个跑者几个月，你那平庸的大脑却没发现任何可以利用的模式？\n\n" +
                  "我再次告诉你，改变你的想法。一个人怎么可能改变自己的思维？你得重新开始。\n\n" +
                  "首先，抛弃你脑海中所有关于链上交易的愚蠢想法，然后抛弃你看待货币本身的方式。\n\n" +
                  "（Memescope就是赌博！运气是唯一的决定因素！这是输家游戏！这就是你脑海中的链上交易画面，胡说八道，扔掉它。）\n\n" +
                  "链上是游戏，美元是你的积分。\n\n" +
                  "这是一种商业模式，你要么在竞争对手之前发现不对称或低效，要么通过服务为高要求的特定细分市场的参与者提供价值，从而获得积分。\n\n" +
                  "你的主要目标始终是寻找并针对低效的目标。\n\n" +
                  "想想，想想，想！\n\n" +
                  "你们谁在做交易前根本没想过，盲目跟随钱包，像个完全无能的失败者一样依赖西勒。必须消除对除自身系统以外的任何事物的依赖。\n\n" +
                  "想想看，你看到了什么，注意到了大多数人还没注意到的？你能预见到什么其他人还没看到的？你看的戏里没有类似的情节吗？继续前进。\n\n" +
                  "最终，无论如何，在数百次操作中总会有新东西出现，你会注意到大多数人还没注意到的东西，那就是你站位、让你的视野得以展开的地方。如果你做错了，就再次改变思维方式，你一定是看错了什么，你一定夸大了那个战术和它的潜力。解决了，继续前进。\n\n" +
                  "反复练习，直到你精通识别落后跑者的能力，最简单、最常见的战术不会是埃隆和特朗普的推文，而是你能比别人先掌握的迟缓战术。\n\n" +
                  "总的来说，识别你所谓“叙事”的核心武器就是这种思维方式。无论花多长时间，你都必须完善它。\n\n" +
                  "痴迷是好事，这意味着你内心有足够的意志力，能让身体承受几个月所需的大量屏幕时间，直到它枯萎。\n\n" +
                  "这种执念消退只有一个原因，就是没有产生任何成果。如果有人将一生奉献并围绕某个目标投入数月，期待结果，未能取得这些结果会逐渐消磨他的执念。\n\n" +
                  "那么，如何避免这种情况呢？你在实践中的第一步，就是准备好连续几个月坐在屏幕前几十小时。你将如何确保进展和结果（如果有的话）？\n\n" +
                  "答案在于提升你真正专注的能力\n\n" +
                  "当完美条件满足时，人类会有属于自己的“恍惚”状态。大脑会深度参与你所参与的活动，以至于开始捕捉到更多你原本会忽略的模式，进入一种绝对专注和投入的状态。\n\n" +
                  "不要只是在线上，要积极参与并投入你所关注的内容。当你盯着屏幕时，达到属于自己的最大专注状态。仅仅观看是不够的，理解它才是必要的。\n\n" +
                  "在基础心理学中，他们称之为心流状态\n\n" +
                  "著名F1车手艾尔顿·塞纳解释了在激烈F1比赛中的这种专注状态——\n\n" +
                  "“我不再是有意识地开车。我完全凭本能驾驶，身处另一个维度。我已经远远超出了限额，但还是能找到更多。这让我害怕，因为我意识到自己远远超出了意识的理解范围。”\n\n" +
                  "第一次经历时我很困惑，10个小时过去了，感觉像30分钟。我看到信息，仔细查看所有可用指标，处理它，思考在最大油门和速度下最现实的结果。\n\n" +
                  "可视化的人类流动状态\n\n" +
                  "根据你当前的技能和天赋为自己设定挑战，以实现最大专注力\n\n" +
                  "如果你的挑战太简单，你会很快感到无聊并失去专注。\n\n" +
                  "一个月平均PNL达到1.5-2万美元，目标是每月5000人的人，无法持续保持专注，因为挑战对他来说太简单，也无法激发他的热情。\n\n" +
                  "同样，一个净值1万的人目标是一个月赚50万，也永远无法集中精力赢，目标太不现实，他也无法集中注意力，因为焦虑和可能性渺茫。\n\n" +
                  "相反，你需要设定现实的目标，比如一个净值100索尔的人，目标是当天赚2.5索尔，这很有可能。秉持这一目标，他将以绝对精准的态度关注市场，因为目标非常现实\n\n" +
                  "所以设定一个目标，不一定要是每天赚多少钱，可以简单到今年净资产达到6位数。这个目标只考虑两个因素：你和你当前的能力。\n\n" +
                  "这种你不半吊子地专注、打鼾地穿行于世界上最混乱的市场状态，会帮助你进步，理解到底发生了什么，让你发挥出“最佳”表现。\n\n" +
                  "总结：目标是完善进入绝对专注状态的能力，这种状态是你能注意到最多模式、做出最佳瞬间决策、真正成长为交易者的地方。\n\n" +
                  "## 当前的游戏、现状以及如何玩。\n\n" +
                  "不可否认，链上游戏的难度呈指数级增长。大约四年前，你只需要买一个有锁定流动性的东西，就能赚到钱。\n\n" +
                  "随着环境成熟，技术细节的重要性也降低。简而言之，你越了解并重视这些币的“技术”方面（如持有者、流动性、成交量、图表），你就越会感到困惑，也越会觉得困惑。\n\n" +
                  "你唯一需要关注的是参与者对硬币的反应。过去四年里，这种状况从未例外。人类的情感是一致的，我们在这里就是为了利用它们。\n\n" +
                  "在这个时代，起点基地，你应该花最多时间的家无疑是memescope/pulse\n\n" +
                  "人们一遍又一遍地问我的风格，我整个交易环节里做的就是手动审核每一个分级币，寻找叙事或技术上的异常值，只要不重复且让我觉得有趣，我通常会抓1-2%低于20万美元的硬币，然后放任它走。\n\n" +
                  "“为什么不在迁移前”——不太确定，这种开挖方式——主播在5千MC买5索尔，12千索尔卖12千索尔，因为这是外部世界首次引入链上交易，所以越来越流行\n\n" +
                  "但我确定长期只坚持这种风格是有害的，你必须反应敏捷，并且能够适应PVE和PVP市场。总有一天，币种需要一周时间才能突破顶峰，而非数小时，这些交易者将难以适应，表现会不如那些只交易明显异常的交易者，即使在PvP市场也是如此。\n\n" +
                  "而且，PVP市场不会永远存在，也不完全依赖BTC价格。当资金从无技能者转向有技能者和提取者时，市场才会转变阵营。\n\n" +
                  "“批量工具能用吗？那追踪钱包呢？”\n\n" +
                  "我不使用批量工具或任何“提醒”，追踪钱包有助于掌握链上活动和运行内容。直到今天，我从未在任何交易中盲目跟单交易过任何人。\n\n" +
                  "信息溢出（使用多种工具并追踪多个钱包）只有那些能够在脑海中从噪音中解析出真正有价值信号的人才有用。\n\n" +
                  "我认识一些交易者，他们同时追踪成千上万个钱包，并且能拿到不错的PNL，因为他们非常习惯于这些钱包和活动中发现的模式。\n\n" +
                  "无论如何，你的任务是在这里扎营直到余生，逐一检查每一对迁徙的鱼，直到弄清楚哪些是逃逸的，为什么会逃逸。我保证，即使之前完全没有知识，每天对迁移进行露营和审核，哪怕持续两个月，也会带来巨大的进步（不一定是从Pnl的角度，而是理解的，但两者相辅相成）\n\n" +
                  "当你感觉出现了不一样的东西，而且不会持续5分钟时，你需要有一个简短但深入的思考过程，思考如何应对：\n\n" +
                  "了解别人会怎么看，明白从那时起它可能吸引多少关注。我通过可视化图表在脑海中绘制现在和未来的注意力图表，当然这种图表实际上并不存在，但你可以在脑海中勾勒出一幅画面\n\n" +
                  "一旦你做出了一个真实的地图，就精确调整你的尺寸（简单的公式：大小，这样如果战术顺利，胜利应该是胜利，如果失败，失败也不会让移植版感到太痛），然后耐心等待结果的到来。\n\n" +
                  "如果你错了，就重新评估并继续前进。如果你说得对，那你真是个天才，思考远超普通参赛者！\n\n" +
                  "要学会辨别和解读注意力，把注意力和价格联系起来，这样你才能在“叙事”重新定价之前珍视它们。我一直说，进场、尺寸和退出都是技术性问题，随着进展可以摸索和完善。但自己学会评估科技和叙事非常重要。\n\n" +
                  "科技型的对手也是如此，在AI主流时期，我们有数百次游戏，停留数小时甚至数天，目标低于1000万甚至更高。那些比他人更早意识到这项技术真正价值的人，率先承担了不可避免的重新定价。\n\n" +
                  "某个代币可能在10万美元停留数小时，而它本应至少估值500万，（你可以通过与当前高估值的成熟代币的市值/图表对比来判断）这些是基于实用工具的劣势。\n\n" +
                  "有些硬币乍看之下看起来很漂亮，虽然没有任何信息，但体积很大，这种情况下我会用我平时尺寸的三分之一来筛选，如果中等我就退出;如果是真的不错，如果不接近我预期的上限，我会加大尺寸。\n\n" +
                  "总结：关于叙事和技术的慢速重新定价，抢先一步的本质在于你能够洞察注意力的进出。\n\n" +
                  "“新闻交易在链上值得吗？埃隆的推文也不值得吗？”\n\n" +
                  "当然是这样，但很多人只是因为被快速的波动和快速的纵向图表吸引而被烧伤。\n\n" +
                  "他们不会想一秒钟，如果新闻行业已经达到了天花板，一个月前随便提到某事的新闻文章就没有任何催化剂，这会进一步吸引关注。另一方面，新的Elon宠物有很多潜在的选择，所以可以被高估，希望你能明白我想表达的意思。\n\n" +
                  "如果你想交易这些，你需要在10秒内精炼出理性决策的能力。你需要珍惜它，规划最佳尺寸和退出，且在人眼三眨眼内完成，这也是我大声呼吁增加屏幕时间的原因，因为这是唯一能帮助打磨这项技能的方法。\n\n" +
                  "我的整个交易系统都围绕着提前评估叙事的能力展开，这对我认识的最好的交易者来说也是如此\n\n" +
                  "尽管参与度高，进展和结果却停滞不前。为什么会这样？\n\n" +
                  "我见过的老交易员最常见的原因是缺乏责任感，他们会错过一些明显不该做的交易，但却归咎于外部因素，然后在没有正确评估失败原因的情况下继续前行。\n\n" +
                  "错过一些显而易见的事情就算是损失，应该被当作损失来对待。人类在因缺乏技能而表现不佳时，自然会提出应对推理和借口\n\n" +
                  "“就算我漏掉了X币又怎样，总会有下一个！我永远不会停止“，这种情况发生了上百次，他们一次又一次地告诉自己同样的话。当你错过了不该错过的东西时，你需要对自己严厉一些，真正体验失败感，才能真正理解问题并成长，不要忽视它，要理解它。\n\n" +
                  "自从特朗普交易后，我见证了这一点最清晰的表现。有两种人会有两种反应，一种是完全忽视失败，毫无思考地继续前行的人，另一种则陷入极度绝望，连续三天都无法集中注意力。那些错过了机会并主动采取行动的人，才是目前表现最好的。\n\n" +
                  "对失败感到绝望是成长的必经之路。你不能总是无知地说“但还有下一次”。\n\n" +
                  "必须有办法改变这一点，这样就不会有下一次。当然，借口能暂时缓解，但如果什么都没改变，几个月后未来会怎样？你会在同一个地方冲刺，而且会筋疲力尽。\n\n" +
                  "把生命的一部分献给这件事，真的值得吗？\n\n" +
                  "我会坚持这条路，是的，值得。是的，如果你有能力根据需要多次换交易员，那是值得的。对于资金和驱动力较低的人来说，最好的机会是链上。\n\n" +
                  "我真希望能给出一个简单的成功蓝图，但没有，这有点像问一个非常成功的足球运动员他怎么进那么多球，他能给出的最详细答案就是“在球门前踢球”。\n\n" +
                  "你们中有些人天生笨拙，永远无法意识到链上交易有整个心理层面，他们永远不会意识到你们不过是成千上万个像你一样的大脑竞争，你需要学习他们的思维方式。\n\n" +
                  "但你们很多人心里有这个能力，只是怀疑它，而不是发出去并承诺。不要浪费你的能力去换取漫长而未竟的生活。\n\n" +
                  "承诺真正解开这个谜题，遵循你的流程，并不断重建你的过程，直到赢得胜利。\n\n" +
                  "## 片尾字幕及一些个人感想\n\n" +
                  "上面是我交易风格的全部总结，我用文字尽可能精准地描述了我的思维方式。看起来很简单，但事实就是这样，这正是我能一个月又一个月打出猥亵PNL的原因。\n\n" +
                  "我已经发布了几十本链上交易的技术指南，但从未真正涉及过心理层面，因为语言表达太困难了。我试图传达如何实现专注，也展示了该如何引导专注。\n\n" +
                  "毫无疑问，这游戏很难，但别被吓倒，也不要害怕游戏，勇敢面对它。拥抱这个谜题，享受这个过程。\n\n" +
                  "想想！想想！想想！\n\n" +
                  "一定要花时间理性思考。要有勇气真正面对你的问题，我相信你会做到的。\n\n" +
                  "说到这里，我想我就说完了。我用我最喜欢的词来结束它，\n\n" +
                  "愿真主保佑。\n\n" +
                  "告别了，来自Jacknuked！"
              }
            ]
          },
          {

            name: "Timo",
            avatar: "assets/f6c8c5d42630.png",

              {
                id: "timo-cupsey-second-leg",
                title: "如何埋伏SOL二段Meme并止盈：以Cupsey为例",
                date: "2024-12-04",
                type: "长推",
                summary: "Timo 的干货教学：他如何埋伏 SOL 二段 Meme 并止盈卖出，全程依照他的『Meme 八问』来写；举例的 Cupsey 他已不持有任何仓位。他特意写非龙 1 的打法，因为龙 1 跑得太快、快到大部分人无法上车，所以分享强赛道下埋伏非龙 1 的策略。1、叙事如何？当时背景是以 Luce 为首的吉祥物乱飞，作为龙 1，Luce 在链上的市值到达几亿美金——这很重要，意味着吉祥物 Meme 被 Luce 打开了天花板；原则就是：如果一个赛道的龙 1 上限都没有打开，其他仿盘可以直接放弃、考虑都不用考虑。Cupsey 的叙事很简单，就是 pump.fun 的吉祥物，而且当时跟创始人互动过好几次，在他看来就是『所谓被官方认可』；pump.fun 作为目前链上的赚钱机器本身没有发币，作为它的吉祥物会有炒作空间。因此他给它的叙事评级为 A（A 在他这里就是潜在几千万市值的评级，龙 1 一般是 S）。2、是否有庄？要结合两方面评估：1）第一次 FOMO 后的市值高位——一般来说在 SOL 上非强叙事（非龙 1）第一波能 FOMO 到 5M 左右，在他这里就会先打上『有庄』的标记；2）在初步判断『有庄』的可能性后查看 Top20 钱包——一个有庄的 Top20 大部分应该是盈利的而非亏损的（这个麦总也有提到），一眼扫过去大部分是亏损的可以直接放弃；如果大部分是盈利且『倍数很高』，那恭喜，大概率是个庄盘；接下来要关注这些钱包是否出了很多货，如果大部分钱包都出了很多货，说明这个盘大概率已经被丢弃了，如果只是个别小几个钱包出了货那很正常、不需要担心，因为庄需要通过出一些筹码一为了获利、二为了做市，庄通过高卖低买使自己用最低的成本获取最高的筹码、以便于第二次拉升；3）点进去挨个查看钱包（他说明：时至今日前排钱包已经发生变化，他只能举一些钱包例子，当时买入时前排并不完全是这样）——庄的钱包一般有几个特征：币不多、比较新/很久没活动突然开始活动、买入筹码价格很低、卖出价格基本在峰值；因为现在 SOL 的庄都很聪明，会洗钱包、提前把钱包建好、然后不断买入卖出一些代币伪装成散户。以榜 4 地址为例（goat、zerebro 各持有 2–3M USD），这种钱包有时候是用来迷惑人的、有时候又是用来做广告的，只看到这种钱包仍然不够；再看早期钱包例子 GHeTrHtWTWPWs8z4sBQK4zqvkCJ4CQVw5WHVRyzhzm9Y：这个钱包里有 1M USD 的 pups（纯纯阴毛盘），又有 2% 持仓的 Cupsey，买入价格在第一段 FOMO 下来的 1–2M 左右，而且在二次拉升到 20M 左右的时候一点都没有卖——什么人涨了也不卖、跌了也不卖？要么是庄、要么就是内幕、要么就是钻石手；这种钱包只能进行疑似判断、无法 100% 确定，但疑似也足够了。3、盈亏比如何？吉祥物叙事赛道里 Luce 是龙 1、链上市值 2 亿左右，给 Cupsey 的评估就是 1/20–1/10 左右、10–20M 市值；结合第一波 FOMO 下来的横盘位置（600K–1.5M）之间，他预期的盈亏比就是至少 10 倍+；而此时分析完之后的胜率来到了 90%（不说 100% 是因为留 10% 给黑天鹅事件）。另外一个重要的证据是庄一直在护盘、不让盘子跌破 60 万，基本又给胜率上了一层保险。4、什么时候是合适的建仓位置？如何建仓？60 万–1.5M 之间的横盘时间是最好的建仓位置；他认为做二段 Meme 最好就是在横盘建仓，而不是等右侧追高，因为很多时候 Meme 操盘很恶心，拉一波之后又下来让你做个天线宝宝；此时就可以分批买入，他大概买了 0.8% 的仓位并且分了 4 个钱包（大家可以结合自己的仓位选择要不要分钱包，他觉得一般在 0.2% 以下是不需要的）。5、这样的标的应该占你玩链上资金的多少比例？他的方法是：如果这个标的是他极其看好的赛道龙 1，他会最多上 30% 的仓位（也要结合资金体量以及建仓时 Meme 的市值看，30% 只是极限参考比例——这个数字即使全亏掉，虽然会让你元气大伤，但不会让你伤筋动骨，这就是仓位管理的意义）；像这种非龙 1 的打野标的，他认为除非有很大的把握，不然不要上超过 20% 的仓位。6、如何止盈？前面提到预估市值在 10–20M，但因为这不是龙 1，所以他的止盈会提前：在 5M 左右的时候出了本（5x 出了本），之后在 8–12M 之间止盈了 70%，最后留了 10% 的仓位做 moonbag。总体来说，这就是一个胜率极高、赔率还不错的标的；他希望大家在选择做二段 Meme 时可以参考他的策略——他最近做这种的总体胜率在 80%+、赔率在 8 倍以上。有的人可能说有些 Meme 的二段不是这种走势，他回答：那你就不要做那种『奇奇怪怪』走势的二段，找胜率高、赔率高的二段 Meme 不好吗？文末他还向读者征求反馈：这样写能不能看懂，看懂的打在评论里、看不懂的也说明原因，他下次写的时候优化。",
                url: "",
                body:
                  "今天给你们写一个干干干货。告诉你我是如何埋伏sol二段meme，并止盈卖出的。总的思路会依照meme八问来写。首先说明，我要举例的这个meme，目前我已经不持有任何仓位。且这个meme并非是赛道龙1，我为什么写非龙1的打法，是因为很多时候龙1跑得太快了，快到大部分人无法上车。所以想给你们分享下强赛道下，如何埋伏非龙1的策略。\n好了，废话不多说，以Cupsey这个meme为例。\n\n" +
                  "## 1、叙事如何？\n\n" +
                  "当时背景是以luce为首的吉祥物乱飞，作为龙1，luce在链上的市值到达了几亿美金。这个很重要，这意味着吉祥物meme被luce打开了天花板。\n原则就是如果一个赛道的龙1上限都没有打开，其他仿盘可以直接放弃不用玩，考虑都不用考虑。\n而cupsey的叙事也很简单，就是http://pump.fun的吉祥物，而且当时跟创始人互动过好几次。在我看来就是“所谓被官方认可”。pumpfun作为目前链上的赚钱机器，本身没有发币，作为它的吉祥物会有炒作空间。\n因此我给它的叙事评级为A. A在我这里就是潜在几千万市值的评级。龙1一般就是S。\n\n" +
                  "## 2、是否有庄？\n\n" +
                  "有没有庄需要结合2个方面来评估，\n1）是第一次fomo后的市值高位，一般来说，在sol上非强叙事（非龙1）第一波能fomo到5m左右，在我这里就会先打上“有庄”的标记。\n\n" +
                  "2）在初步判断“有庄”的可能性后，我会去查看top20的钱包。\n一个有庄的top20的钱包，大部分应该是盈利的，而非是亏损的（这个麦总也有提到哈）。如果你一眼扫过去，大部分是亏损的，可以直接放弃，不用进行下一步了。\n如果大部分是盈利且“倍数很高”的，那恭喜你，这大概是个庄盘。接下来，要去关注这些钱包是否出了很多货，这一点也很重要，如果大部分钱包都出了很多货，这说明这个盘大概率是已经被丢弃了。如果只是个别小几个钱包出了货，那很正常，不需要担心。因为庄是需要通过出一些筹码，一是为了获利，二是为了做市。庄通过高卖低买，使得自己用最低的成本获取最高的筹码，以便于第二次拉升。\n\n" +
                  "3）点进去挨个查看钱包。\n此时，你已经确认这是个庄盘，所以需要进行更细致的分析。请挨个点进钱包进行查看。（我想说明下，时至今日，前排钱包已经发生了变化，我只能举一些钱包例子给你们说哈，当时我买入的时候，前排钱包并不完全是这样的）\n一般来说，庄的钱包有几个特征：币不多，比较新/很久没活动突然开始活动，买入筹码价格很低，卖出价格基本在峰值。\n因为现在sol的庄都很聪明，会洗钱包，提前就把钱包建好，然后不断的买入卖出一些代币，伪装成散户。\n\n" +
                  "我们看Cupsey的具体钱包，以榜4地址为例，goat zerebro各持有2-3m usd，你感受下这个钱包。这种钱包，有时候是用来迷惑人的，有时候又是用来做广告的。所以只看到这种钱包仍然是不够的。\n\n" +
                  "所以你还需要去看看其他的钱包，这里的早期钱包已经换掉了，所以没法给你们找具体钱包来分析。是逻辑是类似的，可以看看这个钱包。\nGHeTrHtWTWPWs8z4sBQK4zqvkCJ4CQVw5WHVRyzhzm9Y\n这个钱包里有1musd的pups（这纯纯阴毛盘），又有2%持仓的cupsey，买入价格在第一段fomo下来的1-2m左右，而且，在二次拉升到20m左右的时候一点都没有卖。\n\n" +
                  "你可以思考一下，什么人涨了也不卖、跌了也不卖？要么是庄、要么就是内幕、要么就是💍手。这种钱包你只能进行疑似判断，无法100%确定（不像是早期那种筹码钱包一眼就能看出来了）。但疑似也足够了。\n\n" +
                  "## 3、在确定完叙事、庄盘、看完钱包之后，我们需要评估的是盈亏比如何？\n\n" +
                  "前面有提到，吉祥物叙事赛道里luce是龙1，链上市值2亿左右，给cupsey的评估就是1/20-1/10左右，10-20m市值。\n结合第一波fomo下来的横盘位置（600k-1.5m）之间，我预期的盈亏比就是至少10倍+。而此时你分析完之后的胜率来到了90%，不说100%是因为我们留10%给黑天鹅事件。\n忘了说了，另外一个重要的证据是庄一直在护盘，不让盘子跌破60万。基本又给胜率上了一层保险。\n此时，你告诉我，这样的盘子，上不上？买了之后心里安稳不安稳？\n\n" +
                  "## 4、什么时候是合适的建仓位置？如何建仓？\n\n" +
                  "聪明的小伙伴已经知道了，60万-1.5m之间的横盘时间是最好的建仓位置。我认为做二段meme最好就是在横盘建仓，而不是等右侧追高，因为很多时候meme操盘很恶心，就是拉一波之后又下来，让你做个天线宝宝，你能难受死。\n此时就可以分批买入，我大概买了0.8%的仓位，并且分了4个钱包。大家可以结合自己的仓位，来选择要不要分钱包。我觉得一般在0.2%以下是不需要的。\n\n" +
                  "## 5、这样的标的应该占你玩链上资金的多少比例？\n\n" +
                  "我的方法是，如果这个标的是我极其看好的赛道龙1，我会最多上30%的仓位。这个也要结合你的资金体量以及你建仓时meme的市值来看的。30%只是给你们一个极限的参考比例。因为这个数字即使全亏掉，虽然会让你元气大伤，但不会让你伤筋动骨。这就是仓位管理的意义。\n像这种非龙1的打野标的，我认为你们除非有很大的把握，不然不要上超过20%的仓位。\n\n" +
                  "## 6、如何止盈？\n\n" +
                  "前面提到了预估的市值在10-20m，但因为这不是龙1，所以我的止盈会提前，在5m左右的时候出了本（5x出了本）。之后在8-12m之间止盈了70%，最后留了10%的仓位做moonbag。\n\n" +
                  "总体来说，这就是一个胜率极高，赔率还不错的标的。我希望你们在选择做二段meme时，可以参考我的策略，我最近做这种的总体胜率在80%+，赔率在8倍以上。\n有的人可能说，有些meme的二段不是这种走势，很简单啊，那你就不要做那种“奇奇怪怪”走势的二段，找胜率高、赔率高的二段meme不好吗？\n\n" +
                  "另外也想问下大家，我这样写你们能不能看懂？看懂的请打在评论里。看不懂的也说明原因，我下次写的时候优化一下。"
              }
            ]
          },

                date: "2025-02-16",
                type: "长推",
                summary: "TIGER 的至暗时刻记录：45 天蒸发 200 万美元——他声明自己不是永赚博主、也没有无敌大的资金量，这 2M 是他多年一个毛一个毛撸出来、一个个热点踩出来的积累，也是进圈以来比较大的回撤；他说这更多是记录而非复盘，复盘需要更理智。回撤来自三处：1. Hype 上的合约——2018 年他做合约曾亏掉 2000 多个以太坊和 100 个大饼，从那以后给自己立下『交易方面除了套保不再碰合约』的决心；但年底 Hyperliquid 火热，他开盘入了 5 万 U 赚到 10 万 U，并认定 Hype 是这轮少数不多的创新、会不断蚕食 CEX 份额，于是决定在 20 多的位置高位重仓——由于 Hype 本身是合约平台、与他不碰合约的规则相悖，又想多体验平台功能，他最终在开三倍杠杆的情况下配『无限保证金』，放了 1M 保证金在合约平台，为之后的巨大损失埋下伏笔（文中自嘲：2018 年立下『永不合约』flag 时，绝不会想到 2025 年的自己会在 Hyperliquid 亲手撕毁誓言，背后是那句魔鬼的耳语『这次真的不一样』），时隔 7 年再次在合约上栽跟头。2. AI agent——他错过了 AI agent 的暴涨，又在高位接盘：用 20 万 U 追了一点带杠杆的 AI agent 仓位（与 Hype 仓位比小很多，但仍低估了杠杆的威力），高点接盘 Virtual 以及 AI16Z；起初下跌没什么感觉，毕竟热度和叙事都好，但后续遇到 Trump 的市场吸血、以及 DeepSeek 冲击美股 AI 板块，整个币圈 AI agent 失去信仰，他中途弃车，在不到 20 万保证金的情况下损失超过 80 万 U（文中比喻：把杠杆当放大镜，却忘了它更是哈哈镜）。3. Meme——他很早就意识到 Meme 这轮的重要性，一直在打造自己的武器工具库（各种链上监控、聪明钱快速购买），但结果远未达想象：1）Pnut：持续关注以及重仓让他在 Pnut 身上最高赚到 1M，但也正是从 Pnut 开始，由于快速的利润实现，他的操作变得更加激进、风险偏好更高，以往在山寨上的投资份额不会这么大——『可以说，这轮这么大的总金额回撤，Pnut 的成功有很大的因素』（文中称 1M 利润是裹着糖衣的砒霜，让他忘记山寨币本该轻仓的常识）；2）Trump：链上自制的各种工具、监控、大 V 聪明钱发言，全都无法阻挡他在欧洲时区凌晨 3 点睡觉——以他当时的激进风格，监控的地址 90% 拿到大结果，怼进去几百 K 赚个 10M 应该没问题，而身在欧洲的他刚好成了盯盘 20 小时、睡觉错过 Trump 的那批人，可以说是错过人生机会；第二天除了起床懊恼，现实生活中他刚好遇到最重要的时刻之一——产房迎接小孩；屋漏偏逢连夜雨，在产房忙得不可开交时，他在厕所看到特朗普老婆发币导致 Trump 闪崩，由于就职典礼还没到来，Trump 闪崩 40% 让他认为是入场时机，当即卖了很多山寨、50 左右买入 40 万 U；然后迎接新生儿，同时有 2–3 天没太有时间思考和操作他那加了杠杆的 AI agent 代币以及高位接盘的特朗普代币——重重重大损失（文中称人生第一次理解什么叫『被命运双杀』）；3）阿根廷总统——Trump 之后他本已下定决心认亏离场、等平复心情再做打算，偏偏阿根廷总统发币的事件让他第一时间看到了：这回他醒着，开盘 10 分钟便进入，心想『这次是属于我的人生时刻了』；钱包里不够，从 CEX 提币花了 10 分钟，几次加仓后怼进去了 20 万 U、均价 3 块；买完之后他还分别给欧洲时区、美国时区以及中国时区的好兄弟们打了电话（一边自嘲『小丑』），一边刷消息一边确认了发币的真实性，虽然认为特朗普价格只剩 20B、这边不会有超额收益，还是痴迷于这次进入的『早』；很快盈利到了 50%，他手按在卖出 75% 的按钮上想着回本，却发现 10% 的交易税，再三确认之后价格已经开始下行；留给他们的卖出窗口太少了，跌到 2 块时他看到 dev 单边加池子卖出的消息，但亏损厌恶的他认为只要总统发币不是虚假事件、总归会有反弹，反弹再出货也能少点损失；紧接着的下跌以及 rug 事件大家都知道了，最终他损失 80%，疲惫地在凌晨 5 点蒙上被子睡觉——『再不睡觉我要猝死了』（文中称这 20 万刀成了最昂贵的闹钟，教会他凌晨五点的太阳从不照亮 rug pull 的残局）。写在最后：『所有财富密码都暗中标好了时区——而你永远在错误的那一个』；无论准备得再多，发大财需要点『命』。他给自己打气：他成功地做过很多次正确决定，做过几百万日活的 Web2 产品，也从零积累过几千万粉丝的矩阵，曾经好几次经历重大回撤，但都站起来了——『这次，我相信我也可以。废墟里能长出更坚韧的翅膀。』最后请陌生的朋友留言帮他打打气、也帮自己攒攒人品：『属于我们的机会还没到，但是它就在路上。』",

                body:
                  "想了很久，还是决定记录一下。这阶段痛苦，怀疑自己，懊恼以及亏对自己努力的心情。更多作为记录，而不作为复盘吧。复盘可能需要更理智才行。\n\n" +
                  "首先声明，我不是永赚博主，也没有无敌大的资金量。2M的损失是我多年积累，一个毛一个毛撸出来，一个个热点踩出来的，也是进圈以来比较大的回撤了。\n\n" +
                  "## 1. Hype上的合约\n\n" +
                  "18年做合约曾经亏掉2000多以太坊以及100大饼，那次惨痛的经历让我给自己暗自下决心交易方面除了套保不再碰合约。\n\n" +
                  "年底的Hyperliquid火热，我开盘入了5wu赚到10wu，并认定了Hype作为这轮少数不多的创新，会不断蚕食Cex份额，所以决定在20多的位置高位重仓Hype。\n\n" +
                  "由于Hype本身是合约平台，与我给自己不碰合约的规则相悖，而我又想多体验一些Hype平台功能，于是决定开三倍杠杆的情况下，配无限保证金。最终放了1M的保证金在合约平台，这也为之后的巨大损失埋下伏笔。\n\n" +
                  "2018年立下\"永不合约\"flag时，我绝不会想到2025年的自己会在Hyperliquid亲手撕毁誓言。\n\n" +
                  "5万变10万的甜蜜开局，20美元重仓的疯狂决策，1M保证金配三倍杠杆的致命操作... 这些数字背后藏着一句魔鬼的耳语：\"这次真的不一样\"。\n\n" +
                  "## 2. AI agent\n\n" +
                  "没错，我错过了AI agent暴涨。并且在高位接盘了。\n其实也没有重仓，但是正如前面所描述的，Hype合约里放了1M，我选择了用20w追了一点AI agent带杠杆的仓位。与Hype的仓位比起来，我认为小很多，但是还是低估了杠杆的威力。\n\n" +
                  "最终高点接盘Virtual以及AI6Z。一开始的下跌其实没有什么大感觉，毕竟市场热度以及叙事都是好的情况。但是后续遇到Trump的市场吸血，以及Deepseek冲击美股AI板块，让整个币圈AI agent失去信仰。我中途弃车结果在不到20w保证金的情况下，损失超过80wu。\n\n" +
                  "20万刀追击AI agent时，我犯了一个老炮最不该犯的错：把杠杆当放大镜，却忘了它更是哈哈镜。Deepseek突袭美股时，我的仓位在扭曲中崩塌，80万刀蒸发得比利空消息传播得更快。\n\n" +
                  "时隔7年，再次在合约上栽了跟头。\n\n" +
                  "## 3. Meme\n\n" +
                  "很早就意识到了meme这轮的重要性，所以也一直在打造自己的武器工具库，各种链上监控以及聪明钱快速购买。最终情况并没有达到想象的结果，一切的努力好像都显得非常可笑。\n\n" +
                  "只说几个大的节点吧：\n\n" +
                  "1）Pnut\n\n" +
                  "Pnut持续关注以及重仓，让我在他身上最高赚到了1M。但是也正是从Pnut开始，由于快速的利润实现，我的操作变得更加的激进，风险偏好更高。以往在山寨上的投资份额不会这么大。\n\n" +
                  "可以说，这轮这么大的总金额回撤，Pnut的成功有很大的因素。\n\n" +
                  "\"1M利润是裹着糖衣的砒霜，它让你忘记山寨币本该轻仓的常识\"\n\n" +
                  "2）Trump\n\n" +
                  "我们在链上自制的各种工具，监控，大V聪明钱发言。全都无法阻挡我在欧洲时区凌晨3点睡觉！\n\n" +
                  "以我当时的投资激进风格，监控的地址90%拿到大结果，怼进去几百k赚个10m应该没啥问题。\n\n" +
                  "而身在欧洲的我，刚好成了盯盘20小时，睡觉错过Trump的那批人。以我当时的投资风格以及一大堆自制监控程序，我真的可以说是错过人生机会。\n\n" +
                  "第二天除了起床懊恼之外，现实生活中我刚好遇到了最重要的时刻之一，产房迎接小孩。\n\n" +
                  "屋漏偏逢连夜雨，在产房忙的不可开交的时候，我在厕所看到特朗普老婆发币导致trump的闪崩，由于就职典礼还没到来，trump闪崩40%让我认为是入场时机，当即手记卖了很多山寨，然后50左右买入40wu。\n\n" +
                  "然后迎接新生儿，同时有2-3天没太有时间思考和操作我那加了杠杆的AI agent代币以及高位接盘的特朗普代币。\n\n" +
                  "重重重大损失。\n\n" +
                  "当孩子第一声啼哭撞上Trump代币闪崩40%，人生第一次理解什么叫\"被命运双杀\"\n\n" +
                  "3） 阿根廷总统\n\n" +
                  "Trump之后的重大回撤已经让我懊恼，从理论上错过一个亿，再到疯狂亏损的山寨，让我下定决心认亏离场。等平复好心情以及状态再做打算。\n\n" +
                  "然而就是这么巧，阿根廷总统发币的事件，让我第一时间看到了。\n\n" +
                  "这回我醒着，开盘10min便进入。这次是属于我的人生时刻了，我对自己说。\n\n" +
                  "钱包里不够，从cex提币花了10min，几次加仓后我怼进去了20wu，均价3块。\n\n" +
                  "买完之后，我还分别给我欧洲时区，美国时区以及中国时区的好兄弟们纷纷打了电话。（小丑）\n\n" +
                  "一边刷着消息，一边确认了发币的真实性。虽然认为特朗普价格只剩20b，这边不会有超额收益，但是我还是痴迷于这次进入的“早”。\n\n" +
                  "很快盈利到了50%，我手按在了卖出75%的按钮上面，想着回本，却发现10%的交易税，我再三确认之后，价格已经开始下行。\n\n" +
                  "留给我们的卖出窗口机会太少了，跌到2块的时候我看到了dev单边加池子卖出的消息。但是亏损厌恶的我，认为只要总统发币这个事件，不是虚假事件，总归会有反弹，反弹再出货也会少点损失。\n\n" +
                  "紧接着的下跌以及rug事件，大家都知道了，最终我损失80%。疲惫的在凌晨5点蒙上被子睡觉，再不睡觉我要猝死了。\n\n" +
                  "在阿根廷总统代币上押注的20万刀，成了最昂贵的闹钟——它教会我凌晨五点的太阳从不照亮rug pull的残局\n\n" +
                  "## 写在最后\n\n" +
                  "\"所有'财富密码'都暗中标好了时区——而你永远在错误的那一个\"\n无论你准备的再多，发大财需要点“命”。\n\n" +
                  "这不是复盘，只是记录一个心情破碎的我。\n\n" +
                  "鼓励自己一下，我成功的做过很多次正确决定，做过几百万日活的web2产品，也从零积累过几千万粉丝的矩阵。我曾经好几次经历重大回撤，但是我都站起来了。\n\n" +
                  "这次，我相信我也可以。废墟里能长出更坚韧的翅膀。\n\n" +
                  "陌生的朋友，可以的话，留言帮我打打气，也帮你们攒攒人品。属于我们的机会还没到，但是它就在路上。"
              }
            ]
          },
          {
            id: "picklecat",
            name: "Pickle Cat",
            avatar: "assets/01551e56dccc.png",
            bg: "assets/cb5e4f0b9111.jpg",
            bgPos: "50% 50%",
            bio: "",
            articles: [
              {
                id: "picklecat-low-point",
                title: "低谷期该怎么办（纯个人经验干货）",
                date: "2025-12-16",
                type: "长推",
                summary: "Pickle Cat 的个人经验干货：低谷期该怎么办。他说『命』是你从出生到现在所有经历与认知累积后的蝴蝶效应，最终在此刻推动你做出某个行为与选择；既然如此，当你带着这些『认知偏差』去学任何新东西时都会带着个滤镜，而有滤镜就必有盲区——有些盲区别人一眼就能看出来，但对你来说却像不存在一样；可把盲区交给别人评判有时反而会害了你，所以你只能靠自己孵化出一个『第三视角』、一个能跳出来、一个能站在更高维度审视现在的你，这个『新』的你能给出你从未想到的答案——而这，就是为什么有些人所谓『悟性强』，而另一些人明明很努力，却一辈子在原地打转。但这种『第三视角』不是靠努力学习或强逼自己成长就能出现的，它被孵化出来的环境条件往往只有一个：你真在低谷期的时候。真正的低谷期会让你的 ego（自我）完全碎掉，经历过的都懂，那时候别人说什么你都能真听进去，而且你几乎可以随时进入深度冥想状态——注意，是深度，不是平常那些浅浅的、偶尔的、自我感动式冥想；过得好的时候你根本进不了那么深（除非你已经专门训练了很久）。『没有 ego 的你』，加上『随时深度冥想』，加上『彻底被逼到墙角的环境』，完全是孕育出『另一个你』的最佳土壤：你已经痛到这个份上了，光脚的不怕穿鞋的，还有什么好怕的？都这样了，还怕面对羞耻？还怕面对曾经的恐惧？具体做法：这时候先把你一生中最羞耻、最害怕的三十件事写下来，然后一条条去接受它；去搜『12 steps of AA』，把这 12 步直接开始做了，把『alcohol』替换成『my emotions/my life/my well-being』——你去搜了就知道他在讲啥了，真想变好就别天天抱怨、直接行动起来；他专门写过推讲为什么 AA 的 12 步不仅仅适合戒酒、更适合 apply 到人生低谷期＋交易相关挫折/上瘾/冲动，他亲身试过、真有用，一般人做到前三步就差不多了，甚至不用完成 12 步。平常你做不到，因为你会拼命躲避，但低谷期的你反而能轻易做到——这就是所谓的环境优势，得利用这个环境。很多人说『我低谷期连起床力气都没有，我还能学什么、进步什么？』这句话本身就跑偏了，说明你在逆着环境去发力：低谷期不是没有能量，你只是没有正能量，你现在拥有的是极深、极厚、极锋利的负能量；你也许恨自己、责怪自己、怀疑人生，那也是力量，甚至是超级强的那种。你要顺着它，把你的 ego 全面摧毁，把你的人生一段段回放，从头到尾审视你自己——你不需要『学习』任何新东西，你的记忆就是你最低成本、最高价值的教材，你会突然拥有一种『上帝视角』去看你的过去，而这就是你突破的开始了。别再逼自己低谷期也要爆发、要产出、要表现、要赢别人，你唯一需要做的，就是好好看看你自己；反正你都已经这么难受了，还怕面对自己吗？还怕羞耻吗？还怕痛？痛都痛成这样了，也不过是顺势拆掉旧的你，好让新的你能出生。当然，并不是所有低谷都能用这种方式：还有一种低谷是『麻木』，这种比痛苦更难，因为痛苦至少还有能量，哪怕是负的；这种情况需要的是重新刺激身体与痛觉的感受，但那又是另一个完全不同的课题了。",
                url: "",
                body:
                  "都说“命”是你从出生到现在所有经历与认知累积后的蝴蝶效应，最终在此刻推动你做出某个行为与选择。\n\n" +
                  "既然如此，当你带着这些“认知偏差”去学任何新东西时，都会带着个滤镜。\n\n" +
                  "而有滤镜就必有盲区。\n有些盲区别人一眼就能看出来，但对你来说却像不存在一样。\n\n" +
                  "可把盲区交给别人评判有时反而会害了你。\n\n" +
                  "所以你只能靠自己孵化出一个“第三视角”、一个能跳出来、一个能站在更高维度审视现在的你，这个“新”的你。\n\n" +
                  "这个你能给出你从未想到的答案。\n\n" +
                  "而这，就是为什么有些人所谓“悟性强”，而另一些人明明很努力，却一辈子在原地打转。\n\n" +
                  "但这种“第三视角”，不是靠努力学习或强逼自己成长就能出现的。\n\n" +
                  "它被孵化出来的环境条件往往只有一个：你真在低谷期的时候。\n\n" +
                  "真正的低谷期会让你的ego（自我）完全碎掉。\n\n" +
                  "经历过的都懂，那时候别人说什么你都能真听进去。\n\n" +
                  "而且你几乎可以随时进入深度冥想状态。\n\n" +
                  "注意，是深度。\n\n" +
                  "不是平常那些浅浅的、偶尔的、自我感动式冥想。\n\n" +
                  "过得好的时候，你根本进不了那么深（除非你已经专门训练了很久）。\n\n" +
                  "“没有 ego 的你”，加上“随时深度冥想”，加上“彻底被逼到墙角的环境”，完全是孕育出“另一个你”的最佳土壤。\n\n" +
                  "你已经痛到这个份上了，光脚的不怕穿鞋的，还有什么好怕的？\n\n" +
                  "都这样了，还怕面对羞耻？还怕面对曾经的恐惧？\n\n" +
                  "这时候先把你一生中最羞耻、最害怕的三十件事写下来，然后一条条去接受它。\n\n" +
                  "去搜“12 steps of AA”，把这12步直接开始做了，把“alcohol”替换成“my emotions/my life/my well-being”。你去搜了就知道我在讲啥了，真想变好就别天天抱怨，直接行动起来。\n\n" +
                  "我专门写过个推关于为什么AA的12步不仅仅适合戒酒，更适合apply到你人生低谷期+交易相关挫折/上瘾/冲动。我亲身试过，真有用！一般人做到前三步就差不多了，甚至不用完成12步。\n\n" +
                  "平常你做不到，因为你会拼命躲避，但低谷期的你反而能轻易做到。\n\n" +
                  "这就是所谓的环境优势，得利用这个环境。\n\n" +
                  "很多人说：“我低谷期连起床力气都没有，我还能学什么、进步什么？”\n\n" +
                  "这句话本身就跑偏了，说明你在逆着环境去发力。\n\n" +
                  "低谷期不是没有能量，你只是没有正能量。\n\n" +
                  "你现在拥有的是极深、极厚、极锋利的负能量。\n\n" +
                  "你也许恨自己、责怪自己、怀疑人生。\n\n" +
                  "那也是力量，甚至是超级强的那种。\n\n" +
                  "你要顺着它，把你的 ego 全面摧毁，把你的人生一段段回放，从头到尾审视你自己！\n\n" +
                  "你不需要“学习”任何新东西，你的记忆就是你最低成本、最高价值的教材。\n\n" +
                  "你会突然拥有一种“上帝视角”去看你的过去，而这就是你突破的开始了。\n\n" +
                  "别再逼自己低谷期也要爆发、要产出、要表现、要赢别人。\n\n" +
                  "你唯一需要做的，就是好好看看你自己。\n\n" +
                  "反正你都已经这么难受了，还怕面对自己吗？还怕羞耻吗？还怕痛？\n\n" +
                  "痛都痛成这样了，也不过是顺势拆掉旧的你，好让新的你能出生。\n\n" +
                  "当然，并不是所有低谷都能用这种方式。\n\n" +
                  "还有一种低谷是“麻木”。这种比痛苦更难，因为痛苦至少还有能量，哪怕是负的。这种情况需要的是重新刺激身体与痛觉的感受。\n\n" +
                  "但那又是另一个完全不同的课题了。"
              },
              {
                id: "picklecat-revenge-trading-aa",
                title: "快速指南：如何系统地即时解决你的报复性交易问题",
                date: "2025-05-11",
                type: "长推",
                summary: "Pickle Cat 的快速指南：如何系统地即时解决报复性交易问题。他开宗明义：交易就是毒瘾，更糟的是——因为社会庆祝你：你吸食海洛因过量，别人建议你去寻求帮助；你把账户爆破，人们却说『换个小一点的尺寸，才能恢复你的市场感觉』——尺寸更小？那不是纪律，那就是助长复发，和朋友刚出康复中心后说『只要吸一口小一点就没事』有什么区别？1. 为什么它像毒瘾：成瘾者总说他们在一次糟糕的迷幻体验后会戒掉，交易者总是说在遭受严重亏损后会停止报复性交易——然后两个小时后，你蜷缩在沙发上，短路（做空）$ETH，心想『只剩最后一次交换，我保证我会回来的』，你很痛苦，冲动交易就是你的吗啡。最糟糕的是大家鼓掌：你失去一切，他们说你『有野心』；你乱搞，他们说你在『管理波动性』、你就会陷入恶性循环；你在赌博、应对、腐烂，他们称之为『信念』。2. 你脑子里在想什么：『如果我坚持得更久，我早就买房子了』——它崩溃了；『我再坚持一下，它就会弹起来』——它流血了；『我卖得太早了，下次我就等着』——而这个循环就这样重复。核心成瘾循环：预感→触发→行动→悔恨→誓言→复发，和毒品一样，只是用图表。3. 那么如何系统地解决：你用的是成瘾者用来戒毒的同样经过验证的系统——十二步，全球最大的成瘾康复组织匿名戒酒会（AA）、匿名戒毒会（NA）和可卡因匿名会（CA）所用的框架，他们帮助全球数百万人摆脱了强迫性的自我毁灭；没有鼓舞人心的演讲，但这是一个极其简单、极其有效的框架，当你的大脑不灵时也能发挥作用。从第一步和第二步开始，仅此一项就能阻止你 80% 最糟糕的交易螺旋。第一步：承认你对自己的错误决定/成瘾无能为力——这不是什么属灵的虚假，是执行功能崩溃：你的前额叶皮层关闭，边缘脑接管；你知道这是个糟糕的交易，但你无法掌控，你运行的是生存脚本、不是策略；你扛单、你是 DCA、你移动止损，你不会成交，因为你的自尊心说『切割＝承认失败＝死亡』——这就是自我死亡的厌恶，和成瘾者说『我能掌控一切』的原因一样（剧透：你不需要/你不能）。第二步：接受理智无法拯救你，只有更高的力量才能恢复你的理智——你以为你可以通过分析来摆脱恐惧，你不能，这不是关于聪明，而是投降：你需要更高的力量，不一定是上帝；你需要屈服于一个在你无法胜任时代表你行动的框架；你需要制定一套策略并且坚持执行一段时间（至少持续几个月），不能切换，交易中没有调整；然后制定硬编码的规则，惩罚就是会让人受伤的——例如违反规则，给朋友发 1 万美元、做 50 个俯卧撑，或者在推特上发帖『我是个报复交易的笨蛋』。这只是 12 个步骤中的两个，但即使内化这两项，也能杀死你 80% 最糟糕的交易。4. 为什么有效：因为长期康复不是靠意志力，关键是保持意识——一个三个月后复发的成瘾者和一个保持清醒 30+ 年的成瘾者有什么区别？这位 30 年的幸存者每天都说『我得了一种永远无法治愈的疾病，我只能应付』，复发的那个说『我现在没事了，我已经康复了』；交易也是一样，一旦你觉得自己『掌握了它』，你已经开始输了。社会告诉交易者『你是天才、你是个杀手、你很有野心』——不，你只是嗨了。GN 并寻求帮助。",

              {
                id: "picklecat-survival-rules-ch1",
                title: "《无惧牛熊：加密生存法则》第一章：你的\"搞快钱\"思维，才是阻碍你赚大钱的罪魁祸首",
                date: "2026-01-27",
                type: "长推",
                summary: "Pickle Cat（泡菜猫）的长篇『加密生存法则』第一章。他自述 2013 年买入人生第一枚比特币、活到 2026 年经历十几年周期，见过市场把人创得死去活来的一万种方式，得出一条铁律：在这个圈子里『赢』的定义从不是你赚了多少钱——每个接触过这圈子的人都能至少赚过一次钱、成为短暂的『天才』；赢是你赚到了钱、且在多年后的今天还能守住这个钱，这不是『谁赚最多、谁翻倍最猛』的比赛，而是『谁能活到最后』的比赛，可大部分天才都成了燃料，能活到下一周期的人中能复利滚雪球的更是凤毛麟角。10/11 之后市场回到他熟悉的枯燥期，他又失去了很多以为能并肩作战多年的朋友，于是翻开这些年断断续续写下的反思、又找了几个依然活跃的老朋友聊了聊，整理出这篇文章，要回答：为什么有的人能在周期性的血海中存活、其他人只能铩羽而归？如何在熊市被折磨得痛不欲生时还能保持希望？你要怎么做才能成为那样的人？他引苏格拉底『唯一真正的智慧，就是知道自己一无所知』与桑塔亚那『不记得过去的人注定重蹈覆辙』，说恰恰是被人忽略的币圈发展史与本质，才是无惧牛熊的秘籍。全文三大部分：I. 让币圈脱离横盘的真正推手——人们追问市场为何停滞，答案千篇一律（新叙事没诞生、机构没进场、技术没爆发、怪做市商和 KOL、怪交易所项目搞砸），但这些从来不是终结寒冬的真正原因；他穿越足够多牛熊后看清的规律是：加密市场的再展雄风，从来不是因为它变得更像传统体系，而是因为它再次让人们想起旧体系令人窒息的七七八八；停滞本质上是协作失效——资本毫无兴致、情绪消耗殆尽、当前共识再也无法解释『我们为何要在乎这个圈子』三者同时失灵，价格疲软不是因为加密已死，而是没有新要素让新参与者形成合力。多数人以为下一轮由『更好更炸』的产品、功能或叙事触发，但那都是果不是因，真正的转折点在更深层的共识升级完成之后才显现；看不清这层逻辑，就会继续被市场噪音牵着走、成为最易收割的韭菜，总追逐下一个热点想当究极钻石手，最终入场太迟或买了空气币中的空气币。核心区分：共识绝不等同于叙事——叙事是众人共享的故事、共识是众人共同的行为，叙事用说的、共识用做的，事（叙事）吸引目光、共识留住人群，只有叙事而无行为是短期狂欢，只有行为而无叙事是台下演变，两者兼备真正的大周期才启动；每一轮把加密拖出寒冬的始终是同一件事：共识的进化，即人类找到新方式以加密货币为媒介、把某种抽象元素（信仰、判断力、身份认同等）金融化并围绕它大规模协作。快速过一遍加密简史会发现所有叙事的底层本质都是聚合：2017 年 ICO 聚合相信同一个故事的人（『我这有一份 PDF 和一个梦想，押一把不？』），IDO 把攒局接到 DEX、使融资变成无需许可的自由博弈仪式；2020 年 DeFi 之夏聚合的是金融劳作（成了永不歇业银行的后台员工：借贷、抵押、套利，夜以继日找 3000% 年化、每夜祈祷起床别跑路）；2021 年 NFT 聚合的是对共同文化、审美、理念共鸣的人（小图片是护照、数字化的自己人勋章、高级群聊与聚会的门票）；2024 年 Meme 时代聚合的是情绪、身份认同和圈内集体玩笑（买的不是白皮书，是『懂的都懂』、是币价跌 80% 时让你没那么孤独的社区）；如今预测市场聚合的是判断力、对未来的共同信念并实现无国界流动（以美国大选为例：非美国人没有投票权，但在预测市场可以为自己的认知下注）——加密货币不再仅仅搬运资金，它在重新分配『谁说了算』的权力；每次周期都有新维度被融入：金钱、信仰、金融劳作、文化、情绪、判断、下一个会是什么？每一次破圈本质都是用新方式把人聚集起来，带来的不只是更多用户、更是一个让人留下的新理由；重点从来不是代币本身，代币只是让大家围拢过来的话题，真正在系统里流动的是能承载越来越大规模原生共识的东西——说直白点，管道里流动的根本不是钱，而是我们这帮人正在学习如何在没有老板管着的情况下达成越来越大、越来越复杂的共识。他给出『三燃料模型』：流动性（宏观风险偏好、美元流动性、杠杆能力）如氧气、决定价格能移动多快；叙事吸引注意力、决定多少人看向这里；共识的底层构建（共同行为、重复动作、去中心化协作方式）影响持久性、决定价格不再给予回报时谁会真正留下——流动性可暂时推高价格、叙事可短暂引爆关注，唯有新的共识构建能赋予人们超越单纯买卖的共赢行动方式，这正是许多小牛回没能成为真牛回的原因：有流动性、编了不错的故事，但人们的实际共识毫无改变。辨别回光返照与真正的共识升级：不要先看价格、去看行为，真正的升级会改变人们聚在一起玩耍的方式，每次都先从行为出发而非价格；光看理念没用，得先复习加密史。他附三个拓展案例——案例 1：2017 年 ICO 的蓬勃发展 VS 早期试水：这是加密第一次搞明白如何在全球大规模协调人与资本，数十亿美元流向链上、不是投向成熟产品而是注入理念；此前 2013 年 Mastercoin、2014 年以太坊众筹等早期试水有趣但小众，早期玩法无非挖矿、交易、持有、用它买东西（如暗网），也有快速暴富的庞氏，但没有一种定义标准的方式让素不相识的人在链上为同一个梦想共同押注；2016 年 The DAO 是真正的顿悟时刻，证明素不相识的人仅凭代码就能汇集资金，但工具原始、技术脆弱、最后被黑客搞废，行为模式出现却不可持续；2017 年以太坊与成熟的 ERC-20 把代币发行变成量产流程，参与的底层逻辑革命了：融资全面上链成新常态、白皮书成了投资标的、用最小可行产品换来最小可行 PDF、Telegram 直接变成金融基础设施；这种趋势性行为让数百万人涌入、推动史诗级牛市，更重要的是永久重塑了加密的 DNA，泡沫破灭后也再未退回旧模式——任何人、任何地方都能为一个协议众筹的想法牢牢扎根；没错，大部分 ICO 是骗局或庞氏，2017 年之前有、2026 年现在也有，但人们协同工作和调度资金的方式已经永远改变，这就是共识升级。案例 2：2020 年 DeFi 之夏 VS 虚假的牛：这也是真正的共识升级，因为即使价格没有狂暴增长，人们也开始把加密资产当作金融工具使用，与 ICO 时代价格与行为互相喂养截然不同；2020 年之前除了 ICO 狂欢季，体验基本就是买入、持有、交易、然后祈祷（除非你是矿工或在做不可告人的事）；DeFi 之夏大伙形成了链上肌肉记忆：借贷（存进协议赚租金）、抵押借款（不卖资产获得购买力，如房抵贷）、流动性挖矿（每周把资金挪到收益最丰厚处左腾右挪）、做 LP（把筹码放桌上让别人交易、从手续费抽成）、循环抵押（抵押借出再抵押再借出、层叠杠杆与收益）、治理（真正参与协议规则投票而非只赌价格）；期间即使 ETH、BTC 横盘，生态也感觉是活的、活跃度不取决于价格直线拉升，它打破纯赌场思维、加密第一次像有生产力的金融系统而非投机玩具；复合词（$COMP）、Uniswap（$UNI）、Yearn（$YFI）、Aave（$AAVE）、曲线（$CRV）、Synthetix（$SNX）、MakerDAO（$MKR/$DAI）成了互联网的银行，连 SushiSwap 的吸血鬼攻击都意义重大——直接从 Uniswap 吸走流动性，证明激励机制真能像指挥军队一样调度资金。然后是虚假的复兴、回光返照：用食物命名的仿盘农场 Pasta、Spaghetti、Kimchi 没有带来任何新协调行为、大多转瞬即逝；到 2021 年 DeFi 仍有活力（dYdX、PancakeSwap 快速增长），但野蛮生长阶段结束、人群转向 NFT。站在 2026 年回看，2020 年才是链上经济真正诞生的时刻，现在做的几乎所有事（空投积分、追逐 TVL、Layer 2 激励）都沿用 2020 年那套玩法；DeFi 之夏后，一个新产品若不能给用户提供留在链上的实质理由就很难激起水花，激励能带动短期活跃，但没建立起持久社区习惯（新范式）的话，补贴发完那一刻项目就迅速沦为鬼城。案例 3：NFT 时代翻转社交习惯：2021 年是完美风暴（全球放水、机构入场、NFT 爆发、DeFi 增长、公链之战共振推向巅峰），本案例聚焦影响力最大的催化剂 NFT；如果说 DeFi 之夏是埋头钻研流动性曲线的极客时代，2021 年就是加密终于拥有人格的一年，不再纯为收益率内卷、转而追求氛围感、身份认同和归属感；数字物品第一次有了可验证的出处，你买的不只是图片、而是一张写着你是原主的数字收据、整条区块链是证人；社交脚本被改写：人们不再试图在计算上压过对方、而是在秀身份，头像变成护照，CryptoPunks 或 BAYC 成数字化圈层归属证明、进入全球精英圈层的入场券；门槛出现：钱包变成会员卡，没有对应资产就进不去私密 Discord、参加不了圈内派对、领不到专属空投；还有 IP 所有权：BAYC 把商用权给持有者、让所有权革命破圈，陌生人开始围绕自己的猿协调合作、开发衍生商品、音乐和街头服饰；最重要的是它吸引大量圈外人入场——不关心年化和清算机制的艺术家、游戏玩家、创作者突然找到拥有钱包的理由，加密不再只是金融、成了互联网原生的文化层。从共识习惯看：取代流动性池的是藏品系列，取代 TVL 的是地板价和社交资本，取代收益的是归属感。当然回光返照随之而来：模仿者浪潮（无聊猿模式被验证后一窝蜂涌现，有故事没灵魂，基本都是『无聊猿但主角是仓鼠』、承诺童话般路线图，大多变成有价格的空气）；刷单狂欢（LooksRare、X2Y2 把 DeFi 挖矿逻辑生搬到 NFT 搞交易挖矿，引来科学家自买自卖左手倒右手，账面交易量惊人、背地全是机器人对敲薅羊毛，真玩家早退群）；名人圈钱狂潮（几乎每个一二线明星都推系列，经纪人告诉他们这是新印钞机，背后没有真正共识或社区，比 TikTok 热点消失得还快）。教训：与 ICO、DeFi 一样 NFT 泡沫破裂了，但行为模式的残留是永久性的——加密成了互联网原生的文化层，不再问为什么要拥有一张 JPEG，而是理解这系列行为背后的意义：品牌转向数字护照与社群即服务（CaaS）、AI 饱和时代出处成为数字真实性的标准、社群优先的发布模式成了每个新消费初创公司的首选手册，协作习惯留存、我们学会归属于数字文化、永远不会倒退到只当个用户的时代。他说读到这里看完了三分之一，三个案例是教辨别真假共识升级；他本可再写几百页 Meme 与预测市场案例，但授人以鱼不如授人以渔，这部分留给读者自己复盘；失败的叙事与失败的共识升级同样值得钻研（如 2021–2022 Metaverse 1.0、2023–2024 SocialFi 1.0），它们只留下一波流残骸、未即刻重塑习惯，但不代表终结——真正的共识升级极少一蹴而就，正如 2013 年 Mastercoin 开启 ICO 先河却沉寂数年、直到 2017 年才爆发并大规模改变行业行为，早期的失败是认知的垫脚石；别因为凉了就视而不见，下一次升级也许全新、也可能是旧东西以新形式复兴，那时这份认知就是你的大机缘；磨炼投资眼光最好的方式是亲自下功夫调研分析验证，多问自己是否明白大众到底在做什么，观察不到行为变化就发觉不了浪潮变化。第一部分结尾是他自称的『韭菜自我保护 5 问』基础清单：1. 是否有圈外人入场——出现一批主要目的不是赚钱的参与者（创作者、建设者、寻求身份认同的人），如果房间里只有交易员、这个房间本质上就是空的（他自注：我也是交易员，光靠我们 PVP 玩不转）；2. 能否通过激励衰减测试——奖励枯竭或价格横盘时人们留不留，留下来说明习惯已养成，免费午餐一停就消失的只是一堆带价格标签的空气；3. 他们是在选择日常习惯而非持仓吗——新手只看 K 线、高手观察人们每天在做什么，围绕系统建立起日常习惯就是永久性升级；4. 是否存在行为>体验——真正的转变发生在工具还原始、分散、低效时，人们愿意忍受糟糕 UI 也要参与说明行为有效，等应用丝滑精致时你已经晚了；5.（最重要）是否存在用爱发电——当人们捍卫一个系统是因为它构成身份的一部分、而不只是怕亏钱，转变就彻底完成了。所以只盯价格、无限幻想在某价格猛猛抄底，很可能就是你永远卖飞大趋势、拿不住、总心态崩、有仓位就睡不着的理由：巨大阳线之所以出现，是因为行为模式在几个月前就已在变，价格是转变的结果、只是那个终于承认世界已经前进的滞后指标。II. 菜就多练，财富无法 1000x 就把认知先 10x——他先挡住读者的心声：『到底哪些玩意能涨 1000 倍？我该怎么早点发现猛猛买入？』实话说这里是现实世界、不是番茄爽文，这个问题价值连城；如果有人能自信地给你不知哪搞来的 5 步财富密码，他们要么想让你抬轿好浇给你、要么想让你花几万智商税买秘制小课堂；因为每个新周期都是一场全新的协调游戏，你不可能拿 2020 年 DeFi 之夏的剧本指望在 2024/2025 年选出爆拉的 Meme，就算今天是顶级 Meme 猎手也不能保证那套玩法让你在 2026 年预测市场大杀四方——路径依赖害了多少人（他调侃：凡事无绝对，只要你姓特朗普您说得对，毕竟都是能画 K 线的主儿）。没人能预测未来，但至少能打好地基、搭底层框架，让你在机会来临时比别人快 10 倍盘透它、学会它；有框架不能保证比上轮赚更多，但能让你相对只来赌博的新手获得巨大先发优势。框架三部分：加密周期底层逻辑＋加密知识结构＋价值锚定系统，第一部分已讲完，第二部分讲学什么、怎么学；一千个人有一千个哈姆雷特、没有绝对正确，他给两个个人建议。建议 1：猛猛成为链上柯南——必备基础技能清单全部可 100% 在网上免费学到，不需要付费课程或大师指点，你唯一需要支付的是决心和时间：第一，提高辨别组织性狙击事件的概率、否则永远逃不出当接盘侠的命运，学会熟练查看钱包历史、持仓分布、捆绑交易、资金来源与流向，嗅出不对劲的链上猫腻；第二，搞懂市场机制、尽可能判断潜在供应冲击并避开剧烈插针清算，要知道去哪查并搞懂订单簿深度、点差、交易所净流入/流出、代币解锁与解锁周期表、Mcap/TVL 比率、未平仓量、资金费率、宏观资金流向等；第三，不想在黑暗森林被生吞活剥起码得知道 MEV 如何运作，不然哪天被三明治攻击都不知道（他的血泪教训）；想学更深、跑得更快，还得学会最大程度识别虚假交易/刷量/对敲、套利刷分、低流通/高 FDV 陷阱，撸空投要明白反女巫机制；还要把部分信息流工作自动化（数据异动警报、新闻筛选、叙事过滤、噪音削减），现在有 vibe coding 后基础门槛降低、谁都能学会，2026 年他认识的几乎所有人（包括没 CS 背景的）都在自制工具过滤垃圾信息及寻找机会，还全靠手动找信息可能就是你总慢人一步的原因；不投入决心时间努力打基础就是选择困难模式，往小了说总比别人慢一步或错过机会，往大了说被诈骗、被卷款、被榨干，直到破防开始学习或认命退圈。他自述也是这么一路走过、各种雷都踩过：被陌生人及朋友骗、栽在各种庞氏、千奇百怪的内幕浇给、后门合约、热钱包被盗、场外交易诈骗、甚至被社会工程学杀过，还不算被爆仓的 3 次。除偏技术类外，他还整理了社会柯南层面的防坑技巧：项目官号是否改过 10 次以上名字、以前的马甲是否跟跑路垃圾项目有关（有很多工具能查账号更名史）；投资前核查团队是否存在、创始人和核心成员是否有 X、领英、GitHub；声称在知名公司工作过或名校毕业要核实，伪造的斯坦福、伯克利学历及虚假的前 Meta、谷歌、摩根士丹利履历比想象中常见得多；号称某 VC 投了、由谁孵化、与谁合作的说法也一样，有些知名投资者或许从未真给钱、有些合作伙伴实际只是间接顾问却允许项目方使用 logo，这种事频率远超预期、他亲身当过受害者；AI 泛滥的如今虚假互动越来越频繁且只会越来越难辨别，要能看出粉丝数与互动量比例不正常、识别 Discord、Telegram、X 上的机器人回复或 AI 生成的闲聊；以前做不到这些，起码现在知道从哪练起。建议 2：遁入尘世诚结善缘——说白了就是多认识人，与金融圈、科技圈、任何圈一样，人脉才是自己最大的依仗；他可以写个投研项目要看的 50 个东西，但那终究是毫无价值的废话，因为真正的核心信息或 alpha 在具有第一手优势时永远不会被公开分享，等一个项目被你信息流里有名望的声音大肆鼓吹时你或许还能赚钱，但那已不是你来加密世界追寻的改变人生的 1000 倍收益，最佳入场窗口早就被焊死了；这正是每个周期大多数满怀期待淘金的新人最终成流动性退圈的原因——他们拿到的信息是经过一层又一层私人圈子过滤后的滞后再滞后的消息。所以若还没有一条或多条靠谱的内幕线，仓位管理就是唯一的安全网，一定要把大部分加密资产配置在长线标的上：长线对信息差要求没那么高、没有短线令人崩溃的时效压力，能让你有喘息余地研究公开数据、不需要争做第一个发现规律的人，只需一个项目活过哪怕 1.5 个周期、无论何时入场都大概率吃到好几波利润。同时长远目标是停止做旁观者、开始成为参与者，这需要手里有筹码：除家人外世界按利益结盟，你钦佩的人不会和无法提供对等价值的人交换一手信息，你需要成为某个有价值的人或拥有某种有价值的东西来交换（专业知识、实地调研、资金、人脉），没人是万事通、正因如此可以抓住机会；最好的方法就是真诚热情地钻研进一个生态：先在你看好领域的一个项目里找份工作（开发者、运营、商务拓展都行，入门好说话），工作是建立声誉和结识目标人群最快的方式；仅有一份入门级 Web3 工作不会立刻给你想要的一切，但是个好开始。若缺乏经验找不到靠谱加密工作：2026 年的加密行业仍不像传统金融或科技大厂那样是职场沙漠，不需要精英学位和两叠精英实习、过五关斩六将过七轮面试，你的链上经历就是简历，若已投入大量时间去实验、去梭哈、实实在在做事，其实已比大多数转行来的企业人士拥有更多相关经验。不想打工还有两个办法（依然要付出巨大努力）：若超级聪明且足够幸运在链上打出漂亮成绩、且没准备退休，可以把钱包地址与推特账户绑定，你都不需要主动社交、同好会不请自来；在 X 上建立个人品牌，但过程艰辛冷暖自知、并非普适建议。结尾：世界上没有免费午餐、也没有靠谱捷径，100% 的努力不一定换来 100% 成功，但 100% 的不努力一定带来 100% 失败（除非你的名字叫 Barron Trump）。III. 如何做到坚持就是胜利——基于个人经历，能在沟槽周期里不裸泳的人都有两个特质：有独立于价格的坚强信念、建立了多维度的价值锚定系统。先明确：信念（Conviction）不等于执迷不悟或因某某大佬说了什么的盲信，不是今后无论发生什么打死也不卖；真正的信念是结构性的、结构性本身包含灵活性，你可以拥有巨大信念、同时分批止盈或调整仓位比例，关键区别在你是否总能、且始终如一地回到牌桌上来——你不会因为音乐停止就离开，你出现在这里的理由从来不是红红绿绿的 K 线、而是那个底层的为什么；能经周期屹立不倒的人从不问今天是涨是跌，他们问的是：即便价格未来几年持续偏离我的观点，我认可这事的本身逻辑还成立吗？这个思维差异导致结果天差地别；赚快钱的思维不仅掏空钱包，更腐蚀信念、摧毁信仰体系，而再度建立信仰可比重建资本困难得多。他的多维度价值锚定系统四层：第一层概念锚定（Concept）——别再只盯 K 线跳舞、开始关注核心原则，问自己是什么让这个东西值得持有、即便价格跌穿屏幕；回想最近交易的 10 个代币、快进两年，还有多少会依然存在、多少还会真的重要的，若审视一个标的时无法在不提及社区或狂暴大牛上月球的情况下解释清它为何值得投入长期资本，你拥有的就不是信念、只是一个仓位。第二层时间维度（Time）——绝大部分人行为逻辑混乱、决策易被群体情绪操纵（他举例：今天在绝密电报频道跟风买 4 个据说一定上月球的 Meme，明天在 Polymarket 押注某些项目因为推特大佬喊财富密码，突然消失一阵，又某天私信打听某个快上所的标的，却不知怎么买了个连用途都不知道的隐私板块标的，又过几天在群里喊牛回速归、大饼蓄能完毕梭哈无脑做多 BTC 只因新闻头条写下个月涨到 20 万美元——这不是策略、是把钱交到别人手里，丢圣杯说不定胜率都更高；他见过这样赚钱的，但真没见过这类人在两月后还能守住钱的，他们唯一留下的是曾经的辉煌和 +99999% 的心理阴影）；这类人真正的问题是容易被噪音干扰失去主见、同时开辟多个超过能力与认知圈的战场；短期投机、中期布局、长期投资各自需要完全不同的行为模式，能跨越周期的人清楚知道每个仓位属于哪个时间维度、绝不让情绪跨维度传染，不会因短期价格噪音否定长期信念、也不会用长期叙事为冲动的短线操作找借口；从日内转向波段常见的自我毁灭错误：自称长期投资者但 80% 时间仍在追一次性新闻头条；看到本该在风险可控范围内的微不足道 3% 回调依然恐慌；最糟的是仍用抢短线赚快钱的心态配置仓位和评估风险、导致又卖飞大趋势。时间锚定的办法是强迫自己在点击买入前回答一个极度令人不适的问题：得要多久我才愿意承认自己错了？第三层行为层面（Behavior）——不能只在顺的时候说自己有信仰，账户一片血红、脑海里的声音疯狂尖叫让你做点什么时才是真考验；要建立一套用来预测自己而非预测行情的自问自答框架，每笔交易进场前过一遍清单，确保未来的你不会给现在的你使绊子：价格下跌 x% 时我是否已有计划、是否清楚自己会按兵不动、减仓还是退出；我是不是屁股决定脑袋；回撤期间我是在客观重新评估投资逻辑、还是潜意识搜集信息只为给恐慌性抛售找理由；我是不是在频繁变更目标点位；价格上涨 x% 时我是否会因感觉来了变得贪婪、不断推高止盈目标；我能否在不使用热度一词的情况下解释持有的理由，除了看情绪看热度能不能清清楚楚讲出背后理由；这是信念还是沉没成本，仓位横盘超预期时持有是因为逻辑依然成立还是不愿承认错了；我违反规则后的认错时间有多长，违反自己的交易规则时是立刻察觉并行动还是等账户亏麻才反应；我是否容易进行复仇交易，一笔亏损后是否立刻气血上头跳进另一笔只为干回来。这些问题的目的不是猜 K 线怎么走，而是勾勒当你顶着巨大心理压力时未来的你是否会背叛现在的你；行为锚点本质是对压力的预处理，在冷静时定好动作、防止绝望时乱搞——毕竟你若没想好用啥计划玩交易，最终交易就会开始玩你。第四层信仰维度（Belief）——最快消失的人往往是牛市里嗓门最大的那群（现在是买 XX 最后上车机会、这次之后不会再看到十万以下的比特币、听我的吃麻吃炸吃飞起来、不买 XX 就是和未来对着干），价格一反转便烟消云散、信仰仿佛从未存在；一夜暴富心态不仅通过频繁交易毁掉组合、更腐蚀信仰体系，而破碎的信仰体系远比银行账户更难重建；他引查理·芒格『快钱总是会引来可悲的过度行为，这是天性，就像非洲的动物以腐尸为食一样』；可悲的是大多数人会在狂欢顶峰耗尽资本，等真正的机会（真正的熊市）来临时已没有子弹；这是天大的玩笑：将人们带入加密世界的心态、对一夜暴富的渴望，恰恰是扼杀他们获得财富的元凶；大多数人意识不到自己失去了什么，直到多年后比特币再次成倍上涨才拍大腿问当时怎么熬不过那点挫折、早知道就拿住了。这就是为什么信仰是最重要的一层：它是需要多年才能形成的信条。测试信念是否坚定：若此刻有人激烈质疑你的立场，你能冷静为其辩护、坦然面对尖锐问题而不回避吗？信仰应极度主观、独一无二：对一些人是加密朋克精神（Cypherpunk）——对管制和中心化控制的彻底反叛，加密不只是投资、更是从破碎系统退出的曙光；对另一些人是货币史的另一次迭代——看到法币贬值和金融掠夺的周期循环，认识到加密是对抗每百年都以相似方式崩溃的传统体系的唯一对冲；对某些信仰者是主权、中立性或生存权。你必须找到自己的为什么、而非租用某个大 V 的理念；他分享自己的：去年他只有 2000 粉丝、没人在乎他说什么时写过一篇帖子回答『为什么经历了所有崩盘和归零之后我仍然购买比特币』，他称之为『上帝与人类签订的第四份契约』——人类前三大契约都有致命缺陷：它们从来不是为所有人准备的。第一份《旧约》由血缘绑定、归属权在出生前决定，不属于被选中的血脉便从未有资格；第二份《新约》谈论对所有人的爱与救赎，但历史揭示言语试图掩盖的真相：若你是 17 世纪一个贫穷的亚洲农民、这辈子没机会踏进大教堂半步，帝国会把你拦在门口，唯有种族、权力和等级决定谁值得被救赎；第三份《独立宣言》是现代世界的诞生、承诺自由平等机会，前提却是出生在正确的土地、持有正确的护照、身处正确的体系，从某种意义上迁徙自由存在，但对大多数人代价太高、概率渺茫，大多数人甚至从未到达起跑线、得用一生证明自己配得上（用金钱、教育、服从或运气，一层层乞求系统让他们归属）。而如今第四份契约出现了：《比特币》——人类历史上第一个不问你是谁的系统：不在乎你的种族、国籍、语言、出生地，这里没有神父、没有政体、没有国界、不需要许可，只要你和一把私钥；你不需要被选中、不需要有关系、不需要被批准、不需要向比特币证明自己，你要么理解它、要么不理解；这个体系不承诺舒适、安全或必然成功，它只提供一件人类从未真正拥有过的东西：在同一时间让所有人面对同样的规则、拥有同样的准入权。对他来说这不是投资论点、不是一笔交易、也不是赌博，这个信念是他能静坐穿越市场沉浮、忍受多年寂静、质疑、嘲笑和绝望并依然持有的唯一原因。结尾：读到这里恭喜你拿到幸存者的蓝图——学会识别共识升级、学会用调查员工具包提高早期入场胜率、也知道构建信仰和保持定力需要哪些要素；但他诚实提醒：道法自然，如来，无论工具再高端，若无法控制使用工具的人、永远是力大砖飞；这一切源自他在市场沉浮 13 年的无数错误、教训与刻骨铭心的伤疤，也源于和同样侥幸存活的朋友们深夜的一次次对话；翻看凌乱笔记他意识到素材起码能写一本书、每章以不同角度深入探讨加密，然而教训无法在一夜之间让你神功大成、就像快钱思维不能真正让你富有；他目睹每个周期天才的陨落，亏钱不是因为他们不聪明或棋差一着，而是因为都长着一颗只想搞快钱的脑子、还端着一副狂妄但一碰就碎的自尊；与此同时那些在 2026 年仍在获利、保住收益并全身而退的人共享一个认知：代币本身从来不是重点，重点是我们正在构建的这个主权体系、以及归属于它所需的那份个人纪律。加密是这个星球上最残酷、最诚实的老师，它会逼出你内心的魔鬼、找到你最薄弱的特质（贪婪、急躁或懒惰）、然后收取一笔巨额学费——他的那份他想已经全额付清了，希望这篇文章能让你不必付出像他一样多的代价；若你真的从头读到尾（而非让 AI 帮你总结），他相信你有潜力成为征服多个周期的幸存者中的一员、正是能掌握第二部分技能清单的人；他真诚希望你能成为他新的老朋友之一，在下个、下下个、未来无数个周期里一起成长为战友、一起见证比特币彻底颠覆世界；对长期读者他致谢：正是你们的善意和支持让他决定回忆过往、分享经历。加密世界或许时常令人糟心，但依然值得热爱、值得为之建设。『那么，我先走一步，我们下一次共识升级时再见。』落款——泡菜猫。",

                  "## I. 让币圈脱离横盘的真正推手\n\n" +
                  "每当人们追问为何加密市场陷入停滞，答案几乎千篇一律：\n新叙事还没诞生！\n机构尚未全面进场！\n技术革命还没爆发！\n都怪那些割人做市商和KOL！\n都是因为某某与某某交易所/项目/公司搞砸了！\n这些因素确实重要，但解决它们从来不是终结加密寒冬的真正原因。\n如果你穿越过足够多的牛熊，便会看清一个清晰的规律：\n加密市场的再展雄风，从来不是因为它变得更像传统体系，而是因为它再次让人们想起——旧体系令人窒息的七七八八。\n加密的停滞，并非是因为缺乏创新，也不仅是流动性问题。\n本质上是协作失效——更准确地说，当以下三者同时失灵时，停滞便发生了：\n资本毫无兴致\n情绪消耗殆尽\n当前共识再也无法解释“我们为何要在乎这个圈子”\n在这样的局面下，价格疲软并非因为加密“已死”，而是因为没有新的要素能让新参与者形成合力。\n这正是多数人困惑的根源。\n他们总认为下一轮周期将由某个“更好、更炸”的产品、功能或新叙事触发。但这些都只是果，而非因。真正的转折点，在更深层的共识升级完成之后才会显现。\n若看不清这层逻辑，你只会继续被市场噪音牵着鼻子走，成为那些兜持货盘的狗庄带单中最易收割的韭菜。\n这就是为什么总有人不断追逐“下一个热点”，试图去当究极钻石手，最终却总发现自己入场太迟，或者更糟——买了空气币中的空气币。\n如果你想培养真正的投资嗅觉，那种能让你早期发现机会，而不是在每个项目发币后一周都被浇给到自闭的韭菜命运，你首先需要学会鉴别：\n共识与叙事的区别\n事实就是，每一轮将加密世界拖出寒冬的，始终是同一件事：共识的进化。\n“共识”，在这个圈子里，是指人类找到了一种新的方式，能以加密货币为媒介，将某种“抽象元素”（比如信仰、判断力、身份认同等）进行金融化，并围绕它进行大规模协作。\n请务必注意：共识绝不等同于叙事。而多数人的认知偏差，正是从这里开始的。\n叙事，是一个众人共享的故事。\n共识，是众人共同的行为。\n叙事用说的，共识用做的。\n事吸引目光，共识留住人群。\n只有叙事而无行为 → 短期狂欢\n只有行为而无叙事 → 台下演变\n两者兼备之时 → 真正的大周期才会启动\n要弄懂这里面的门道，你需要将眼光放的长远，去从更加宏达的视角切入。\n当你快速过一遍加密简史，你就会发现:\n所有叙事的底层，本质都是聚合——而这就是共识。\n2017年，ICO 是那个时代最顶级的“攒局”神技。它本质上是一种协调机制，它把相信同一个故事的人聚集起来，把他们的资金和信仰汇聚到同一个地方。\n基本就是在说：“我这有一份 PDF 和一个梦想，押一把不？”\n后来的 IDO 则把这种“攒局”接去了去中心化交易所，使融资变成一场无需许可的自由博弈“仪式”。\n接着是2020年 DeFi之夏，它所聚合的是“金融劳作”。我们成了那家永不歇业银行的后台员工：借贷、抵押、套利，夜以继日地寻找那3000%的年化，每夜都在祈祷起床时它别跑路。\n再接着是2021年 NFT，它所聚合的，不再只是资本，更是对某种共同文化、审美或理念产生共鸣的人。当时所有人都在问：“等等，我为什么要买一张图片？” “那哪只是图片啊，那可是文化。”\n大家都在寻找属于自己的“部落”，你的小图片就是你的护照，一个数字化的“自己人”勋章，它就是你进入高级群聊和高端聚会的门票。\n到了2024年 Meme币 时代，这一趋势已无法忽视。此时，人们几乎不再关心技术。它真正在聚合的，是情绪、身份认同和圈内的集体玩笑。\n你买的已经不是白皮书了。你买的是那句 “懂的都懂，而且你明白我为何在笑（或哭）嘿嘿。” 你买的是个当币价跌80%时，能让你觉得没那么孤独的“社区”。\n到如今，我们迎来了预测市场。它聚合的不再是情绪，而是判断力，是对未来的共同信念。并且，这些信念真正实现了无国界的流动。\n以美国总统大选为例，全世界的焦点事件。但如果你不是美国人，你就没有投票权。而在预测市场中，虽说你依然无法投票，但你却可以为你的认知下注。这时，真正的转变就显而易见了。\n加密货币不再仅仅是在搬运资金，它在重新分配“谁说了算”的权力。\n随着每次周期都会有新的维度被融入这个大系统中：金钱、信仰、金融劳作、文化、情绪、判断、____？下一个又会是什么呢？\n你会发现，每一次加密领域的破圈，本质上都是用一种新方式把人聚集起来。每个阶段带来的不只是更多用户，更是一个让人留下的新理由——这才是关键所在。\n重点从来不是代币本身，代币只是个让大家围拢过来的话题，好让彼此能一起玩。真正在这个系统里流动的，是那些能承载越来越大规模原生共识的东西。\n说直白点：在那管道里流动的其实根本不是“钱”。而是我们这帮人，正在学习如何在没有老板管着的情况下，达成越来越大、越来越复杂的共识。\n如果想更透彻地理解这一点，不妨看看下面这个简单的「三燃料模型」：\n流动性（宏观风险偏好、美元流动性、杠杆能力等）如同注入市场的氧气，它决定了价格能移动多快。\n叙事（人们为何在乎、如何被解释、共同的语言）吸引注意力，它决定了有多少人会看向这里。\n共识的底层构建（共同行为、重复动作、去中心化的协作方式）影响持久性，它决定了当价格不再给予回报时，谁会真正留下。\n流动性或许可以暂时推高价格，叙事或许可以短暂引爆关注，但唯有新的共识构建，才能赋予人们超越单纯买卖行为的共赢行动方式。\n这正是许多所谓加密小牛回往往没能成为真正的牛回的原因：它们拥有流动性，也编织了不错的故事，但人们的实际共识却毫无改变。\n那么，如何辨别“回光返照”与真正的“共识升级”？\n不要先看价格——去看行为。真正的共识升级，往往会在时间长河中显现出相似的信号，它会改变我们这帮人聚在一起“玩耍”的方式。\n每次都是先从行为出发，而非价格。\n如果你想自己学会辨别，光看理念没用，得先复习遍加密史，从中学习并总结，才有概率在下一个共识升级时发现重点。\n下面有4个部分，其中是3个我整理的拓展案例，最后是一份基础清单，可用来识别下一次共识升级是否正在来临，以及如何判断叙事导致的行为会不会真正留存。\n\n" +
                  "## 拓展案例1：2017年 ICO 的蓬勃发展 VS 早期试水\n\n" +
                  "ICO狂潮时期（2017年中 - 2018 年中）的BTC与ETH价格\n这是加密世界第一次搞明白如何在全球范围内大规模地协调人与资本。数十亿美元流向链上，不是投向成熟的产品，而是注入理念。\n在此之前，当然有过早期试水。例如2013年的Mastercoin，2014年以太坊自己的众筹等。这些尝试很有趣，但始终小众。它们尚未创造出一种能将所有人吸入同一轨道、全球共享的行为模式。\n在加密的早期岁月里，玩法其实很简单：挖矿，交易，持有，用它买东西（比如在暗网上）。\n当然，当时也有不少“快速暴富”的庞氏骗局，但那时候我们并没有定义标准的方式来让一群素不相识的人在链上为同一个梦想共同押注。\n2016年的 The DAO 是加密真正的“顿悟”时刻。它证明了一群素不相识的人，仅凭代码就能汇集资金。但说实话……当时的工具原始，技术脆弱，最后还被黑客搞废了。行为模式出现了，但并不可持续。\n随后2017年到来，一切都变得可“量产”了。\n以太坊和（此时更成熟的）ERC-20标准将代币发行变成了量产流程。突然间，参与加密世界的“底层逻辑”发生了一场革命:\n融资活动全面上链，成为新常态。\n白皮书成了“投资标的”。\n我们用“最小可行产品”换来了“最小可行PDF”。\nTelegram直接变成了金融基础设施。\n这种全新的“趋势性”行为让数百万人涌入，并推动了一场史诗级牛市。但更重要的是，它永久重塑了加密世界的DNA。\n即使泡沫破灭后，我们也再未退回“旧模式”。任何人、在任何地方都能为一个协议众筹——这个想法已经牢牢扎根。\n没错，那时候大部分 ICO 都是彻头彻尾的骗局或庞氏。这种脏事儿2017年之前有，2026年现在也还有。但人们协同工作和调度资金的方式，已经永远改变了，这就是所谓的“共识升级”。\n\n" +
                  "## 拓展案例2：2020年DeFi之夏 VS 虚假的牛\n\n" +
                  "DeFi Summer时期（2020年6月 - 2020年9月）的BTC与ETH价格\n这个时代也是一个真正的“共识升级”，因为即使价格没有狂暴增长，人们也开始将加密资产当作“金融工具”来使用。这与ICO时代截然不同——那时价格上涨与用户行为是互相喂养的共生关系。\n2020年之前，除了ICO狂欢季，加密世界的体验基本就是“买入、持有、交易、然后祈祷”。\n（嗯，除非你是矿工......或者在做一些不可告人的事 👀 ：）\n但现在，大伙逐渐形成了链上肌肉记忆，永远地改变了这个行业。我们学会了：\n借贷： 把你的加密资产存进协议，就能赚取“租金”。\n抵押借款： 不卖掉你的加密资产也能获得购买力，就像用房子抵押贷款。\n流动性挖矿： 每周把资金挪到收益最丰厚的地方，资金左腾右挪。\n做LP： 把你的筹码放在桌上让别人交易，然后从手续费中抽成。\n循环抵押：抵押、借出、再抵押、再借出，把杠杆和收益层叠加。\n治理： 真正参与协议规则的投票，而不仅仅是赌代币的价格。\n在 DeFi之夏 期间，即便ETH和BTC横盘震荡，整个生态也感觉是“活的”，活跃度并不取决于价格的直线拉升。\n它打破了“纯赌场”的思维定式，因为加密世界第一次感觉像一个有生产力的金融系统，而不再只是投机玩具。\n复合词（$COMP）、Uniswap （$UNI）、Yearn Finance （$YFI）、Aave （$AAVE）、曲线（$CRV）、Synthetix （$SNX） 和 MakerDAO （$MKR/$DAI） 等DeFi项目，成为了“互联网的银行”。\n即使是像 SushiSwap 这样疯狂的实验也意义重大。它的“吸血鬼攻击”直接从Uniswap吸走了流动性，证明了激励机制真的可以像指挥军队一样调度资金。\n然后……随之而来的是虚假的复兴，虚假的牛市，“回光返照”。\n比如那些用食物命名的仿盘农场——Pasta、Spaghetti、Kimchi。它们没有带来任何新的协调行为，大多数都像出现时一样转瞬即逝。\n到了2021年，DeFi 仍然充满活力（dYdX、PancakeSwap等项目在快速增长），但野蛮生长的阶段已经结束，人群早已转向下一个闪亮的叙事（NFT）。\n站在今天（2026年）的视角回看，你会发现2020年才是“链上经济”真正诞生的时刻。我们现在做的几乎所有事情（从空投积分、追逐TVL到Layer 2激励活动等）都沿用了2020年的那套玩法。\n在 DeFi之夏 后，如果一个新产品不能给用户提供一个“留在链上”的实质性理由，它就很难再激起什么水花了。\n激励确实能带动短期活跃度，但如果这些奖励没能建立起一种持久的社区习惯（一种新的范式），那么当补贴发完的那一刻，这个项目就会迅速沦为一座鬼城。\n\n" +
                  "## 拓展案例3：NFT时代翻转社交习惯\n\n" +
                  "NFT狂潮期间（2021年初 - 2022年中）的BTC和ETH价格。2021年是一场“完美风暴”：全球放水与宏观流动性环境、机构入场、NFT 爆发、DeFi 增长、公链之战等等在同一时间共振，将市场推向巅峰。本案例研究将重点关注 NFT——它是该周期中影响力最大的核心催化剂之一。\n如果说 DeFi之夏 是大家埋头钻研流动性曲线的极客时代，那么2021年就是加密世界终于拥有了“人格”的一年。我们不再纯为了收益率去内卷，开始转而追求氛围感、身份认同和归属感。\n数字物品第一次不再是可随意复制粘贴的“东西”。它们有了可验证的出处。你不仅仅是在“买一张图片”，而是一张写着“你是原主”的数字收据，而整条区块链都是你的证人。\n这彻底改写了社交脚本。人们不再试图在计算上压过对方，而是在秀身份。\n如今，头像变成了护照。拥有一个加密朋克（CryptoPunks）或一个无聊猿（BAYC）成为了一种数字化的“圈层归属证明”。你的头像不再是自家的猫，而是你进入“全球精英圈层”的入场券。\n这时，门槛也出现了。你的钱包变成了你的会员卡。如果你没有对应的资产，你就进不去那些私密 Discord 频道，参加不了圈内派对，也领不到专属的空投。\n还有IP所有权。BAYC 把商用权给了持有者并让“所有权革命”成功破圈了。突然间，陌生人们开始围绕他们的“猿”协调合作，开发衍生商品、音乐和街头服饰。\n最重要的是，它吸引了大量“圈外人”入场。那些不关心年化收益率或清算机制的艺术家、游戏玩家和创作者们，突然找到了拥有一个钱包的理由。\n加密不再只是金融了。它成了互联网原生的文化层。\n从共识习惯的维度看：\n取代流动性池的，是藏品系列。\n取代总锁仓价值的，是地板价和社交资本。\n取代收益的，是归属感。\n当然，“回光返照”也随之而来……\n首先，我们迎来了 “模仿者”浪潮。\n一旦“无聊猿”的模式被验证成功，模仿者便一窝蜂地涌现。它们有故事，但毫无灵魂。无数外观相似的藏品系列涌现，基本上都是“无聊猿，但主角是仓鼠”，并承诺着童话般的路线发展图。其中大多数变成了空气，或者说，有价格的空气。\n接着是 “刷单”狂欢。\n像 LooksRare 和 X2Y2 这种平台，试图把“DeFi 挖矿”那套逻辑生搬硬套到NFT上，搞所谓的“交易挖矿”。结果就是引来了一帮“科学家”自买自卖、左手倒右手。账面上交易量惊人，看起来像行情回来了，其实背地里全是机器人在对敲薅羊毛，真正的玩家早退群了。\n最后，还有 “名人圈钱”狂潮。\n几乎每个一二线明星都推出过一个系列，因为他们的经纪人告诉他们这是台“新的印钞机”。由于背后没有真正的共识或社区，这些项目比TikTok上的热点消失得还快。\n那么，这里面的教训是什么？\n就像 ICO 和 DeFi之夏 的时代一样，NFT的泡沫破裂了。但这个时代中行为模式的残留是永久性的，它持续了足够长的时间，永久地改变了这个行业。\n加密不再只是一个数字银行，它成了互联网原生的文化层。我们不再问“为什么要拥有一张JPEG？”，而是开始理解这一系列行为背后意味着什么。\n例如：\n品牌开始转向 “数字护照”和“社群即服务”（CaaS）\n在这个 AI 饱和的时代里，出处成为了数字真实性的标准\n社群优先的发布模式，现在成了每个新消费初创公司的首选手册\n协作的习惯留存了下来，以及我们学会了归属于数字文化，并且永远也不会倒退到那个只当个“用户”的时代了。\n想要磨炼“投资眼光”？你能怎么做？\n读到现在大家已经看完了本文章三分之一的内容，上面我给出了三个详细的案例来展现如何辨别虚假的共识升级（“回光返照”）与真正的升级。\n毫不夸张地说，我可以洋洋洒洒再写几百页关于Meme币与预测市场的案例分析，但是授人以鱼不如授人以渔，所以我把这部分的分析空出来给你们自己去复盘体会了。\n还有，失败的叙事、失败的“共识升级”也值得钻研，例如2021-2022 Metaverse 1.0、2023-2024 SocialFi 1.0等。虽然只留下了“一波流”的残骸，并未即刻重塑行为习惯，但这并不代表它们的终结。真正的“共识升级”极少一蹴而就。正如 2013年 Mastercoin 开启了 ICO 先河，却沉寂数年，直到 2017年才真正爆发并大规模改变行业行为。早期的失败是认知的垫脚石。\n别因为“凉了”就视而不见。下一次“共识升级”也许是全新的东西，但也可能是曾经失败过的“旧东西”以“某种新形式”的复兴，当这样的事发生的时候，这份认知将会是你的大机缘。\n想要磨炼“投资眼光”的最好方式便是亲自下实际功夫去调研分析验证。\n多问问自己是否明白大众到底在做什么，如果你无法观察到这之中的行为变化，那么你就无法发觉浪潮的变化。\n在第一部分结束之前，我还准备了个基础清单，可用来识别下一次共识升级是否正在来临。我称之为 “韭菜自我保护5问”：\n1. 是否有“圈外人”入场？\n出现了一批主要目的不是赚钱的参与者，你看到的人不再只是为了炒币而来。他们是创作者、建设者，或是寻求身份认同的人。如果房间里只有交易员，那这个房间本质上就是空的。\n（如果你是个交易员并且正在读这段——嗯，我也是个交易员。你我都明白，要让这场游戏玩得转，光靠我们PVP是不够的）\n2. 它能否通过“激励衰减”测试？\n观察当奖励枯竭或价格横盘时会发生什么。如果人们留下来，说明一种习惯已经养成。如果“免费午餐”一停他们就消失，那你面对的只是一堆带价格标签的空气。\n3. 他们是在选择“日常习惯”而非“持仓”吗？\n新手只会看k线，而高手观察人们每天都在做什么。如果他们围绕这个系统建立起了日常习惯，那这就是一个永久性升级。\n4. 是否存在“行为>体验”的现象？\n真正的转变发生在工具还很原始、分散、低效的时候。如果人们愿意忍受糟糕的用户界面也要参与，那么这种行为就是“有效”的。等到应用变得丝滑通畅精致时，你已经晚了。\n5. （最重要的一点！！）是否存在“用爱发电”？\n这一点很关键。当人们开始捍卫一个系统，是因为它构成了他们身份的一部分，而不仅仅是因为他们会亏钱时，转变就彻底完成了。\n所以，你若只盯着价格，无限幻想自己于某某价格猛猛抄底的想法很可能就是你导致你永远“卖飞大趋势”、“拿不住”、“总心态崩”、“有仓位就睡不着”的理由。巨大阳线之所以出现，是因为行为模式在几个月前就已经在变了。\n价格是这种转变的结果；价格，只是那个终于承认世界已经前进的滞后指标。\n\n" +

                  "所以说，到底哪些玩意能涨1000倍啊？ 更重要的是，我该怎么早点发现这些玩意才好猛猛买入啊？”\n实话说，这里是现实世界，不是番茄爽文，光是这个问题就价值连城。\n如果有人能自信到看着你的眼睛，给你个不知从哪里搞来的“5步财富密码”，那他们要么是想让你给他们抬轿子好浇给你，或是想让你花几万智商税去买他们的“秘制小课堂”。\n为什么这么说？因为每一个新的周期，都是一场全新的协调游戏。\n你不可能拿着2020年 DeFi之夏 的剧本，就指望用这套秘籍帮你在2024/2025年选出哪些 Meme币 会爆拉。就算你今天是顶级 Meme猎手，也不能保证你那套玩法能让你在2026年预测市场大杀四方。\n“路径依赖”，这害了多少人啊。\n（不过凡事并无绝对，只要你姓特朗普，那么...您说得对，毕竟都是能画K线的主儿了。恭喜你在两个领域都是冠绝一世了 😅)\n没人能预测未来，但最起码我们能给自己打好地基、搭建一个底层框架，让你在真正机会来临时，能比别人快10倍盘透它、学会它。\n有自己的框架不能保证你一定比上轮赚更多，但它能让你相对于那些只是来赌博的新手，获得巨大的先发优势。\n框架分三部分：加密周期底层逻辑 + 加密知识结构 + 价值锚定系统。\n第一部分已讲完，现在讲第二部分，也就是“我到底该学些啥，有什么学习办法？”\n可一千个人有一千个哈姆雷特，没有所谓“绝对的正确”。\n所以下方我放了两个我的个人建议。\n\n" +

                  "## III. 如何做到坚持就是胜利\n\n" +
                  "基于个人经历，那些能够在沟槽的周期里不“裸泳”的家伙们都有以下两个特质：\n他们都有着独立于价格的坚强信念\n他们都建立了多维度的价值锚定系统\n首先我们必须明确，信念（Conviction）不等于执迷不悟或因为“某某大佬”说了什么导致的盲信。\n它不是“今后无论发生什么，打死也不卖”。\n真正的信念是结构性的。而结构性本身就包含了灵活性。你可以拥有巨大的信念，同时也会分批止盈或者调整仓位比例。\n关键的区别在于，你是否总能、且始终如一地回到这个牌桌上来。\n你不会因为音乐停止就离开。你最初出现在这里的理由，从来就不是为了那些红红绿绿的k线，你是因为那个底层的“为什么”而留下的。\n能经周期而屹立不倒的人从来不问：“大佬们，今天是涨是跌啊？” 他们会问：“即便价格在未来几年都持续偏离我的观点，我认可这事的本身逻辑还成立吗？”\n这个思维上的差异，便导致了结果上的天差地别。\n“赚快钱”的思维不仅会掏空你的钱包。\n它更会腐蚀你的信念，摧毁你的信仰体系。\n而再度建立信仰，可要比重建资本要困难得多。\n所以，他们的“多维度价值系统” 究竟是什么？你又该如何构建你自己的呢？\n\n" +
                  "## 第一层：概念锚定（Concept）\n\n" +
                  "别再只盯着k线跳舞了，开始关注核心原则。问问自己：是什么让这个东西值得持有，即便它的价格已经跌穿屏幕了？\n回想一下你最近交易的10个代币。现在，快进两年。问问自己：它们中还有多少会依然“存在”？又有多少还会真的“重要”？\n如果你审视一个标的时，无法在不提及“社区”或“狂暴大牛上月球”的情况下，解释清楚它为何值得投入长期资本，那么你拥有的就不是信念。你拥有的，只是一个仓位。\n\n" +
                  "## 第二层：时间维度（Time）\n\n" +
                  "绝大部分人的行为逻辑是混乱的，他们的决策容易被群体情绪所操纵，就比如以下这个例子：\n今天，他们在某个绝密电报频道跟风买入4个不同的，据说一定上月球的 Meme币\n明天，他们在 Polymarket 上押注某些项目，因为看到推特上有大佬在喊财富密码\n突然之间，他们消失了一阵子\n然后某一天，他们突然私信你，打听某个快要上所的标的\n可不知怎么的，他们却突然买了个隐私板块的标的，却连这个板块是用来做什么的都不知道\n又过了几天，他们在群里喊着“牛回速归”、“大饼蓄能完毕，梭哈！” 无脑做多比特币，只是因为某个新闻头条写着“下个月会涨到20万美元”\n嘿，这可不是策略，这完全是把钱交到别人手里，丢圣杯说不定都比这胜率来的高。\n当然啦，我也不是没见过有人这样做赚到了钱，但我真没见过这类人在两月后还能把这钱守住的。他们唯一留下的，是曾经的辉煌过往和+99999%的心理阴影。\n这类人真正的问题在于，容易被噪音干扰失去主见，同时还开辟了多个超过自己能力以及认知圈的“战场”。\n短期投机、中期布局和长期投资，各自需要完全不同的行为模式。而那些能跨越周期的人，清楚地知道每一个仓位属于哪个时间维度，而且绝不会让情绪跨维度传染。\n他们不会因为短期的价格噪音就否定长期的信念，也不会用长期的叙事来为自己冲动的短线操作找借口。\n如果你正试图从日内交易转向波段交易，以下是一些常见的“自我毁灭”错误：\n你告诉自己现在是个“长期投资者”了，但你80%的时间仍在追逐一次性的新闻头条。\n你看到一个本该在自己风险可控范围内的、微不足道的3%回调，依然会恐慌。\n最糟糕的是，你仍然在用“抢短线赚快钱”的心态去配置仓位和评估风险，导致你又又又卖飞了大趋势。\n从时间维度上锚定，就是通过强迫你在点击“买入”前回答一个极度令人不适的问题，来阻止这个恶性循环：“得要多久我才愿意承认自己'错了'？”\n\n" +
                  "## 第三层：行为层面（Behavior）\n\n" +
                  "你不能只在你顺的时候说你自己“有信仰”，当你的账户一片血红，当的脑海里的声音疯狂尖叫着让你“做点什么”时，那才是真考验。\n你需要建立一套用来预测你自己，而非预测行情的自问自答框架。\n在每笔交易进场前，你需要过一遍以下清单，为了确保未来的你是否会给现在的你使绊子：\n当价格下跌 x% 时，我是否已有计划？\n我是否已经清楚自己会按兵不动、减仓还是退出？\n我是不是屁股决定脑袋的家伙？\n在回撤期间，我是在客观地重新评估投资逻辑，还是在潜意识里搜集信息，只为给恐慌性抛售找理由？\n我是不是在频繁变更自己的目标点位？\n当价格上涨 x% 时，我是否会因为“感觉来了”就变得贪婪，不断推高我的止盈目标？\n我能否在不使用“热度”这个词的情况下解释“持有”的理由？\n除了看情绪、看热度，我能不能清清楚楚地讲出背后持有的理由？\n这是“信念”还是“沉没成本”？\n当一个仓位横盘的时间超出预期时，我持有它是因为投资逻辑依然成立，还是因为我不愿承认自己错了呢？\n我违反规则后的“认错时间”有多长？\n当我违反了一条自己的交易规则时，我是立刻察觉并采取行动，还是非要等到账户亏麻了才反应过来？\n我是否容易进行“复仇交易”？\n一笔亏损后，我是否会立刻感到气血上头，想跳进另一笔交易，只为了“刚刚损了，接着开，必须干回来”？\n这些问题的目的不是为了猜k线怎么走，而是为了勾勒出当你顶着巨大的心理压力时，未来的你是否会背叛现在的你。\n所谓“行为锚点”，本质上就是对压力的预处理。在冷静时定好动作，是为了防止你在绝望时乱搞。\n毕竟，你若没想好用啥计划“玩”交易，那么最终，交易就会开始“玩”你。\n\n" +
                  "## 第四层：信仰维度（Belief）\n\n" +
                  "你有没有发现，最快“消失”的人往往都是是牛市里嗓门最大的那群人：\n“现在是买XX最后的上车机会了”\n“这次之后你不会在看到十万以下的比特币！”\n“听我的，吃麻吃炸吃飞起来，不买xx你就是在和未来对着干！”\n随着价格的反转，这群人一个个烟消云散，他们的“信仰”仿佛从未存在过。\n这种“一夜暴富”的心态不仅会通过频繁交易毁掉你的投资组合，更会腐蚀你的信仰体系。而一个破碎的信仰体系，远比一个银行账户更难重建。\n“快钱总是会引来可悲的过度行为。这是天性，\n就像非洲的动物以腐尸为食一样。”\n—— 查理·芒格\n可悲的是，大多数人就是会在狂欢顶峰时耗尽他们的资本，等到真正的机会（真正的熊市）最终来临时，他们已经没有“子弹”了。\n这真是一个天大的玩笑：将人们带入加密世界的心态、对一夜暴富的渴望，恰恰就是扼杀他们获得财富的元凶。\n大多数人甚至意识不到自己失去了什么，直到多年后比特币再次成倍上涨，他们才拍着大腿问：“我当时怎么就熬不过那点挫折呢？早知道就拿住了。”\n这就是为什么信仰是最重要的一层：它是一个需要多年时间才能形成的信条。\n如何测试你的信念是否足够坚定？\n试试这个：如果此刻有人激烈地质疑你的立场，你能冷静地为其辩护吗？你能坦然面对尖锐的问题，而不是回避它们吗？\n你的信仰应该是极度主观、独一无二的。\n对一些人来说，它是加密朋克精神（Cypherpunk）：一种对管制和中心化控制的彻底反叛。对他们而言，加密不仅仅是一项投资，更是从一个破碎系统中退出的曙光。\n对另一些人来说，它是货币史的另一次迭代：他们看到了法币贬值和金融掠夺的周期循环，认识到加密是对抗每百年都以相似方式崩溃的传统体系的唯一对冲。\n对于某些信仰者，它是主权、中立性或生存权。\n你必须找到你自己的“为什么”，而不是仅仅租用某个大V的理念。我无法告诉你独属于你的信仰应该是什么，但我可以分享我的。\n去年，当我还只有2000个粉丝，没人在乎我说什么的时候，我写了一篇帖子回答一个简单的问题：\n为什么，在经历了所有这些崩盘和归零之后，我仍然购买比特币？\n我称之为：“上帝与人类签订的第四份契约”。\n人类历史上的前三大契约都有一个致命的缺陷：它们从来就不是为所有人准备的。\n第一份是《旧约》\n它由血缘绑定，归属权在你出生前就已决定。如果你不属于被选中的血脉，你便从未有资格。\n第二份是《新约》\n它谈论对所有人的爱与救赎，但历史揭示了言语试图掩盖的真相：如果你是17世纪一个贫穷的亚洲农民，你这辈子都没机会踏进大教堂半步，帝国会把你拦在门口，唯有种族、权力和等级决定了谁才值得被救赎。\n第三份是《独立宣言》\n这是现代世界的诞生，它承诺自由、平等和机会，但前提是你出生在正确的土地上，持有正确的护照，身处正确的体系内。\n当然，从某种意义上说，“迁徙自由”是存在的，但对大多数人来说代价太高了，概率渺茫，这些规则似乎从未为普通人而写。\n大多数人甚至从未到达起跑线，他们得用一生去证明自己“配得上”，用金钱、用教育、用服从、或是用运气，他们一层又一层地乞求这个系统让他们“归属”。\n而如今，第四份契约出现了：《比特币》\n这是人类历史上第一个不问你是谁的系统。\n它不在乎你的种族。它不在乎你的国籍。它不在乎你会说什么语言，也不在乎你出生在哪里。\n这里没有神父，没有政体，没有国界，也不需要许可，只要你和一把私钥。\n你不需要被选中，你不需要有关系，你不需要被批准，你不需要向比特币证明自己。你要么理解它，要么不理解。\n这个体系不承诺你舒适、安全或必然成功，它只提供一件人类从未真正拥有过的东西：在同一时间，让所有人面对同样的规则，拥有同样的准入权。\n对我来说，这不是一个投资论点，这不是一笔交易，也不是一次赌博。这个信念是我能够静坐穿越市场沉浮，忍受多年的寂静、质疑、嘲笑和绝望，并依然持有的唯一原因。\n\n" +
                  "如果你已经耐着性子读到了这里......\n那么恭喜你，你已经拿到了“幸存者”的蓝图。\n你学会了如何识别“共识升级”，你学会了如何使用那份“调查员工具包”来提高早期入场的胜率，你也知道了构建信仰和保持定力需要哪些要素。\n不过，我还是得诚实地告诉你：道法自然，如来。无论你拥有再高端的工具，如果你无法控制使用工具的人，那么永远是力大砖飞。\n我所分享的这一切都源自于我在市场沉浮的13年所经历的无数错误、教训、以及刻骨铭心的伤疤。我写下的这些零碎的反思笔记，也源于和那些同样从战场侥幸存活下来的朋友们，在深夜的一次次对话。\n翻看着我这些凌乱的笔记，我意识到我手头的素材起码能大手一挥写一本书，每一章都能以不同的角度深入探讨加密。\n然而，这些教训无法在一夜之间就让你神功大成，就像“快钱思维”并不能真正让你变得富有一样。\n我目睹了每个周期里的那些“天才”的陨落......亏钱并不是因为他们不聪明，或者棋差一着，而是因为他们都长着一颗“只想搞快钱的脑子”，还端着一副狂妄但“一碰就碎”的自尊。与此同时，那些在2026年仍在获利的人，及那些保住收益并全身而退的人，都共享着一个认知：代币本身从来都不是重点。\n重点是我们正在构建的这个主权体系，以及归属于它所需要的那份个人纪律。\n加密是这个星球上最残酷、最诚实的老师：它会逼出你内心里的魔鬼，也会找到你最薄弱的特质——无论是贪婪、急躁还是懒惰。然后为此向你收取一笔巨额的“学费”。我的那份，我想，我已经全额付清了，哈哈。我唯一的希望是，这篇文章能让你不必付出像我一样多的代价。\n如果你真的从头到尾读完了这些（而不是让AI来帮你总结），那么我真的相信，你有潜力成为我们这些征服了多个周期的幸存者中的一员，你正是那种能真正掌握我在第二部分给出的技能清单的人。\n我真诚地希望，你能成为我新的“老朋友”之一，能与我一起，在下个周期、在下下个周期、在未来无数个周期里，一起成长的战友，一起见证比特币彻底颠覆世界。\n而对于我那些长期的读者们：谢谢你们，正是你们的善意和支持，让我决定回忆我的过往，分享这些经历。\n加密世界或许时常令人糟心，但它依然值得热爱，依然值得为之建设。\n那么，我先走一步，我们下一次“共识升级”时再见。\n—— 泡菜猫"
              }
            ]
          }

        /* ---------- 复盘合集：工具函数 ---------- */
        function fpEsc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function fpInline(s) {
          return fpEsc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        }
        /* 正文轻量格式：## 小标题、**加粗**、- 列表、![说明](路径) 配图、空行分段 */
        function fpRenderBody(text) {
          var lines = String(text || "").split("\n");
          var html = "", inList = false, i, line, imgMatch;
          function closeList() { if (inList) { html += "</ul>"; inList = false; } }
          for (i = 0; i < lines.length; i++) {
            line = lines[i].replace(/^\s+|\s+$/g, "");
            if (!line) { closeList(); continue; }
            imgMatch = /^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(line);
            if (imgMatch) {
              closeList();
              html += '<figure class="fp-fig"><img src="' + fpEsc(imgMatch[2])
                + '" alt="' + fpEsc(imgMatch[1]) + '" loading="lazy" />'
                + (imgMatch[1] ? '<figcaption>' + fpInline(imgMatch[1]) + '</figcaption>' : '')
                + '</figure>';
            } else if (line.indexOf("## ") === 0) {
              closeList();
              html += "<h3>" + fpInline(line.slice(3)) + "</h3>";
            } else if (line.indexOf("- ") === 0) {
              if (!inList) { html += "<ul>"; inList = true; }
              html += "<li>" + fpInline(line.slice(2)) + "</li>";
            } else {
              closeList();
              html += "<p>" + fpInline(line) + "</p>";
            }
          }
          closeList();
          return html;
        }
        function fpFindPerson(pid) {
          for (var i = 0; i < FUPAN_DATA.length; i++) {
            if (FUPAN_DATA[i].id === pid) return FUPAN_DATA[i];
          }
          return null;
        }
        function fpFindArticle(aid) {
          for (var i = 0; i < FUPAN_DATA.length; i++) {
            var arts = FUPAN_DATA[i].articles || [];
            for (var j = 0; j < arts.length; j++) {
              if (arts[j].id === aid) return { person: FUPAN_DATA[i], article: arts[j] };
            }
          }
          return null;
        }
        function fpTotalArticles() {
          var n = 0;
          FUPAN_DATA.forEach(function (p) { n += (p.articles || []).length; });
          return n;
        }
        var FP_BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';
        var FP_SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>';

        /* 人物头像：有 avatar 图片就圆形裁切显示图片，没有就显示名字首字 */
        function fpAvatarHtml(p) {
          if (p.avatar) {
            return '<span class="pc-avatar pc-avatar-img" aria-hidden="true"><img src="' + fpEsc(p.avatar) + '" alt="" /></span>';
          }
          return '<span class="pc-avatar" aria-hidden="true">' + fpEsc((p.name || "?").charAt(0)) + '</span>';
        }

        /* ---------- 复盘合集：一级 · 人物列表 ---------- */
        function fpRenderPeople(root) {
          var total = fpTotalArticles();
          var html = '<a class="fp-back" href="#">' + FP_BACK_ICON + '返回主页</a>'
            + '<p class="fp-kicker">精华复盘合集</p>'
            + '<h2 class="fp-title">币圈大佬精华复盘合集</h2>'
            + '<p class="fp-sub">按人分类整理：先选一位大佬，再从他的文章列表里挑一篇读。</p>'
            + '<div class="fp-stats"><span class="fp-pill"><b>' + FUPAN_DATA.length + '</b> 位大佬</span>'
            + '<span class="fp-pill"><b>' + total + '</b> 篇文章</span></div>'
            + '<div class="fp-pgrid">';
          FUPAN_DATA.forEach(function (p) {
            var n = (p.articles || []).length;
            html += '<a class="person-card" href="#/fupan/person/' + fpEsc(p.id) + '">'
              + fpAvatarHtml(p)
              + '<span class="pc-text"><span class="pc-name">' + fpEsc(p.name) + '</span>'
              + (p.bio ? '<span class="pc-bio">' + fpEsc(p.bio) + '</span>' : '')
              + '<span class="pc-count">共 ' + n + ' 篇文章 →</span></span></a>';
          });
          html += '</div>';
          if (!FUPAN_DATA.length) html += '<div class="fp-empty">还没有收录人物。</div>';
          root.innerHTML = html;
        }

        /* ---------- 复盘合集：二级 · 某人的文章列表 ---------- */
        var fpSortNewFirst = true;
        function fpRenderPerson(root, person) {
          var arts = (person.articles || []).slice();
          var html = '<a class="fp-back" href="#/fupan">' + FP_BACK_ICON + '返回人物列表</a>'
            + '<div class="fp-person-head">' + fpAvatarHtml(person)
            + '<div><h2 class="fp-title" style="margin-top:0">' + fpEsc(person.name) + '</h2>'
            + (person.bio ? '<p class="fp-sub" style="margin-top:6px">' + fpEsc(person.bio) + '</p>' : '') + '</div></div>'
            + '<div class="fp-stats"><span class="fp-pill">共 <b>' + arts.length + '</b> 篇</span></div>';
          /* 还没收录文章的人：只显示空状态，不出搜索和排序工具栏 */
          if (!arts.length) {
            html += '<div class="fp-empty">暂无文章，待收录</div>';
            root.innerHTML = html;
            return;
          }
          html += '<div class="fp-toolbar"><label class="fp-search">' + FP_SEARCH_ICON
            + '<input type="search" id="fpSearch" placeholder="搜索标题、内容…" aria-label="搜索这位大佬的文章" /></label>'
            + '<span class="fp-sort" role="group" aria-label="排序方式">'
            + '<button type="button" id="fpSortNew" class="on">最新优先</button>'
            + '<button type="button" id="fpSortOld">最早优先</button></span>'
            + '<span class="fp-count" id="fpCount"></span></div>'
            + '<div class="fp-grid" id="fpGrid"></div>'
            + '<div class="fp-empty" id="fpEmpty" style="display:none">没有找到匹配的文章，换个关键词试试。</div>';
          root.innerHTML = html;

          var grid = $("fpGrid"), count = $("fpCount"), empty = $("fpEmpty"), input = $("fpSearch");
          function draw() {
            var q = (input.value || "").replace(/^\s+|\s+$/g, "").toLowerCase();
            var list = arts.filter(function (a) {
              if (!q) return true;
              return (a.title + " " + a.summary + " " + a.body).toLowerCase().indexOf(q) !== -1;
            });
            list.sort(function (a, b) {
              if (a.date === b.date) return 0;
              var cmp = a.date < b.date ? -1 : 1;
              return fpSortNewFirst ? -cmp : cmp;
            });
            var h = "";
            list.forEach(function (a, idx) {
              h += '<a class="article-card" href="#/fupan/article/' + fpEsc(a.id) + '">'
                + '<span class="ac-top"><span class="ac-idx">#' + (idx + 1) + '</span>'
                + '<span class="ac-tag">' + fpEsc(a.type) + '</span></span>'
                + '<span class="ac-title" style="display:block">' + fpEsc(a.title) + '</span>'
                + '<span class="ac-meta" style="display:block">' + fpEsc(a.date) + '</span>'
                + '<span class="ac-summary">' + fpEsc(a.summary) + '</span></a>';
            });
            grid.innerHTML = h;
            empty.style.display = list.length ? "none" : "block";
            count.textContent = list.length + " 篇结果";
          }
          input.addEventListener("input", draw);
          $("fpSortNew").addEventListener("click", function () {
            fpSortNewFirst = true;
            $("fpSortNew").classList.add("on"); $("fpSortOld").classList.remove("on");
            draw();
          });
          $("fpSortOld").addEventListener("click", function () {
            fpSortNewFirst = false;
            $("fpSortOld").classList.add("on"); $("fpSortNew").classList.remove("on");
            draw();
          });
          draw();
        }

        /* ---------- 复盘合集：三级 · 阅读页 ---------- */
        function fpRenderArticle(root, found) {
          var p = found.person, a = found.article;
          var html = '<div class="fp-reader">'
            + '<a class="fp-back" href="#/fupan/person/' + fpEsc(p.id) + '">' + FP_BACK_ICON + '返回 ' + fpEsc(p.name) + ' 的文章</a>'
            + '<div style="margin-top:26px"><span class="ac-tag">' + fpEsc(a.type) + '</span></div>'
            + '<h2 class="fp-reader-title">' + fpEsc(a.title) + '</h2>'

            + '</div>';

        /* ---------- 复盘合集：路由（#/fupan、#/fupan/person/<id>、#/fupan/article/<id>）
           不能只依赖地址栏哈希：页面在 App 内嵌的沙箱框架里打开时，读取或写入

           因此所有合集链接都走 initFupan 里的点击委托：点击时先用内部状态直接
           渲染目标视图，再尽力同步哈希（失败静默）；hashchange 只作兜底，
           照顾普通浏览器里的前进/后退和带哈希打开的链接。 ---------- */
        var fpHashSyncing = false;
        /* 当前正在显示的人物专属背景（"" = 无背景）。背景只跟二级人物页走：

           主题倾泻靠这个值判断副本层要不要带照片、带哪一张。 */
        var fpCurrentBg = "";
        function fpSetPhoto(person) {
          var img = $("bgPhoto");
          var bg = person && person.bg ? person.bg : "";
          fpCurrentBg = bg;
          if (bg && img && img.getAttribute("src") !== bg) img.setAttribute("src", bg);
          /* 背景焦点：人物数据里有 bgPos 就对准它（object-position），没有就回到默认焦点，
             保证换人时上一位的焦点不残留 */
          if (img) img.style.objectPosition = (bg && person.bgPos) ? person.bgPos : "";
          document.body.classList.toggle("view-fupan-photo", !!bg);
        }
        function fpGo(h) {
          var root = $("fupanRoot");
          if (!root) return;
          h = h || "";
          var inFupan = h.indexOf("#/fupan") === 0;
          document.body.classList.toggle("view-fupan", inFupan);
          root.classList.toggle("on", inFupan);
          if (!inFupan) { fpSetPhoto(null); return; }
          var parts = h.replace(/^#\//, "").split("/"); /* ["fupan"] / ["fupan","person",id] / ["fupan","article",id] */
          if (parts[1] === "person" && parts[2]) {
            var person = fpFindPerson(decodeURIComponent(parts[2]));
            if (person) { fpSetPhoto(person); fpRenderPerson(root, person); window.scrollTo(0, 0); return; }
          }
          if (parts[1] === "article" && parts[2]) {
            var found = fpFindArticle(decodeURIComponent(parts[2]));
            if (found) { fpSetPhoto(null); fpRenderArticle(root, found); window.scrollTo(0, 0); return; }
          }
          fpSetPhoto(null);
          fpRenderPeople(root);
          window.scrollTo(0, 0);
        }
        function fpSyncHash(h) {
          fpHashSyncing = true;
          try { window.location.hash = h || "#"; } catch (e) { /* 沙箱内写哈希被拦时忽略，内部渲染已经完成 */ }
          setTimeout(function () { fpHashSyncing = false; }, 60);
        }
        function fpRoute() {
          if (fpHashSyncing) return;
          var h = "";
          try { h = window.location.hash || ""; } catch (e) { return; /* 读哈希被拦：保持当前视图不动 */ }
          fpGo(h);
        }
        function initFupan() {
          var desc = $("fpEntryDesc");
          if (desc) {
            desc.textContent = "共 " + FUPAN_DATA.length + " 位大佬 · " + fpTotalArticles() + " 篇文章，点开按人读。";
          }
          /* 点击委托：拦截合集的全部哈希链接（主页入口卡，以及动态生成的人物卡、
             文章卡、返回键），阻止默认跳转后直接渲染目标视图，
             保证在任何容器里点都能打开，不再单靠 hashchange。 */
          document.addEventListener("click", function (e) {
            var t = e.target;
            var a = t && t.closest ? t.closest('a[href^="#"]') : null;
            if (!a) return;
            var href = a.getAttribute("href") || "";
            if (href === "#") {
              e.preventDefault();
              fpGo("");
              fpSyncHash("");
            } else if (href.indexOf("#/fupan") === 0) {
              e.preventDefault();
              fpGo(href);
              fpSyncHash(href);
            }
          });
          window.addEventListener("hashchange", fpRoute);
          fpRoute();
        }

        /* 每个初始化各自兜底：任何一个动效出问题，都不能连累卡片显示和合集打开 */
        function safeInit(fn) { try { fn(); } catch (e) { /* 静默跳过坏掉的单个动效 */ } }
        safeInit(initReveal);
        safeInit(renderSocials);
        safeInit(initRipple);
        safeInit(initTilt);
        safeInit(initThemeToggle);
        safeInit(initFupan);
      })();
    </script>
  </body>
</html>
